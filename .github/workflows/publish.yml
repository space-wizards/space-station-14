name: Publish

concurrency:
  group: publish
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Simulate a publish without any external side effects (no push, no PR, no CDN/Discord/RSS uploads, fail at the end to not clog list of successfu PRs because workflow relies on that).
        required: false
        default: false
        type: boolean
      version:
        description: Optional version tag to apply to the released commit and push (used as-is, e.g. 'v2026.08.0'); adds no tag when empty.
        required: false
        type: string
  # schedule:
   # - cron: '0 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}

    steps:
    - name: Fail if we are attempting to run on the master branch
      if: ${{GITHUB.REF_NAME == 'master' && github.repository == 'space-wizards/space-station-14'}}
      run: exit 1

    - name: Install dependencies
      run: sudo apt-get install -y python3-paramiko python3-lxml

    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0
        filter: blob:none
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Get last publish SHA
      id: last-publish
      run: Tools/actions_get_last_publish_sha.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update changelog
      run: |
        dotnet tool install --global SpaceWizards.ChangelogTool --version 1.0.8
        ss14-changelog update -d Resources/Changelog
      env:
        REPO: ${{ github.repository }}
        BRANCH: stable
        CHANGELOG_REPO_PATH: Resources/Changelog
        EXTRA_CATEGORIES: Admin,Maps,Rules
        GITHUB_TOKEN: ${{ secrets.CL_ACCESS_TOKEN }}
        LAST_PUBLISH_SHA: ${{ steps.last-publish.outputs.last_publish_sha }}

    - name: Commit and push changelog changes
      id: changelog
      run: |
        git config user.name "Space-Wizards-Bot"
        git config user.email "support@spacestation14.com"
        if [ -n "$(git status --porcelain Resources/Changelog)" ]; then
          git add Resources/Changelog
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY-RUN: staged files:"
            git diff --cached --name-only | sed 's/^/DRY-RUN:   /'
            if git commit -m "Update changelog"; then
              git push --dry-run "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}" || true
              # Roll back the throwaway commit. Required by following step dry-run mode.
              git reset --soft HEAD~1
            fi
          else
            git commit -m "Update changelog"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
        fi
      env:
        GH_TOKEN: ${{ secrets.CL_ACCESS_TOKEN }}

    - name: Tag version commit
      if: ${{ github.event.inputs.version != '' }}
      env:
        GH_TOKEN: ${{ secrets.CL_ACCESS_TOKEN }}
        VERSION_TAG: ${{ github.event.inputs.version }}
      run: |
        HEAD_SHA=$(git rev-parse HEAD)
        if [ "$DRY_RUN" = "true" ]; then
          echo "DRY-RUN: would create tag '${VERSION_TAG}' at ${HEAD_SHA} and push it."
        else
          git tag "${VERSION_TAG}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${VERSION_TAG}"
        fi

    - name: Create PR from stable to master
      if: steps.changelog.outputs.committed == 'true'
      env:
        GH_TOKEN: ${{ secrets.CL_ACCESS_TOKEN }}
      run: |
        if [ -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --head stable --base master --state open --json number --jq '.[].number')" ]; then
          if [ "$DRY_RUN" = "true" ]; then
            gh pr create --dry-run --repo "$GITHUB_REPOSITORY" --base master --head stable --title "Stable to master sync after release" --body "Sync from release to master." || echo "::warning::DRY-RUN: PR would not be created (see gh output above)."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base master --head stable --title "Update changelog" --body "Sync from release to master."
          fi
        else
          echo "A changelog PR already exists, skipping."
        fi

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      run: Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}

    - name: Publish changelog (Discord)
      run: Tools/actions_changelogs_since_last_run.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}
        LAST_PUBLISH_SHA: ${{ steps.last-publish.outputs.last_publish_sha }}

    - name: Publish changelog (RSS)
      if: ${{ github.event.inputs.dry_run != 'true' }}
      continue-on-error: true
      run: Tools/actions_changelog_rss.py
      env:
        CHANGELOG_RSS_KEY: ${{ secrets.CHANGELOG_RSS_KEY }}

    - name: Finalize dry run (not a publish)
      if: ${{ github.event.inputs.dry_run == 'true' }}
      run: |
        echo "::error::Dry run completed - nothing was actually published. Exiting non-zero so this run is never recorded as a successful publish and is excluded from future 'Get last publish SHA' lookups."
        exit 1
