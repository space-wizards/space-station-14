name: Publish

concurrency:
  group: publish
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Simulate a publish without any external side effects (no push, no PR, no CDN/Discord/RSS uploads, fail at the end to not clog list of successfu PRs because workflow relies on that).
        required: false
        default: false
        type: boolean
      version:
        description: Optional version tag to apply to the released commit and push (used as-is, e.g. 'v2026.08.0'); adds no tag when empty.
        required: false
        type: string
      skip_changelog_and_tag:
        description: Skip changelog generation, committing it and tagging sources.
        required: false
        default: false
        type: boolean

  # schedule:
   # - cron: '0 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
    permissions:
      contents: read
      issues: read
      actions: read
      pull-requests: write

    steps:
    - name: Announce dry run
      if: ${{ github.event.inputs.dry_run == 'true' }}
      run: |
        echo "################################################################################"
        echo "#                            DRY RUN IS RUNNING                                #"
        echo "#  Nothing will be committed, pushed, tagged, uploaded or posted.              #"
        echo "#  This run is expected to fail at the end and never counts as a publish.      #"
        echo "################################################################################"

    - name: Fail if we are attempting to run on the master branch
      if: ${{GITHUB.REF_NAME == 'master' && github.repository == 'space-wizards/space-station-14'}}
      run: exit 1

    - name: Install dependencies
      run: sudo apt-get install -y python3-paramiko python3-lxml

    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0
        filter: blob:none
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Get last publish SHA
      id: last-publish
      run: Tools/actions_get_last_publish_sha.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update changelog
      if: ${{ github.event.inputs.skip_changelog_and_tag != 'true' }}
      run: |
        dotnet tool install --global SpaceWizards.ChangelogTool --version 1.0.8
        ss14-changelog update -d Resources/Changelog -s ${LAST_PUBLISH_SHA}
      env:
        REPO: ${{ github.repository }}
        BRANCH: to-delete-workflow-refactor-testing
        CHANGELOG_REPO_PATH: Resources/Changelog
        EXTRA_CATEGORIES: Admin,Maps,Rules
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        LAST_PUBLISH_SHA: ${{ steps.last-publish.outputs.last_publish_sha }}

    - name: Commit and push changelog changes
      if: ${{ github.event.inputs.skip_changelog_and_tag != 'true' }}
      id: changelog
      run: |
        git config user.name "Space-Wizards-Bot"
        git config user.email "bot@spacestation14.com"
        if [ -n "$(git status --porcelain Resources/Changelog)" ]; then
          git add Resources/Changelog
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY-RUN: staged files:"
            git diff --cached --name-only | sed 's/^/DRY-RUN:   /'
            if git commit -m "Update changelog"; then
              git push --dry-run "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}" || true
              # Roll back the throwaway commit. Required by following step dry-run mode.
              git reset --soft HEAD~1
            fi
          else
            git commit -m "Update changelog"
            git -c http.https://github.com/.extraheader= \
              push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:${GITHUB_REF_NAME}"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
        fi
      env:
        GH_TOKEN: ${{ secrets.CL_ACCESS_TOKEN }}

    - name: Create PR from to-delete-workflow-refactor-testing to master
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --head to-delete-workflow-refactor-testing --base master --state open --json number --jq '.[].number')" ]; then
          if [ "$DRY_RUN" = "true" ]; then
            gh pr create --dry-run --repo "$GITHUB_REPOSITORY" --base master --head to-delete-workflow-refactor-testing --title "Stable to master sync after release" --body "Sync from release to master." || echo "::warning::DRY-RUN: PR would not be created (see gh output above)."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base master --head to-delete-workflow-refactor-testing --title "Update changelog" --body "Sync from release to master."
          fi
        else
          echo "Merge from to-delete-workflow-refactor-testing to master PR already exist, skipping."
        fi

