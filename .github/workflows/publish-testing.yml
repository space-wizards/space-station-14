name: Publish Testing

concurrency:
  group: publish-testing
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
  - cron: '0 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0
        filter: blob:none
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: sudo apt-get install -y python3-paramiko python3-lxml

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Get source info
      id: source-info
      run: Tools/actions_get_source_info.py

    - name: Install dependencies
      run: dotnet restore

    - name: Update changelog
      run: |
        dotnet tool install --global SpaceWizards.ChangelogTool --version 1.0.8
        ss14-changelog update -d Resources/Changelog
      env:
        REPO: ${{ github.repository }}
        BRANCH: master
        CHANGELOG_REPO_PATH: Resources/Changelog
        EXTRA_CATEGORIES: Admin,Maps,Rules
        GITHUB_TOKEN: ${{ secrets.CL_ACCESS_TOKEN }}

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      run: Tools/publish_multi_request.py --fork-id wizards-testing
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY || github.repository }}
        SOURCE_URL: ${{ steps.source-info.outputs.source_url }}
        SOURCE_COMMIT_ID: ${{ steps.source-info.outputs.source_commit_id }}
        SOURCE_BRANCH_NAME: ${{ steps.source-info.outputs.source_branch_name }}
        ENGINE_SOURCE_URL: ${{ steps.source-info.outputs.engine_source_url }}
        ENGINE_SOURCE_COMMIT_ID: ${{ steps.source-info.outputs.engine_source_commit_id }}
        ENGINE_SOURCE_BRANCH_NAME: ${{ steps.source-info.outputs.engine_source_branch_name }}

    - name: Publish changelog (RSS)
      continue-on-error: true
      run: Tools/actions_changelog_rss.py
      env:
        CHANGELOG_RSS_KEY: ${{ secrets.CHANGELOG_RSS_KEY }}
