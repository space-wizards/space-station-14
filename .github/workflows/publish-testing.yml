name: Publish Testing

concurrency:
  group: publish-testing
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
  - cron: '0 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: sudo apt-get install -y python3-paramiko python3-lxml

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1 --tags
        echo "ENGINE_VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')" >> $GITHUB_ENV

    - name: Check Engine Version Exists
      run: |
        echo "Checking for engine version $ENGINE_VERSION"
        if ! curl -sSf https://robust-builds.cdn.spacestation14.com/manifest.json \
          | jq -e --arg v "$ENGINE_VERSION" 'has($v)' > /dev/null; then
          echo "::error::Engine version $ENGINE_VERSION not found in the manifest (or the manifest could not be fetched)."
          exit 1
        fi
        echo "Engine version $ENGINE_VERSION found."

    - name: Install dependencies
      run: dotnet restore

    - name: Update changelog
      run: |
        dotnet tool install --global SpaceWizards.ChangelogTool --version 1.0.7
        ss14-changelog update -d Resources/Changelog
      env:
        REPO: ${{ github.repository }}
        BRANCH: master
        CHANGELOG_REPO_PATH: Resources/Changelog
        EXTRA_CATEGORIES: Admin,Maps,Rules
        GITHUB_TOKEN: ${{ secrets.CL_ACCESS_TOKEN }}

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      run: Tools/publish_multi_request.py --fork-id wizards-testing
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}

    - name: Publish changelog (RSS)
      continue-on-error: true
      run: Tools/actions_changelog_rss.py
      env:
        CHANGELOG_RSS_KEY: ${{ secrets.CHANGELOG_RSS_KEY }}
