name: Assign merged PRs to release milestone

on:
  pull_request_target:
    types: [ closed ]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    name: Assign PR to latest release milestone
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master' }}
    steps:
      - name: Assign PR to latest open YYYY.MM milestone
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_MILESTONE: ${{ github.event.pull_request.milestone.number }}
        run: |
          set -euo pipefail

          # Release milestone names should contain date in format YYYY.MM (e.g. 2026.11).
          MILESTONES=$(gh api --paginate "repos/${REPO}/milestones?state=open&per_page=100" \
            --jq '.[] | select(.title | test("^[0-9]{4}[.][0-9]{2}$")) | "\(.title)\t\(.number)"' \
            | sort -r)

          LATEST_MILESTONE="${MILESTONES%%$'\n'*}"

          if [[ -z "${LATEST_MILESTONE}" ]]; then
            echo "::warning::No open milestone named YYYY.MM found in ${REPO}, PR #${PR_NUMBER} was not assigned to a milestone."
            exit 0
          fi

          MILESTONE_NUMBER="${LATEST_MILESTONE##*$'\t'}"

          gh api --method PATCH "repos/${REPO}/issues/${PR_NUMBER}" \
            -F milestone="${MILESTONE_NUMBER}" >/dev/null

          echo "Done."
