### EXAMPLE
- Map: # OG-Relic Station SS13 # name of the map
  - file: # /relic.yml # name of the file
  - sourse: # link to PR from which a map first appeared in the repo
      original sourse: # link to a PR from which the map was originally taken from
        ported by: # username / github username of a person who ported from a fork/ss13
  - original author: # username of the original creator(s)
  - in rotation: # (yes/no)  # if the map is currently in map rotation
      since: # (DD.MM.YYYY) [to DD.MM.YYYY] # (date-first in rotation)-[date-last in rotation]
  - maintained: # (yes/no) # if the map is maintained by original author/porter # if no there is none, no need to ask if it needs to be modifed
      by: # (OG / username(s)) # dont include include if not nessesary
