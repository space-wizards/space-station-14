
- type: gameMap
  id: Packed
  mapName: 'Packed'
  mapPath: /Maps/packed.yml
  minPlayers: 0
  maxPlayers: 24
  stations:
    Packed:
      stationProto: StandardNanotrasenStation
      components:
      - type: StationNameSetup
        mapNameTemplate: '{0} Packed {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: 'VG'
      - type: StationEmergencyShuttle
        emergencyShuttlePath: /Maps/Shuttles/emergency_crimson.yml
      - type: StationJobs
        availableJobs:
            # TOTAL: 47 job slots + 0 late-join only
            # Command (7)
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            # Service (7)
            Bartender: [ 1, 1 ]
            Botanist: [ 2, 2 ]
            Chef: [ 1, 1 ]
            Janitor: [ 1, 1 ]
            Chaplain: [ 1, 1 ]
            ServiceWorker: [ 1, 1 ]
            # Engineering (6)
            AtmosphericTechnician: [ 2, 2 ]
            StationEngineer: [ 3, 3 ]
            TechnicalAssistant: [ 1, 1 ]
            # Medical (7)
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 2, 2 ]
            MedicalIntern: [ 2, 2 ]
            Paramedic: [ 1, 1 ]
            # Science (3)
            Scientist: [ 2, 2 ]
            ResearchAssistant: [ 1, 1 ]
            # Security (7)
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 3, 3 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 2, 2 ]
            Lawyer: [ 1, 1 ]
            # Supply (4)
            SalvageSpecialist: [ 2, 2 ]
            CargoTechnician: [ 2, 2 ]
            # Civilian (3 + overflow)
            Passenger: [ -1, -1 ] # infinite, not counted
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            # Silicon (3)
            StationAi: [ 1, 1 ]
            Borg: [ 2, 2 ]
