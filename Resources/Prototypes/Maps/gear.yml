- type: gameMap
  id: gear
  mapName: 'Gear'
  mapPath: /Maps/gear.yml
  minPlayers: 40
  maxPlayers: 80 #big map
  stations:
    gear:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} gear {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'B'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_gear.yml
        - type: StationJobs
          availableJobs: # 69 jobs total w/o latejoins & interns, 85 jobs total w/ latejoins & interns
            #command (7)
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            #service (14)
            Bartender: [ 0, 2 ]
            Botanist: [ 0, 3 ]
            Chef: [ 0, 2 ]
            Janitor: [ 0, 2 ]
            Chaplain: [ 0, 1 ]
            Librarian: [ 0, 1 ]
            ServiceWorker: [ 0, 2 ]
            Reporter: [ 0, 1 ]
            #engineering (8)
            AtmosphericTechnician: [ 1, 2 ]
            StationEngineer: [ 3, 6 ]
            TechnicalAssistant: [ 0, 4 ] #intern, not counted
            #medical (10)
            Chemist: [ 2, 3 ]
            MedicalDoctor: [ 4, 6 ]
            Paramedic: [ 0, 1 ]
            MedicalIntern: [ 0, 4 ] #intern, not counted
            #science (5)
            Scientist: [ 3, 5 ]
            ResearchAssistant: [ 0, 4 ] #intern, not counted
            #security (9)
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 3, 7 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 0, 4 ] #intern, not counted
            Lawyer: [ 0, 2 ]
            #supply (8)
            SalvageSpecialist: [ 1, 3 ]
            CargoTechnician: [ 3, 5 ]
            #civilian (3+)
            Passenger: [ -1, -1 ] #infinite, not counted
            Clown: [ 0, 1 ]
            Mime: [ 0, 1 ]
            Musician: [ 0, 1 ]
            #silicon (5)
            StationAi: [ 1, 1 ]
            Borg: [ 0, 4 ]
