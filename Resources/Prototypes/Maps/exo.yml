- type: gameMap
  id: Exo
  mapName: 'Exo'
  mapPath: /Maps/exo.yml
  minPlayers: 45
  stations:
    Exo:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Exomorph Vessel "Conquest" EXO-{1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_exo.yml
        - type: StationCargoShuttle
          path: /Maps/Shuttles/cargo_exo.yml
        - type: StationJobs
          availableJobs:
            # TOTAL: 66 job slots + 0 late-join only
            # Command (7)
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            # Service (12)
            Bartender: [ 1, 1 ]
            Botanist: [ 2, 2 ]
            Chef: [ 2, 2 ]
            Janitor: [ 2, 2 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            ServiceWorker: [ 2, 2 ]
            Reporter: [ 1, 1 ]
            # Engineering (8)
            AtmosphericTechnician: [ 2, 2 ]
            StationEngineer: [ 4, 4 ]
            TechnicalAssistant: [ 2, 2 ]
            # Medical (9)
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 3, 3 ]
            Paramedic: [ 1, 1 ]
            MedicalIntern: [ 2, 2 ]
            Psychologist: [ 1, 1 ]
            # Science (6)
            Scientist: [ 4, 4 ]
            ResearchAssistant: [ 2, 2 ]
            # Security (11)
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 6, 6 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 2, 2 ]
            Lawyer: [ 1, 1 ]
            # Supply (6)
            SalvageSpecialist: [ 3, 3 ]
            CargoTechnician: [ 3, 3 ]
            # Civilian (3 + overflow)
            Passenger: [ -1, -1 ] # infinite, not counted
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            # Silicon (4)
            StationAi: [ 1, 1 ]
            Borg: [ 3, 3 ]
