# Jobs within an icon group should generally be sorted alphabetically (by ingame name, not prototype name).
# The department head (if any) should always be at the top of the group.
# Non-command roles with raised weight (e.g Warden) should be listed after the department head but before the rest of the group.
# Any jobs currently inaccessible to normal crew (e.g Boxer, Brigmedic, Geneticist) should be listed at the end of the group.

- type: jobIconGroup
  id: CommandIconGroup
  groupName: job-icon-group-command
  sprite:
    sprite: /Textures/Interface/Misc/job_icons.rsi
    state: Captain
  icons:
  - JobIconCaptain
  - JobIconChiefEngineer
  - JobIconChiefMedicalOfficer
  - JobIconHeadOfPersonnel
  - JobIconHeadOfSecurity
  - JobIconQuarterMaster
  - JobIconResearchDirector

