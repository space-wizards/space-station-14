- type: entity
  parent: [ClothingUniformBase, BaseChameleon]
  id: ClothingUniformJumpsuitChameleon
  name: black jumpsuit
  suffix: Chameleon
  description: A generic black jumpsuit with no rank markings.
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuits/Color/color.rsi
    layers:
    - state: icon
      color: "#3f3f3f"
    - state: trinkets-icon
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#3f3f3f"
      - state: trinkets-inhand-left
      right:
      - state: inhand-right
        color: "#3f3f3f"
      - state: trinkets-inhand-right
  - type: Clothing
    sprite: Clothing/Shoes/color.rsi
    clothingVisuals:
      shoes:
      - state: equipped-FEET
        color: "#1d1d1d"
      - state: soles-equipped-FEET
  - type: SuitSensor
    randomMode: false
    mode: SensorOff
  - type: Tag
    tags: # ignore "WhitelistChameleon" tag
    - ClothMade
    - Recyclable
  - type: ChameleonClothing
    slot: [innerclothing]
    default: ClothingUniformJumpsuitColorBlack
