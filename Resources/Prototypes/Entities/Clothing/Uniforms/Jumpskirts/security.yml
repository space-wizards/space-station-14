- type: entity
  parent: [ClothingUniformSkirtBase, BaseCommandContraband]
  id: ClothingUniformJumpskirtHoS
  name: head of security's jumpskirt
  description: It's bright red and rather crisp, much like security's victims tend to be.
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpskirts/Security/hos.rsi
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#C12D30"
        sprite: Clothing/Uniforms/Jumpskirts/Color/color.rsi
      - state: overlay-inhand-left
        sprite: Clothing/Uniforms/Jumpsuits/Security/hos.rsi
      right:
      - state: inhand-right
        color: "#C12D30"
        sprite: Clothing/Uniforms/Jumpskirts/Color/color.rsi
      - state: overlay-inhand-right
        sprite: Clothing/Uniforms/Jumpsuits/Security/hos.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpskirts/Security/hos.rsi

- type: entity
