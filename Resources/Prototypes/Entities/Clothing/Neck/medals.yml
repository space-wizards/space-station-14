- type: entity
  abstract: true
  parent: [SolutionFood, SolutionToolSmall, Clothing]
  id: ClothingMedalBase
  name: medal
  description: A medal to show your mettle. May or may not be made out of metal.
  components:
  - type: Item
    size: Small
  - type: Clothing
    quickEquip: true
    slots:
    - neck
  - type: Sprite
    state: icon
  - type: PhysicalComposition # 50% of the amount of cloth you'd obtain upon butchering
    materialComposition:
      Cloth: 100
  - type: Edible
    requiresSpecialDigestion: true
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 15
  - type: Tag
    tags:
    - Medal
    - MonkeyWearable
    - ClothMade
    - Recyclable
    - WhitelistChameleon

- type: entity
  parent: ClothingMedalBase
  id: ClothingNeckBronzeheart
  name: bronzeheart medal
  description: Given to crewmates who show exemplary bravery in the face of danger.
  components:
  - type: Sprite
    sprite: Clothing/Neck/Medals/bronzeheart.rsi
  - type: Clothing
    sprite: Clothing/Neck/Medals/bronzeheart.rsi

