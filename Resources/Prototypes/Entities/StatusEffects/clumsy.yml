# Every clumsy status for the clown :o)
- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectClumsyClown
  name: clumsy
  components:
  - type: ClumsyCatchStatusEffect
    failDamage:
      types:
        Blunt: 1
  - type: ClumsyDefibStatusEffect
  - type: ClumsyGunStatusEffect
    failDamage:
      types: # Arbitrary values from old ClumsyComponent
        Blunt: 5
        Piercing: 4
        Heat: 3
  - type: ClumsyInjectorStatusEffect
  - type: ClumsyVaultStatusEffect

# A terrible fate
- type: entity
  parent: [ StatusEffectClumsyClown, MobStatusEffectDebuff ]
  id: StatusEffectClumsyCluwne
  components:
  - type: ClumsyCatchStatusEffect
    clumsyChance: &ChanceCluwne 0.8 # Even worse at everything >:o(
    clumsySound: &SoundCluwneHorn
      collection: CluwneHorn
  - type: ClumsyDefibStatusEffect
    clumsyChance: *ChanceCluwne
    clumsySound: *SoundCluwneHorn
  - type: ClumsyGunStatusEffect
    clumsyChance: *ChanceCluwne
    clumsySound: *SoundCluwneHorn
  - type: ClumsyInjectorStatusEffect
    clumsyChance: *ChanceCluwne
    clumsySound: *SoundCluwneHorn
  - type: ClumsyVaultStatusEffect
    clumsyChance: *ChanceCluwne
    clumsySound: *SoundCluwneHorn

# =^_^= nya!
- type: entity
