# Genpop Storage
- type: entity
  abstract: true
  id: GenpopBase
  components:
  - type: UserInterface
    interfaces:
      enum.GenpopLockerUiKey.Key:
        type: GenpopLockerBoundUserInterface
  - type: AccessReader # note! this access is for the UI, not the door. door access is handled on GenpopLocker
    access: [["Security"]]
    examinationText: access-reader-examination-functionality-restricted
  - type: Lock
    locked: false
    useAccess: false
  - type: EntityStorage
    open: True
    removedMasks: 20
  - type: PlaceableSurface
    isPlaceable: True

- type: entity
  parent: [ GenpopBase , LockerBase ]
  id: LockerPrisoner
  name: prisoner closet
  suffix: 1
  description: It's a secure locker for an inmate's personal belongings during their time in prison.
  components:
  - type: Sprite
    sprite: Structures/Storage/Closets/prisoner-secure-1.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          radius: 0.01
          vertices:
          - -0.25,-0.48
          - 0.25,-0.48
          - 0.25,0.48
          - -0.25,0.48
        mask:
        - Impassable
        - TableLayer
        - LowImpassable
        layer:
        - BulletImpassable
        - Opaque
        density: 75
        hard: True
        restitution: 0
        friction: 0.4

