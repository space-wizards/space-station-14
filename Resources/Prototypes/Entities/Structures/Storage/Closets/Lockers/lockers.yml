- type: entity
  parent: LockerBase
  id: LockerBooze
  name: booze storage
  description: This is where the bartender keeps the booze.
  components:
  - type: Sprite
    sprite: Structures/Storage/Closets/service-secure-cabinet.rsi
    layers:
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
    - state: locked
      sprite: Structures/Storage/Closets/service-secure-cabinet.rsi
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
    - state: welded
      visible: false
      sprite: Structures/Storage/Closets/closet-effects.rsi
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: paper
      visible: false
      sprite: Structures/Storage/Closets/closet-effects.rsi
      offset: "-0.065,0"
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: AccessReader
    access: [["Bar"]]
  - type: EntityStorage
    closeSound:
      path: /Audio/Effects/woodenclosetclose.ogg
    openSound:
      path: /Audio/Effects/woodenclosetopen.ogg
  - type: Paintable
    group: null # not shaped like other lockers

