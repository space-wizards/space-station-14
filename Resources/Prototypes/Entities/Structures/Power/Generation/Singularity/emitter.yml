- type: entity
  parent: [ SmallConstructibleMachine, StructureHealthMachineStrong ]
  id: Emitter
  name: emitter
  description: A heavy duty industrial laser. Shoots non-stop when turned on.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 400
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Structures/Power/Generation/Singularity/emitter.rsi
    layers:
    - state: emitter2
    - state: beam
      shader: unshaded
      visible: false
      map: ["enum.EmitterVisualLayers.Lights"]
    - state: locked
      shader: unshaded
      visible: false
      map: ["enum.LockVisualLayers.Lock"]
  - type: Emitter
    alertRadio: true
  - type: NetworkPoweredAmmoProvider
  - type: NotifyOnNonFunctioning
    locDestroyed: emitter-destroyed-broadcast
    locUnlocked: emitter-unlocked-broadcast
    locUnpowered: emitter-unpowered-broadcast
    locUnanchored: emitter-unpowered-broadcast
    locTurnedOff: emitter-turn-off-broadcast
    radioChannel: Engineering
    requirePowered: true
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: EmitterBolt
      modeIcon:
        sprite: Structures/Power/Generation/Singularity/emitter.rsi
        state: projectile
      fireCost: 600
  - type: Gun
    showExamineText: false
    burstCooldown: 1.4
    burstFireRate: 0.5
    selectedMode: Burst
    availableModes:
      - Burst
    soundGunshot:
      path: /Audio/Weapons/emitter.ogg
  - type: AutoShootGun
  - type: PowerConsumer
    voltage: Medium
    drawRate: 5
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: MVPower
  - type: Damageable
    damageModifierSet: PlasteelMod
  - type: ActiveRadio
    channels:
    - Engineering
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 275
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 5
            max: 5
  - type: Anchorable
  - type: Pullable
  - type: Rotatable
  - type: Appearance
  - type: Lock
    locked: false
  - type: LockVisuals
  - type: LockedAnchorable
  - type: LockedWiresPanel
  - type: AccessReader
    access: [[ "Engineering" ]]
  - type: Machine
    board: EmitterCircuitboard
  - type: GuideHelp
    guides:
    - SingularityTeslaEngine
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
      - On
      - Off
      - Toggle
