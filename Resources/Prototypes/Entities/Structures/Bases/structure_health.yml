# This file contains the standardized health values for structures.
# Generally, each type of structure has 3 values for weak, mundane, and strong.

- type: entity
  abstract: true
  id: BaseStructureHealth
  components:
  - type: Destructible
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralInorganic

#region Airlock / Door

- type: entity
  abstract: true
  parent: BaseStructureHealth
  id: StructureHealthDoorFlimsy
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  abstract: true
