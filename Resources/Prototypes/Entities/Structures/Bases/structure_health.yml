# This file contains the standardized health values for structures.
# Minute health differences between similar entities does very little for actual gameplay,
# and by keeping consistent values durability can be better intuited and expected in relation to other entities.
# As a general guide: Furniture < Windows < Machines < Doors < Walls

- type: entity
  abstract: true
  id: BaseStructureHealth
  components:
  - type: Destructible
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralInorganic

#region Furniture

# Poster / faberge egg
- type: entity
  abstract: true
  parent: BaseStructureHealth
  id: StructureHealthFurnitureWeak
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# General furniture like tables and chairs
- type: entity
