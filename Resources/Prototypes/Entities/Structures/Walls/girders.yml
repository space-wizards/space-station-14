- type: entity
  abstract: true
  parent: BaseStructureDynamic
  id: BaseGirder
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - GlassAirlockLayer
  - type: InteractionOutline

- type: entity
  id: Girder
  parent: [ BaseGirder, StructureHealthBarrier ]
  name: girder
  description: A large structural assembly made out of metal; It requires a layer of metal before it can be considered a wall.
  components:
  - type: Construction
    graph: Girder
    node: girder
  - type: Sprite
    sprite: Structures/Walls/solid.rsi
    state: wall_girder
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: StaticPrice
    price: 30

- type: entity
  parent: [ BaseGirder, StructureHealthBarrierWeak ]
  id: ReinforcedGirder
  name: reinforced girder
  description: A large structural assembly made out of metal and plasteel; It requires a layer of plasteel before it can be considered a reinforced wall.
  components:
  - type: Sprite
    sprite: Structures/Walls/solid.rsi
    state: reinforced_wall_girder
  - type: Construction
    graph: Girder
    node: reinforcedGirder
  - type: Damageable
    damageModifierSet: PlasteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -4
      - !type:ChangeConstructionNodeBehavior
        node: girder
  - type: StaticPrice
    price: 130

# soon removed
- type: entity
  parent: [ BaseGirder, StructureHealthBarrier ]
  id: ClockworkGirder
  name: wall gear
  description: A large gear with mounting brackets for additional plating; This could be made into a wall with more brass plating.
  components:
  - type: Sprite
    sprite: Structures/Walls/clock.rsi
    state: wall_gear
  - type: Construction
    graph: ClockworkGirder
    node: clockGirder
  - type: StaticPrice
    price: 75
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetBrass1:
            min: 1
            max: 2
