# These define Meteor Walls separate from Asteroid walls so they have different properties
- type: entity
  id: BaseMeteorRockDestructible
  abstract: true
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 12 #This change makes meteorite walls easier to destroy for cleanup
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6

- type: entity
  id: MeteorRock
  parent: [ AsteroidRock, BaseMeteorRockDestructible ]
  name: meteorite rock
  description: What remains of a meteorite.

# Ore veins
- type: entity
  id: MeteorRockCoal
  parent: [ AsteroidRockCoal, BaseMeteorRockDestructible ]

- type: entity
  id: MeteorRockGold
  parent: [ AsteroidRockGold, BaseMeteorRockDestructible ]

- type: entity
  id: MeteorRockDiamond
  parent: [ AsteroidRockDiamond, BaseMeteorRockDestructible ]

- type: entity
  id: MeteorRockPlasma
  parent: [ AsteroidRockPlasma, BaseMeteorRockDestructible ]
  components:
  - type: OreVein
    oreChance: 1.0  # For some reason this is not set for the plasma asteroid rock?
    currentOre: OrePlasma

- type: entity
  id: MeteorRockQuartz
  parent: [ AsteroidRockQuartz, BaseMeteorRockDestructible ]

- type: entity
  id: MeteorRockSilver
  parent: [ AsteroidRockSilver, BaseMeteorRockDestructible ]

- type: entity
  id: MeteorRockTin
  parent: [ AsteroidRockTin, BaseMeteorRockDestructible ]

- type: entity
  id: MeteorRockUranium
  parent: [ AsteroidRockUranium, BaseMeteorRockDestructible ]
