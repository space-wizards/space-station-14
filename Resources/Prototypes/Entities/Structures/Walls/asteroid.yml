# Rocks and ore veins
- type: entity
  id: WallRock
  parent: BaseWall
  name: rock
  suffix: planetmap
  components:
  - type: Transform
    noRot: true
  - type: SoundOnGather
  - type: Gatherable
    toolWhitelist:
      tags:
      - Pickaxe
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: stone
    index: 0
    base: stone
  - type: Icon
    sprite: Structures/Walls/stone-dirt.rsi
    state: full
  - type: MiningScannerViewable
  - type: Sprite
    sprite: Structures/Walls/stone-dirt.rsi

