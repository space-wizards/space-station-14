#region Wall Rock

# Rocks and ore veins
- type: entity
  parent: [ BaseWall, StructureHealthWallWeak ]
  id: WallRock
  name: rock
  suffix: planetmap
  components:
  - type: Transform
    noRot: true
  - type: SoundOnGather
  - type: Gatherable
    toolWhitelist:
      tags:
      - Pickaxe
  - type: Damageable
    damageModifierSet: RockMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - *SoundStoneBreak
  - type: IconSmooth
    key: stone
    index: 0
    base: stone
  - type: Icon
    sprite: Structures/Walls/stone-dirt.rsi
    state: full
  - type: MiningScannerViewable
  - type: Sprite
    sprite: Structures/Walls/stone-dirt.rsi

