- type: entity
  parent: BaseStructure
  id: Grille
  name: grille
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: CanBuildWindowOnTop
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: Sprite
    drawdepth: Walls
    sprite: Structures/Walls/grille-new.rsi
    layers:
    - state: electrified
      sprite: Effects/electricity.rsi
      map: ["enum.ElectrifiedLayers.Sparks"]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: Structures/Walls/grille-new.rsi
    state: full
  - type: PlacementReplacement
    key: grilles
  - type: IconSmooth
    index: 0
    key: walls
    base: grille
  - type: Damageable
    damageModifierSet: PerforatedMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Electrified
    requirePower: true
    noWindowInTile: true
    highVoltageNode: high
    mediumVoltageNode: medium
    lowVoltageNode: low
  - type: NodeContainer
    nodes:
      high:
        !type:CableDeviceNode
        nodeGroupID: HVPower
      medium:
        !type:CableDeviceNode
        nodeGroupID: MVPower
      low:
        !type:CableDeviceNode
        nodeGroupID: Apc
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ElectrifiedVisuals.ShowSparks:
        enum.ElectrifiedLayers.Sparks:
          True: { visible: True }
          False: { visible: False }
  - type: AnimationPlayer
  - type: TrayScanReveal
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200 #excess damage (nuke?). avoid computational cost of spawning entities.
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: grilleBroken
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: Construction
    graph: Grille
    node: grille

