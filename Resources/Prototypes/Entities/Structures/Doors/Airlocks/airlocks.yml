- type: entity
  parent: Airlock
  id: AirlockXenoborg
  name: mechadermis airlock
  components:
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Standard/exo-xenoborg.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: closed_unlit
      shader: unshaded
      sprite: Structures/Doors/Airlocks/Effects/airlock-effects-exo-xenoborg.rsi
      map: ["enum.DoorVisualLayers.BaseUnlit"]
      visible: true
    - state: welded
      sprite: Structures/Doors/Airlocks/Effects/airlock-effects-exo.rsi
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: bolted_unlit
      shader: unshaded
      sprite: Structures/Doors/Airlocks/Effects/airlock-effects-exo-xenoborg.rsi
      map: ["enum.DoorVisualLayers.BaseBolted"]
    - state: emergency_unlit
      sprite: Structures/Doors/Airlocks/Effects/airlock-effects-exo-xenoborg.rsi
      map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
      shader: unshaded
    - state: panel_open
      sprite: Structures/Doors/Airlocks/Effects/airlock-effects.rsi
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]
    - state: sparks
      sprite: Structures/Doors/Airlocks/Effects/airlock-effects.rsi
      map: ["enum.DoorVisualLayers.BaseEmagging"]
      shader: unshaded
      visible: false
  - type: Paintable
    group: null

