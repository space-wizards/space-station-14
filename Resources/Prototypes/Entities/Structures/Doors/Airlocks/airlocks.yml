- type: entity
  parent: Airlock
  id: AirlockService
  suffix: Service
  components:
  - type: Label
    currentLabel: Service # idk if this will work but lets see
    # localizedLabel: airlock-name-service # use this later for proper localization
  - type: Wires
    layoutId: AirlockService
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Standard/service-base.rsi

- type: entity
  parent: Airlock
  id: AirlockFreezer
  suffix: Freezer
  components:
  - type: Label
    currentLabel: Freezer
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Standard/service-freezer.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: closed_unlit
      shader: unshaded
      sprite: Structures/Doors/Airlocks/Effects/airlock-effects-freezer.rsi
      map: ["enum.DoorVisualLayers.BaseUnlit"]
      visible: true
    - state: welded
      sprite: Structures/Doors/Airlocks/Effects/airlock-effects-freezer.rsi
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: bolted_unlit
      shader: unshaded
      sprite: Structures/Doors/Airlocks/Effects/airlock-effects-freezer.rsi
      map: ["enum.DoorVisualLayers.BaseBolted"]
    - state: emergency_unlit
      sprite: Structures/Doors/Airlocks/Effects/airlock-effects-freezer.rsi
      map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
      shader: unshaded
    - state: panel_open
      sprite: Structures/Doors/Airlocks/Effects/airlock-effects-freezer.rsi
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]
    - state: sparks
      sprite: Structures/Doors/Airlocks/Effects/airlock-effects.rsi
      map: ["enum.DoorVisualLayers.BaseEmagging"]
      shader: unshaded
      visible: false
  - type: Wires
    layoutId: AirlockService

