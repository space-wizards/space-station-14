- type: entity
  parent: [ BaseAirlockSecure, StructureHealthDoorStrong]
  id: HighSecDoor
  name: high security airlock
  description: Keeps the bad out and keeps the good in.
  components:
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Standard/airlock-vault.rsi
  - type: Door
    crushDamage:
      types:
        Blunt: 50
  - type: Weldable
    fuel: 10
    time: 10
  - type: WiresPanelSecurity
    securityLevel: maxSecurity
  - type: Wires
    boardName: wires-board-name-highsec
    layoutId: HighSec
    alwaysRandomize: true
    # Before the reparenting, these they weren't targeted at all, unlike the regular airlocks.
    # Not sure if that was an inheritance mistake or an intentional feature, so I retained some of that behavior
    # by having them be targeted but not explode
  - type: LightningTarget
    lightningExplode: false
  - type: Damageable
    damageModifierSet: PlasteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 350
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1:
            min: 1
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
          params:
            volume: -4
  - type: Construction
    graph: Airlock
    node: highSecDoor
  - type: Tag
    tags:
    - HighSecDoor
    # This tag is used to nagivate the Airlock construction graph. It's needed because this construction graph is shared between Airlock, AirlockGlass, and HighSecDoor
    - DoorRemoteWhitelist
    # This tag is used by door remotes to allow or not a door remote to normally be able to interact with a door
