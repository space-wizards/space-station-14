## Suffix formatting ##
# [ 1, 2-3 , 4 5 ]
# 1. Custom - maps specific or special information - ex. ( 3x4, Exo )
# 2. Group - what group of doors does it fall in to - not always laybaled to not clutter - ex. ( Medical )
# 3. What the door is for, what department is it for, if specified in name, leave blank - ex. ( Mourge )
# 4. Is it locked or not - ex. ( Locked )
# 5. If it is locked, what access can unlock it, if it is the same as the 3, leave blank - ex. ( Medical-Detective-Chaplin )

