# Devices which are not portable but don't link up to anything
- type: entity
  id: AtmosDeviceFanTiny
  name: tiny fan
  description: A tiny fan, releasing a thin gust of air.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/tinyfan.rsi
    state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
  - type: Airtight
    noAirWhenFullyAirBlocked: false
  - type: Clickable
  - type: Tag
    tags:
      - SpreaderIgnore

- type: entity
  id: AtmosDeviceFanDirectional
  name: directional fan
  description: A thin fan, stopping the movement of gases across it.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/directionalfan.rsi
    state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.48,-0.48,0.48,-0.40"
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
      - South
  - type: Clickable
  - type: Tag
    tags:
      - SpreaderIgnore

# Devices which are not portable but don't link up to anything
- type: entity
  parent: AtmosDeviceFanTiny
  id: AtmosDeviceFanTinyPowered
  categories: [ Debug ]
  name: powered tiny fan
  description: A tiny fan, releasing a thin gust of air. Requires power to hold its airtight seal.
  components:
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: ExtensionCableReceiver
  - type: AirtightOnPowered
  - type: Appearance
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/tinyfanpowered.rsi
    layers:
    - state: fan-off
    - state: fan-on
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: light
      shader: "unshaded"
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: {visible: true}
          False: {visible: false}

- type: entity
  parent: AtmosDeviceFanDirectional
  id: AtmosDeviceFanDirectionalPowered
  categories: [ Debug ]
  name: powered directional fan
  description: A thin fan, stopping the movement of gases across it. Requires power to hold its airtight seal.
  components:
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: ExtensionCableReceiver
  - type: AirtightOnPowered
  - type: Appearance
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/directionalfanpowered.rsi
    layers:
    - state: fan-off
    - state: fan-on
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: light
      shader: "unshaded"
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: {visible: true}
          False: {visible: false}
