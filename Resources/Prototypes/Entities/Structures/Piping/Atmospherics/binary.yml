  - type: Construction
    graph: !type:CreateVariants
      values: [ GasBinary, GasBinaryAlt1, GasBinaryAlt2 ]
    node: pressureregulator
  - type: ActivatableUI
    key: enum.GasPressureRegulatorUiKey.Key
    blockSpectators: true
  - type: ActivatableUIRequiresAnchor
  - type: UserInterface
    interfaces:
