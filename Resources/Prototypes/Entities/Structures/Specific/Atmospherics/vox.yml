- type: entity
  abstract: true
  parent: AirSensorBase
  id: AirSensorVoxBase
  suffix: Vox Atmosphere
  components:
  - type: AtmosMonitor
    gasThresholdPrototypes:
      Oxygen: voxOxygen
      Nitrogen: voxNitrogen
      CarbonDioxide: stationCO2
      Plasma: stationPlasma
      Tritium: stationTritium
      WaterVapor: stationWaterVapor
      Ammonia: stationAmmonia
      NitrousOxide: stationNO
      Frezon: danger

- type: entity
  parent: [AirSensorVoxBase, AirSensor]
  id: AirSensorVox

- type: entity
  parent: !type:CreateVariants
    sequences: [ [AirSensorVoxBase, GasVentPump], [AirSensorVoxBase, GasVentPumpAlt1], [AirSensorVoxBase, GasVentPumpAlt2] ]
  id: !type:CreateVariants
    values: [ GasVentPumpVox, GasVentPumpVoxAlt1, GasVentPumpVoxAlt2 ]
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]

- type: entity
  parent: !type:CreateVariants
    sequences: [ [AirSensorVoxBase, GasVentScrubber], [AirSensorVoxBase, GasVentScrubberAlt1], [AirSensorVoxBase, GasVentScrubberAlt2] ]
  id: !type:CreateVariants
    values: [ GasVentScrubberVox, GasVentScrubberVoxAlt1, GasVentScrubberVoxAlt2 ]
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]
  components:
  - type: GasVentScrubber
    wideNet: true # Air alarm with auto mode overrides filters with hardcoded defaults so default to widenet
    filterGases:
    - Oxygen # filter out oxygen as well as regular harmful gases
    - CarbonDioxide
    - Plasma
    - Tritium
    - WaterVapor
    - Ammonia
    - NitrousOxide
    - Frezon

# use this to prevent overriding filters with hardcoded defaults
- type: entity
  parent: AirAlarm
  id: AirAlarmVox
  suffix: Vox Atmosphere, auto mode disabled
  components:
  - type: AirAlarm
    autoMode: false
