- type: entity
  parent: BaseStructure
  id: ChangelingFleshCocoon
  name: flesh cocoon
  description: An oozing mass of flesh, encasing a victim and harvesting their body for nutrients.
  components:
  - type: Transform
    noRot: true
    anchored: false
  - type: Physics
    bodyType: Dynamic
  - type: Sprite
    noRot: true
    sprite: Structures/Changeling/cocoon.rsi
    layers:
    - state: cocoon
  - type: Clickable
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: AlienClaw
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        density: 500
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: AntiRottingContainer
  - type: Solution
    solution:
      reagents:
      - ReagentId: LivingTissue
        Quantity: 5
      - ReagentId: SulfuricAcid
        Quantity: 25
  - type: Damageable
  - type: Injurable
  - type: Destructible
    generateOverkillThreshold: false
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: gib
      - !type:EmptyContainersBehaviour
        containers:
        - storage
      - !type:SpillBehavior
        solution: solution
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: AtmosExposed
  - type: MovedByPressure
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.25
  - type: AmbientSound
    range: 0
    sound:
      path: /Audio/Ambience/bubbling.ogg
  - type: GrowingAmbientSound # Purely to prevent holding those in 1x1 rooms, very difficult to hear anyway.
    maxRange: 6
    minVolume: -12
    rangeGrowth: 1
    volumeGrowth: -0.33 # -12 volume after 12min. By default ambient sound is -10, this prevents the bubbling from being hella annoying but still noticable.
    growthDelay: 120 # 12 min to reach max range of 6. In that time it has produced enough DNA to warrant being noticable. For reference, previously it was always 3 tiles.
  - type: ContainerContainer
    containers:
      storage: !type:Container
  - type: StoreCurrencyGenerator
    collectSound:
      collection: gib
    storeExaminable: true
    currency: ChangelingDNA
  - type: StaticPrice
    price: 75
