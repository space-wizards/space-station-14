- type: entity
  abstract: true
  id: BaseGiantMushroom
  parent: BaseStructure
  components:
  - type: Sprite
    noRot: true
  - type: Transform
    anchored: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.20,-0.45,0.20,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Damageable
    damageModifierSet: Biological
  - type: Injurable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: AtmosDevice
    requireAnchored: false
  - type: GasMiner
    maxExternalPressure: 300
    spawnAmount: 20
    spawnGas: Fungalin
    showStateOnExamine: false

- type: entity
  id: MomMushroom
  parent: BaseGiantMushroom
  name: mom mushroom
  components:
  - type: Sprite
    sprite: Structures/Specific/Mushrooms/mom_mushroom.rsi
    state: icon
  - type: TimedSpawner
    prototypes:
    - GiantSporeSpawner
    intervalSeconds: 40
    minimumEntitiesSpawned: 2
    maximumEntitiesSpawned: 5

- type: entity
  id: RedMushroom
  parent: BaseGiantMushroom
  name: red mushroom
  components:
  - type: Sprite
    sprite: Structures/Specific/Mushrooms/red_mushroom.rsi
    layers:
    - state: top
      shader: unshaded
    - state: base

