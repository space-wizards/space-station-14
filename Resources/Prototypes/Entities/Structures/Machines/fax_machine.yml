- type: entity
  parent: [ BaseMachinePowered, StructureHealthMachineWeak ]
  id: FaxMachineBase
  name: long range fax machine
  description: Bluespace technologies on the application of bureaucracy.
  components:
  - type: Sprite
    sprite: Structures/Machines/fax_machine.rsi
    drawdepth: SmallObjects
    layers:
    - state: icon
    - state: idle
      map: [ "faxEyes" ]
    - state:
      map: [ "enum.FaxFunctions.Printing" ]
    - state:
      map: [ "enum.FaxFunctions.Inserting" ]
  - type: Icon
    sprite: Structures/Machines/fax_machine.rsi
    state: icon
  - type: Appearance
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 25
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: ActivatableUI
    key: enum.FaxUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.FaxUiKey.Key:
        type: FaxBoundUi
  - type: StationAiWhitelist
  - type: ApcPowerReceiver
    powerLoad: 250
  - type: Faxecute
    damage:
      types:
        Blunt: 100
  - type: FaxMachine
    paperSlot:
      insertSound: /Audio/Machines/scanning.ogg
      ejectSound: /Audio/Machines/tray_eject.ogg
      whitelist:
        components:
          - FaxableObject #used to be PaperComponent - brainfood1183
      blacklist:
        components:
          - CargoSlip
  - type: FaxVisuals
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        faxEyes:
          True: { visible: true }
          False: { visible: false }
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      Paper: !type:ContainerSlot
  - type: DeviceNetworkRequiresPower
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: Fax
    transmitFrequencyId: Fax
  - type: RequireProjectileTarget

# Special
- type: entity
  parent: FaxMachineBase
  id: FaxMachineCentcom
  name: CentComm long range fax machine
  suffix: CentCom
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#bfe3ff"
    - state: idle
      map: [ "faxEyes" ]
    - state:
      map: [ "enum.FaxFunctions.Printing" ]
    - state:
      map: [ "enum.FaxFunctions.Inserting" ]
  - type: FaxMachine
    name: "Central Command"
    interactionTimeout: 0.5 # The greatest fax machines this side of the galaxy, with a universal latency of only 500ms!
    paperSlot: # You can insert anything.
      insertSound: /Audio/Machines/scanning.ogg
      ejectSound: /Audio/Machines/tray_eject.ogg
    whitelist: null
    settings: Centcomm
    notifyAdmins: true

- type: entity
  parent: FaxMachineBase
  id: FaxMachineSyndie
  name: syndicate long range fax machine
  suffix: Syndicate
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#a3a3a3"
    - state: idle
      map: [ "faxEyes" ]
    - state:
      map: [ "enum.FaxFunctions.Printing" ]
    - state:
      map: [ "enum.FaxFunctions.Inserting" ]
  - type: FaxMachine
    name: "ERR*?*%!"
    responsePings: false
    notifyAdmins: true
  - type: Emagged
    emagType: Interaction

- type: entity
  parent: FaxMachineBase
  id: FaxMachineCaptain
  name: captain long range fax machine
  suffix: NukeCodes
  components:
    - type: FaxMachine
      name: "Captain's Office"
      receiveNukeCodes: true
    - type: StealTarget
      stealGroup: FaxMachineCaptain
