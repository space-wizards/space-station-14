- type: entity
  parent: StructureHealthMachineWeak
  id: UnfinishedMachineFrame
  name: machine frame
  description: A machine under construction. Needs more parts.
  suffix: Unfinished
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.5,0.25,0.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Clickable
  - type: InteractionOutline
  - type: Anchorable
  - type: Rotatable
  - type: Pullable
  - type: Construction
    containers:
      - machine_board
      - machine_parts
    graph: Machine
    node: missingWires
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: start
  - type: Sprite
    sprite: Structures/Machines/parts.rsi
    state: box_0
    snapCardinals: true

- type: entity
  parent: StructureHealthMachineWeak
  id: MachineFrame
  name: machine frame
  suffix: Ready
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.5,0.25,0.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Clickable
  - type: InteractionOutline
  - type: Anchorable
  - type: Rotatable
  - type: Pullable
  - type: Construction
    graph: Machine
    node: machineFrame
    defaultTarget: machine
    containers:
    - machine_board
    - machine_parts
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: start
      - !type:SpawnEntitiesBehavior
        spawn:
          CableApcStack1:
            min: 0
            max: 1
  - type: MachineFrame
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Sprite
    sprite: Structures/Machines/parts.rsi
    state: box_1
    snapCardinals: true
  - type: Appearance
  - type: ItemMapper
    mapLayers:
      box_2:
        minCount: 1
        whitelist:
          components:
          - MachineBoard

- type: entity
  parent: [ BaseStructureDynamic, StructureHealthMachineFlimsy ]
  id: MachineFrameDestroyed
  name: destroyed machine frame
  placement:
    mode: SnapgridCenter
  components:
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Construction
    graph: Machine
    node: destroyedMachineFrame
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 3
  - type: Sprite
    sprite: Structures/Machines/parts.rsi
    state: destroyed
