- type: entity
  abstract: true
  parent: BaseWallmount
  id: BaseSignIndestructible
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: Structures/Wallmounts/signs.rsi
    snapCardinals: true
  - type: StaticPrice
    price: 20

- type: entity
  abstract: true
  parent: [ BaseWallmountMetallic, BaseSignIndestructible, StructureHealthFurniture ]
  id: BaseSign
  name: base sign
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg

- type: entity
  abstract: true
  parent: [ BaseSignIndestructible, StructureHealthFurnitureWeak ]
  id: BaseSignWeak
  components:
  - type: Damageable
    damageModifierSet: CardboardMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
