- type: entity
  abstract: true
  parent: BaseWallmount
  id: BaseWallmountBoard
  components:
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: BaseWallmountBoard
  id: NoticeBoard
  name: notice board
  description: Is there a job for a witcher?
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/boards.rsi
    layers:
    - state: noticeboard
    - state: notice-0
      map: ["enum.StorageFillLayers.Fill"]
  - type: StorageFillVisualizer
    maxFillLevels: 6
    fillBaseName: notice
  - type: Appearance
  - type: Storage
    grid:
    - 0,0,4,3
    maxItemSize: Small
    whitelist:
      tags:
      - Folder
      - Document
      - Write
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Construction
    graph: WallBoard
    node: noticeBoard

- type: entity
  parent: [ BaseWallmount, BasePaperLabelableVisualized ]
  id: PostBoard
  name: post board
  description: Apply paper directly to the boardhead.
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/boards.rsi
    layers:
    - state: postboard
    - state: paper
      sprite: Structures/Wallmounts/labels.rsi
      map: ["enum.PaperLabelVisuals.Layer"]
    - state: postboard_over
  - type: Construction
    graph: WallBoard
    node: postBoard
