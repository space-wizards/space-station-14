- type: entity
  abstract: true
  parent: [ BaseStructure, StructureHealthFurnitureStrong ]
  id: BaseStatue
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
  - type: Damageable
    damageModifierSet: RockMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg

- type: entity
  parent: BaseStatue
  id: StatueVenusRed
  name: statue of a pure maiden
  suffix: Red
  description: An ancient marble statue. The subject is depicted with a floor-length braid and is wielding a red toolbox.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/statues.rsi
    state: venus_red
    drawdepth: Mobs
    offset: "0.0,0.5"

- type: entity
  parent: BaseStatue
  id: StatueVenusBlue
  name: statue of a pure maiden
  suffix: Blue
  description: An ancient marble statue. The subject is depicted with a floor-length braid and is wielding a blue toolbox.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/statues.rsi
    state: venus_blue
    drawdepth: Mobs
    offset: "0.0,0.5"

- type: entity
  parent: BaseStatue
  id: StatueBananiumClown
  name: bananium savior statue
  description: A bananium statue. It portrays the return of the savior who will rise up and lead the clowns to the great honk.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/statues.rsi
    state: bananium_clown
    drawdepth: Mobs
    offset: "0.0,0.5"
  - type: Construction
    graph: BananiumStatueClown
    node: bananiumStatue
  - type: Damageable
    damageModifierSet: BananiumMod

# Ironsand Statues

- type: entity
  abstract: true
  parent: BaseStatue
  id: BaseIronsandStatue
  description: A mysterious statue found in a desert of iron sand.
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SteelOre1:
            min: 1
            max: 2

- type: entity
  parent: BaseIronsandStatue
  id: StatueIronsandSmall
  name: ironsand small statue
  components:
  - type: Sprite
    sprite: Structures/Decoration/ironsand_statue.rsi
    state: small_pillar
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 60
        mask:
        - MachineMask
        layer:
        - MachineLayer

- type: entity
  parent: BaseIronsandStatue
  id: StatueIronsandSmall2
  name: ironsand small statue
  components:
  - type: Sprite
    sprite: Structures/Decoration/ironsand_statue.rsi
    state: small_pillar_2
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 60
        mask:
        - MachineMask
        layer:
        - MachineLayer

- type: entity
