- type: entity
  parent: [ BaseStructure, StructureHealthFurniture ]
  id: FleshBlocker
  name: flesh clump
  description: An annoying clump of flesh.
  components:
  - type: InteractionOutline
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/flesh_decoration.rsi
    layers:
    - state: closed
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 190
        mask:
        - MachineMask
        layer:
        - Impassable
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          closed: ""
          ajar: ""
          open: ""
  - type: Injurable
    damageContainer: StructuralBiological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: gib
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialSheetMeat1:
            min: 0
            max: 1
