    state: cursed
  - type: StrapOverlay
    layers:
    - sprite: Structures/Furniture/chairs.rsi
      state: cursed-overlay
  - type: Strap
    buckleSound:
      collection: MaleScreams
  - type: Destructible
    thresholds:
    - trigger: *DamageFurnitureNormal
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Voice/Human/womanlaugh.ogg
  - type: Construction
    graph: RitualSeat
