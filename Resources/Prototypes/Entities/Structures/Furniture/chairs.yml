- type: entity
  parent: [ UnanchoredChairBase, StructureHealthFurniture ]
  id: ChairWood
  name: wooden chair
  components:
  - type: Sprite
    state: wooden
  - type: StrapOverlay
    layers:
    - sprite: Structures/Furniture/chairs.rsi
      state: wooden-overlay
  - type: Construction
    graph: Seat
    node: chairWood
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds:
    - trigger: *DamageFurnitureNormal
      behaviors:
      - &SoundWoodDestroy !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
          params:
            volume: -3
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1: *Min0Max1
  - type: StaticPrice
    price: 75

