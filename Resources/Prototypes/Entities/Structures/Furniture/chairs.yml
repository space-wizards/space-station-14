
#region Bases

- type: entity
  abstract: true
  id: SeatBase
  name: chair
  description: You sit in this. Either by will or force.
  placement:
    mode: PlaceFree
  components:
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
  - type: GravityAffected
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - TableMask
  - type: Sprite
    sprite: Structures/Furniture/chairs.rsi
    noRot: true
  - type: Appearance
  - type: Strap
    position: Stand
    buckleOffset: "0,-0.05"
  - type: Pullable
  - type: StaticPrice
    price: 50

#Starts unanchored, cannot be rotated while anchored
- type: entity
  abstract: true
  parent: SeatBase
  id: UnanchoredChairBase
  name: chair
  components:
  - type: Anchorable
  - type: Rotatable

#Start anchored, cannot be rotated while anchored
- type: entity
  abstract: true
  parent: UnanchoredChairBase
  id: ChairBase
  name: chair
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true

#Starts unanchored, can be rotated while anchored
- type: entity
  abstract: true
  parent: UnanchoredChairBase
  id: OfficeChairBase
  name: chair
  components:
  - type: Rotatable
    rotateWhileAnchored: true

#Starts unanchored, can be used as a vehicle
- type: entity
  abstract: true
  parent: [ OfficeChairBase, BaseVehicleStrap ]
  id: OfficeChairVehicleBase
  components:
  - type: Physics
    bodyType: KinematicController
  - type: Vehicle
    requiresHands: false # you use your feet!
  - type: MovementSpeedModifier
    baseAcceleration: 2
    baseFriction: 2
    baseWalkSpeed: 2
    baseSprintSpeed: 3

#Starts anchored, can be rotated while anchored
- type: entity
  abstract: true
  parent: OfficeChairBase
  id: StoolBase
  name: stool
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true

#endregion

- type: entity
  parent: [ ChairBase, StructureHealthFurniture ]
  id: Chair
  name: chair
  components:
  - type: Sprite
    state: chair
  - type: StrapOverlay
    layers:
    - sprite: Structures/Furniture/chairs.rsi
      state: chair-overlay
  - type: Construction
    graph: Seat
    node: chair
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds: &ThresholdsFurnitureNormalSteel
    - trigger: &DamageFurnitureNormal
        !type:DamageTrigger
        damage: 40
      behaviors:
      - &SoundMetalBreak !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - &SpawnSteel01 !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1: &Min0Max1
            min: 0
            max: 1

- type: entity
  name: chair
  id: ChairGreyscale
  parent: Chair
  suffix: White
  components:
  - type: Sprite
    state: chair-greyscale
  - type: StrapOverlay
    layers:
    - sprite: Structures/Furniture/chairs.rsi
      state: chair-greyscale-overlay

- type: entity
  parent: [ ChairBase, StructureHealthFurniture ]
  id: Stool
