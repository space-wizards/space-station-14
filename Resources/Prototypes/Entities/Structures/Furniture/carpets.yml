# TODO move all of this to tiles once tile smoothing is supported

- type: entity

  abstract: true

  parent: BaseStructure

  id: CarpetBase

  name: carpet

  description: "Fancy walking surface."

  components:

  - type: Sprite

    drawdepth: FloorTiles

  - type: Icon

    state: full

  - type: IconSmooth

    key: full

    base: carpet_

    index: 0

  - type: Tag

    tags:

    - Carpet

    - ForceFixRotations

  - type: Physics

    canCollide: true

  - type: Fixtures

    fixtures:

      fix1:

        shape:

          !type:PhysShapeAabb

          bounds: "-0.45,-0.45,0.45,0.45"

        density: 5

        hard: false

        layer:

        - DoorPassable

        - MidImpassable

  - type: Damageable

    damageModifierSet: ThreadMod

  - type: Injurable

  - type: Flammable

    fireSpread: true

    fireSpreadRadius: 1.1

    alwaysCombustible: true

    canExtinguish: true

    damage:

      types:

        Heat: 1

  - type: Appearance

  - type: Reactive

    groups:

      Flammable: [ Touch ]

      Extinguish: [ Touch ]

  - type: ExtinguishableSetCollisionWake

  - type: FireVisuals

    sprite: Effects/fire.rsi

    normalState: fire

    alternateState: 1

  - type: Destructible

    thresholds:

    - trigger: &CarpetBurnTrigger

        !type:DamageTrigger

        damage: 15

      behaviors:

      - !type:SpawnEntitiesBehavior

        spawn:

          Ash: &CarpetAshSpawn

            min: 1

            max: 1

      - !type:DoActsBehavior

        acts: [ "Destruction" ]

  - type: TrayScanReveal

  - type: ToolRefinable

    refineResult:

    - id: MaterialCloth1



