- type: entity
  parent: [BaseDeltaPressurePlasma, BaseWindowStructure, BaseRCDResistant, StructureHealthBarrier]
  id: UraniumWindow
  name: uranium window
  components:
  - type: Sprite
    sprite: Structures/Windows/window-uranium.rsi
  - type: Icon
    sprite: Structures/Windows/window-uranium.rsi
    state: full
  - type: Damageable
    damageModifierSet: GlassMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassUranium:
            min: 1
            max: 2
  - type: IconSmooth
    states:
    - !type:CornerSpriteSmoothing
      mask: [ walls, windows, grilles, marble, doors ]
      base: uwindow
  - type: Construction
    graph: Window
    node: uraniumWindow
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 3
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: StaticPrice
    price: 200
  - type: RadiationBlocker
    resistance: 3

- type: entity
  parent: [BaseDeltaPressurePlasmaQuarter, BaseWindowStructureDirectional, BaseRCDResistant, StructureHealthBarrierWeak]
  id: UraniumWindowDirectional
  name: directional uranium window
  components:
  - type: Sprite
    sprite: Structures/Windows/directional.rsi
    state: uranium_window
  - type: Icon
    sprite: Structures/Windows/directional.rsi
    state: uranium_window
  - type: Construction
    graph: WindowDirectional
    node: uraniumWindowDirectional
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 1.5
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks_directional.rsi
  - type: Damageable
    damageModifierSet: GlassMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassUranium:
            min: 1
            max: 1
  - type: StaticPrice
    price: 100
  - type: RadiationBlocker
    resistance: 1.5

- type: entity
  parent: UraniumWindowDirectional
  id: UraniumWindowDirectionalCorner
  suffix: Corner
  components:
  - type: Sprite
    sprite: Structures/Windows/directional.rsi
    state: uranium_window_corner
  - type: Icon
    sprite: Structures/Windows/directional.rsi
    state: uranium_window_corner
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,-0.28125,-0.28125"
        density: 1500
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Construction
    graph: WindowDirectionalCorner
    node: uraniumWindowDirectionalCorner
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks_directional_corner.rsi

- type: entity
  parent: UraniumWindow
  id: UraniumWindowDiagonal
  suffix: diagonal
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: Structures/Windows/window-diagonal-uranium.rsi
  - type: Tag
    tags:
    - Diagonal
    - Window
  - type: IconSmooth
    states:
    - !type:DiagonalSpriteSmoothing
      mask: [ walls, windows, grilles, marble, doors ]
      base: state
  - type: Icon
    sprite: Structures/Windows/window-diagonal-uranium.rsi
    state: state0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: DamageVisuals
    damageOverlay:
      sprite: Structures/Windows/cracks-diagonal.rsi
  - type: Construction
    graph: WindowDiagonal
    node: uraniumWindowDiagonal
