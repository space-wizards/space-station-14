# Ariral markings

# Ears
- type: marking
  id: AriralEars
  bodyPart: HeadSide
  groupWhitelist: [ Ariral ]
  forcedColoring: true
  sprites:
  - sprite: Mobs/Customization/ariral_ears.rsi
    state: default

- type: marking
  id: AriralLongEars
  bodyPart: HeadSide
  groupWhitelist: [ Ariral ]
  forcedColoring: true
  sprites:
  - sprite: Mobs/Customization/ariral_ears.rsi
    state: long

# Whiskers
- type: marking
