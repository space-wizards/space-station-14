- type: entity
  id: MobSpaceLeechTest
  parent: [ BaseMob, BaseMobAnimal ]
  name: space leech
  description: Something ancient and hungry has found its way aboard.
  suffix: TEST
  components:

  # ── Player control ────────────────────────────────────────────────────────
  - type: Input
    context: "human"
  - type: Eye
    drawFov: true
    drawLight: false
  - type: CombatMode

  # ── Visuals ───────────────────────────────────────────────────────────────
  - type: Sprite
    sprite: Mobs/Aliens/Argocyte/argocyte_common.rsi
    layers:
    - state: enforcer
      map: ["enum.DamageStateVisualLayers.Base"]
  - type: DamageStateVisuals
    states:
      Alive:
        Base: enforcer
      Critical:
        Base: enforcer_dead
      Dead:
        Base: enforcer_dead

  # ── Physics / collision ───────────────────────────────────────────────────
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 200
        mask:
        - MobMask
        layer:
        - MobLayer

  # ── Biology ───────────────────────────────────────────────────────────────
  - type: SolutionContainerManager
  - type: Bloodstream
    maxVolumeModifier: 2.0
    bloodReferenceSolution:
      reagents:
      - ReagentId: FerrochromicAcid
        Quantity: 300
    bloodlossDamage:
      types:
        Bloodloss: 0.5
    bloodlossHealDamage:
      types:
        Bloodloss: -1

  # ── Health ────────────────────────────────────────────────────────────────
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      400: Critical
      500: Dead
  - type: Damageable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:GibBehavior { }
  - type: StatusEffects
    allowed:
    - Electrocution
    - TemporaryBlindness
    - Stun
    - KnockedDown
    - SlowedDown
    - Pacified

  # ── Melee ─────────────────────────────────────────────────────────────────
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    range: 1.8
    damage:
      types:
        Slash: 10

  # ── Stealth ───────────────────────────────────────────────────────────────
  - type: Stealth
  - type: StealthOnMove
    passiveVisibilityRate: -0.15  # rank-0 value; overwritten by SpaceLeechSystem on MapInit
    movementVisibilityRate: 0.15

  # ── Pulling ───────────────────────────────────────────────────────────────
  - type: Puller
    needsHands: false
  - type: Pullable

  # ── Prying ────────────────────────────────────────────────────────────────
  - type: Prying
    speedModifier: 1.0  # rank-0 value; overwritten by SpaceLeechSystem on MapInit
    pryPowered: true
    force: true

  # ── Space Leech state ─────────────────────────────────────────────────────
  - type: SpaceLeech

  # ── Upgrade menu BUI ──────────────────────────────────────────────────────
  - type: UserInterface
    interfaces:
      enum.SpaceLeechUiKey.UpgradeMenu:
        type: SpaceLeechUpgradeMenuBoundUserInterface

  # ── Upgrade menu action ───────────────────────────────────────────────────
  - type: ActionGrant
    actions:
    - ActionSpaceLeechUpgradeMenu

  # ── Sting ability ──────────────────────────────────────────────────────────
  # The action is revoked by SpaceLeechSystem until Venom rank 1 is purchased.
  - type: ActionGun
    action: ActionSpaceLeechSting
    gunProto: SpaceLeechStingGun

  # ── Ghost role ────────────────────────────────────────────────────────────
  - type: GhostRole
    makeSentient: true
    name: ghost-role-information-space-leech-test-name
    description: ghost-role-information-space-leech-test-description
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    raffle:
      settings: default
  - type: GhostTakeoverAvailable

# ── Sting supporting entities ──────────────────────────────────────────────

- type: entity
  id: SpaceLeechStingGun
  categories: [ HideSpawnMenu ]
  name: space leech sting gland
  components:
  - type: BasicEntityAmmoProvider
    proto: ProjectileSpaceLeechSting
    capacity: 1
    count: 1
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/energycrossbow_shoot.ogg
    soundEmpty: null

- type: entity
  parent: BaseBullet
  id: ProjectileSpaceLeechSting
  categories: [ HideSpawnMenu ]
  name: venom bolt
  components:
  - type: Ammo
    muzzleFlash: null
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: crossbowbolt
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Piercing: 1
  - type: SpaceLeechStingProjectile
