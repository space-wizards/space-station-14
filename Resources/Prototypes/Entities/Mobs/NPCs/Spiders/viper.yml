# Viper Spider
- type: entity
  parent: MobSpiderAnimated
  id: MobGiantSpiderViper
  name: viper spider
  description: A frail-looking spider with a dangerously venomous bite.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Animals/Spiders/viperspider.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: idle
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 2
  - type: SolutionManager
    solutions:
    - SolutionVenomSpiderViper
  - type: MeleeChemicalInjector
    transferAmount: 12
    solution: melee
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 6
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Dead

- type: entity
  parent: [SolutionWeapon, SolutionTiny]
  id: SolutionVenomSpiderViper
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      maxVol: 12
      reagents:
      - ReagentId: Mechanotoxin
        Quantity: 12
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Mechanotoxin
        Quantity: 0.1

# Angry Viper Spider
- type: entity
  parent:
  - MobSpiderAngryBase
  - MobGiantSpiderViper
  id: MobGiantSpiderViperAngry
  suffix: Angry
