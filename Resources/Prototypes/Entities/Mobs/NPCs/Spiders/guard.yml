# Guard Spider
- type: entity
  parent: MobSpiderAnimated
  id: MobGiantSpiderGuard
  name: guard spider
  description: A stockier spider that stands its ground and blocks escape routes with webs.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Animals/Spiders/guardspider.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: idle
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 4
  - type: SolutionManager
    solutions:
    - SolutionVenomSpiderGuard
  - type: MeleeChemicalInjector
    transferAmount: 1
    solution: melee
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: MobThresholds
    thresholds:
      0: Alive
      180: Dead

- type: entity
  parent: [SolutionWeapon, SolutionTiny]
  id: SolutionVenomSpiderGuard
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      maxVol: 5
      reagents:
      - ReagentId: Mechanotoxin
        Quantity: 5
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Mechanotoxin
        Quantity: 0.5

# Angry Guard Spider
- type: entity
  parent:
  - MobSpiderAngryBase
  - MobGiantSpiderGuard
  id: MobGiantSpiderGuardAngry
  suffix: Angry
