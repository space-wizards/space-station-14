# Nurse Spider
- type: entity
  parent: MobSpiderAnimated
  id: MobGiantSpiderNurse
  name: nurse spider
  description: A pallid, unsettling spider that oozes something caustic.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Animals/Spiders/nursespider.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: idle
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Piercing: 2
  - type: SolutionManager
    solutions:
    - SolutionVenomSpiderNurse
  - type: MeleeChemicalInjector
    transferAmount: 1
    solution: melee
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 5
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Dead

- type: entity
  parent: [SolutionWeapon, SolutionTiny]
  id: SolutionVenomSpiderNurse
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Mechanotoxin
        Quantity: 10
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Mechanotoxin
        Quantity: 1

# Angry Nurse Spider
- type: entity
  parent:
  - MobSpiderAngryBase
  - MobGiantSpiderNurse
  id: MobGiantSpiderNurseAngry
