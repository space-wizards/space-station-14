# Ambush Spider
- type: entity
  parent: MobSpiderAnimated
  id: MobGiantSpiderAmbush
  name: ambush spider
  description: A heavy-fanged spider that strikes hard at close range.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Animals/Spiders/ambushspider.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: idle
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 9
  - type: SolutionManager
    solutions:
    - SolutionVenomSpiderAmbush
  - type: MeleeChemicalInjector
    transferAmount: 1
    solution: melee
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 4
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Dead

- type: entity
  parent: [SolutionWeapon, SolutionTiny]
  id: SolutionVenomSpiderAmbush
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      maxVol: 4
      reagents:
      - ReagentId: Mechanotoxin
        Quantity: 4
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Mechanotoxin
        Quantity: 0.1

# Angry Ambush Spider
- type: entity
  parent:
  - MobSpiderAngryBase
  - MobGiantSpiderAmbush
  id: MobGiantSpiderAmbushAngry
  suffix: Angry
