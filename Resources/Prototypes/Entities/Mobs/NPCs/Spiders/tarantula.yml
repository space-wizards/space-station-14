# Tarantula Spider
- type: entity
  parent: MobSpiderAnimated
  id: MobGiantSpiderTarantula
  name: tarantula
  description: Widely considered to be the worse thing in existence.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Animals/Spiders/tarantulaspider.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: idle
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Piercing: 4
  - type: SolutionManager
    solutions:
    - SolutionVenomSpiderTarantula
  - type: MeleeChemicalInjector
    transferAmount: 5
    solution: melee

- type: entity
  parent: [SolutionWeapon, SolutionTiny]
  id: SolutionVenomSpiderTarantula
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      maxVol: 5
      reagents:
      - ReagentId: Mechanotoxin
        Quantity: 5
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Mechanotoxin
        Quantity: 0.1

# Angry Tarantula
- type: entity
  parent:
  - MobSpiderAngryBase
  - MobGiantSpiderTarantula
  id: MobGiantSpiderTarantulaAngry
  suffix: Angry
