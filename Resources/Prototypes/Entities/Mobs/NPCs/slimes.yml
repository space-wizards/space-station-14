- type: entity
  abstract: true
  parent: [ BaseMobSlimes, SimpleMobBase, MobCombat, BaseSlicingRefinableButchering, MobNightVision, BaseMobDestructible ]
  id: BaseMobAdultSlimes
  name: basic slime
  description: It looks so much like jelly. I wonder what it tastes like?
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/slimes.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: blue_adult_slime
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 4
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSlime
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatSlime
      amount: 2
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.2
    damageRecovery:
      types:
        Asphyxiation: -1.0
    maxSaturation: 15
  - type: Damageable
    damageModifierSet: Slime
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Slime
        Quantity: 150
    bloodlossDamage:
      types:
        Bloodloss:
          0.5
    bloodlossHealDamage:
      types:
        Bloodloss:
          -0.25
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.45
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
    reactions:
    - reagents: [ Water, SpaceCleaner ]
      methods: [ Touch ]
      effects:
      - !type:WashCreamPie
    - reagents: [ Water ]
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: 0.05 #Same as slime species
      - !type:PopupMessage
        type: Local
        messages: [ "slime-hurt-by-water-popup" ]
        probability: 0.25
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
        path: /Audio/Weapons/punch3.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 6
        Caustic: 4
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-slimes
    interactFailureString: petting-failure-generic
  - type: Speech
    speechVerb: Slime
    speechSounds: Slime
    allowedEmotes: ['Squish']
  - type: TypingIndicator
    proto: slime

- type: entity
  abstract: true
  parent: BaseMobAdultSlimes
  id: MobAdultSlimes
  name: basic slime
  description: It looks so much like jelly. I wonder what it tastes like?
  components:
  - type: ReplacementAccent
    accent: slimes
  - type: GhostTakeoverAvailable
  - type: GhostRole
    prob: 0.05
    makeSentient: true
    name: ghost-role-information-slimes-name
    description: ghost-role-information-slimes-description
    rules: ghost-role-information-nonantagonist-rules
    raffle:
      settings: short
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NPCRetaliation
    attackMemoryLength: 10

- type: entity
  abstract: true
  id: BaseAdultSlimesAngry
  name: base angry slime
  components:
  - type: NpcFactionMember
    factions:
      - SimpleHostile
  - type: GhostRole
    prob: 1
    description: ghost-role-information-angry-slimes-description
    rules: ghost-role-information-angry-slimes-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: short

- type: entity
  parent: MobAdultSlimes
  id: MobAdultSlimesBlue
  name: blue slime
  components:
  - type: DamageStateVisuals
    states:
      Alive:
        Base: blue_adult_slime
      Dead:
        Base: blue_adult_slime_dead

- type: entity
  parent: [ BaseAdultSlimesAngry, MobAdultSlimesBlue ]
  id: MobAdultSlimesBlueAngry
  name: blue slime
  suffix: Angry

- type: entity
  parent: MobAdultSlimes
  id: MobAdultSlimesGreen
  name: green slime
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: green_adult_slime
  - type: DamageStateVisuals
    states:
      Alive:
        Base: green_adult_slime
      Dead:
        Base: green_adult_slime_dead
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 6
        Caustic: 1
        Poison: 4

- type: entity
  parent: [ BaseAdultSlimesAngry, MobAdultSlimesGreen ]
  id: MobAdultSlimesGreenAngry
  name: green slime
  suffix: Angry

- type: entity
  parent: MobAdultSlimes
  id: MobAdultSlimesYellow
  name: yellow slime
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: yellow_adult_slime
  - type: DamageStateVisuals
    states:
      Alive:
        Base: yellow_adult_slime
      Dead:
        Base: yellow_adult_slime_dead
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 6
        Caustic: 4

- type: entity
  parent: [ BaseAdultSlimesAngry, MobAdultSlimesYellow ]
  id: MobAdultSlimesYellowAngry
  name: yellow slime
  suffix: Angry
