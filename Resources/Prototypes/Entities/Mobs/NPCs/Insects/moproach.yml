- type: entity
  parent: MobMothroach
  id: MobMoproach
  name: moproach
  description: This little mothroach has mopshoes on its feet! How adorable!
  components:
  - type: Sprite
    sprite: Mobs/Animals/Insects/mothroach/moproach.rsi
  - type: MovementSpeedModifier
    baseSprintSpeed: 5 # extra speed for that moppin'!
  - type: MobThresholds
    thresholds:
      0: Alive
      45: Critical
      65: Dead
  - type: Clothing
    quickEquip: false
    sprite: Mobs/Animals/Insects/mothroach/moproach.rsi
    equippedPrefix: 0
    slots:
    - HEAD
  - type: SolutionManager
    solutions:
    - SolutionMopMoproach
  - type: Absorbent
    pickupAmount: 2 # small feet
  - type: UseDelay
    delay: 0.5 # quick feet
  - type: InteractionPopup
    interactSuccessString: petting-success-cleanbot
    interactFailureString: petting-failure-cleanbot
  - type: GhostRole
    name: ghost-role-information-moproach-name
    description: ghost-role-information-moproach-description
  - type: HTN
    rootTask:
      task: MoproachCompound

- type: entity
  parent: SolutionMopNormal
  id: SolutionMopMoproach
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 10
  - type: SolutionPurge
    preserve:
    - Water
    quantity: 10
