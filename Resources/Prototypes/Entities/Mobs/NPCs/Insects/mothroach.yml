- type: entity
  parent: [ BaseMobMothroach, BaseCockroach, BaseSlicingRefinableButchering ]
  id: MobMothroach
  name: mothroach
  description: This is the adorable by-product of multiple attempts at genetically mixing mothpeople with cockroaches.
  components:
  - type: Sprite
    sprite: Mobs/Animals/Insects/mothroach/mothroach.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: mothroach
  - type: SpriteMovement
    movementLayers:
      movement:
        state: mothroach-moving
    noMovementLayers:
      movement:
        state: mothroach
  - type: Appearance
  - type: DamageStateVisuals
    states:
      Alive:
        Base: mothroach
      Critical:
        Base: mothroach_dead
      Dead:
        Base: mothroach_dead
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Mouse_burning
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 120
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 4
    weightlessAcceleration: 1.5
    weightlessFriction: 1
    baseWeightlessModifier: 1
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Critical
      60: Dead
  - type: Damageable
    damageModifierSet: Moth
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTypeTrigger
        damageType: Blunt
        damage: 60
      behaviors:
      - !type:GibBehavior
        recursive: false
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.5
    damageRecovery:
      types:
        Asphyxiation: -0.5
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: InsectBlood
        Quantity: 20
  - type: Item
    size: Normal
  - type: Clothing
    quickEquip: false
    sprite: Mobs/Animals/Insects/mothroach/mothroach.rsi
    equippedPrefix: 0
    slots:
    - HEAD
  - type: InventorySlots
  - type: Inventory
    speciesId: hamster
    templateId: hamster
    displacements:
      head:
        sizeMaps:
          32:
            sprite: Mobs/Animals/Insects/mothroach/displacement.rsi
            state: head
      mask:
        sizeMaps:
          32:
            sprite: Mobs/Animals/Insects/mothroach/displacement.rsi
            state: mask
      suitstorage:
        sizeMaps:
          32:
            sprite: Mobs/Animals/Insects/mothroach/displacement.rsi
            state: suitstorage
      eyes:
        sizeMaps:
          32:
            sprite: Mobs/Animals/Insects/mothroach/displacement.rsi
            state: eyes
      neck:
        sizeMaps:
          32:
            sprite: Mobs/Animals/Insects/mothroach/displacement.rsi
            state: neck
  - type: Strippable
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: CanEscapeInventory
  - type: CombatMode
  - type: Solution
    solution:
      reagents:
      - ReagentId: Slime
        Quantity: 20
  - type: Extractable
    grindableSolutionName: food
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatSlime
      amount: 2
  - type: NameIdentifier
    group: AdjectivePrefix
  - type: Speech
    speechVerb: Moth
    speechSounds: Squeak
    allowedEmotes: [ 'Chitter', 'Squeak', 'Flap' ]
  - type: Vocal
    emoteSounds: UnisexMoth
    wilhelmProbability: 0.001
  - type: BodyEmotes
    soundsId: MothBodyEmotes
  - type: MothAccent
  - type: ReplacementAccent
    accent: mothroach
  - type: ZombieAccentOverride
    accent: zombieMoth
  - type: TypingIndicator
    proto: moth
  - type: FaxableObject
    insertingState: inserting_mothroach
  - type: Tag
    tags:
    - Trash
    - CannotSuicide
    - VimPilot
  - type: MobPrice
    price: 150
  - type: NpcFactionMember
    factions:
    - Mouse
  - type: GhostTakeoverAvailable
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: ghost-role-information-mothroach-name
    description: ghost-role-information-mothroach-description
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgentHarmless
