- type: entity
  parent: [ BaseMobRuminant, SimpleMobBase, BaseSlicingRefinableButchering, BaseMobDestructible, BaseExaminableHunger ]
  id: MobCow
  name: cow
  description: Moo.
  components:
  - type: Sprite
    sprite: Mobs/Animals/Farm/cow.rsi
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
  - type: Tag
    tags:
    - DoorBumpOpener
    - Cow
  - type: Reproductive
    minHungerThreshold: Peckish
    partnerWhitelist:
      tags:
      - Cow
    offspring:
    - id: MobCow
  - type: ReproductivePartner
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.40
        density: 400
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: SolutionManager
    solutions:
    - SolutionUdder
  - type: HarvestableSolution
    solutionName: udder
    verbText: udder-system-verb-milk
    emptyMessage: udder-system-dry
    successMessage: udder-system-success
  - type: ToolRefinable
    refineResult:
    - id: FoodMeat
      amount: 5
  - type: Grammar
    attributes:
      gender: female # Milk-producing animals are female.
  - type: InteractionPopup
    successChance: 0.7
    interactDelay: 2 # Avoids overlapping SFX due to spam - these SFX are a little longer than the typical 1 second.
    interactSuccessString: petting-success-soft-floofy
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/cow_moo.ogg
  - type: Perishable
    molsPerSecondPerUnitMass: 0.0015
  - type: NpcFactionMember
    factions:
    - Passive
  - type: HTN
    rootTask:
      task: RuminantCompound
  - type: GuideHelp
    guides:
    - Chef
    - FoodRecipes

- type: entity
  parent: SolutionLarge
  id: SolutionUdder
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: udder # TODO This should really use a different id...
    solution:
      reagents:
      - ReagentId: Milk
        Quantity: 30
  - type: SatiationProduction
    producer: Parent
    delay: 30
    minimumSatiationThreshold: Peckish
  # TODO: toxins from bloodstream !?
  - type: SolutionProducer
    generated:
      reagents:
      - ReagentId: Milk
        Quantity: 25
