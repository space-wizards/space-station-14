- type: entity
  abstract: true
  parent: [ BaseMobRuminant, BaseSlicingRefinableButchering, BaseExaminableHunger ]
  id: MobSheepBase
  name: sheepBase
  description: A sheep.
  components:
  - type: Sprite
    sprite: Mobs/Animals/Farm/sheep.rsi
    drawdepth: Mobs
    layers:
    - state: sheep_bare
      map: [ "enum.DamageStateVisualLayers.Base" ]
      visible: true
    # this wooly layer relates to the shearable component.
    - state: sheep_wool
      map: [ "wooly" ]
      visible: true
  - type: GenericVisualizer
    visuals:
      enum.ShearableVisuals.Shearable:
        wooly:
          True: {visible: true}
          False: {visible: false}
      enum.MobStateVisuals.State:
        wooly:
          Alive: {state: sheep_wool}
          Dead: {state: sheep_wool_dead}
          Critical: {state: sheep_wool_dead}
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 150
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Tag
    tags: # let moths eat wool directly
    - ClothMade
    - DoorBumpOpener
    - Sheep
  - type: Reproductive
    partnerWhitelist:
      tags:
      - Sheep
    offspring:
    - id: MobSheep
  - type: ReproductivePartner
  - type: Appearance
  - type: DamageStateVisuals
    states:
      Alive:
        Base: sheep_bare
      Critical:
        Base: sheep_dead
      Dead:
        Base: sheep_dead
  - type: SolutionManager
    solutions:
    - SolutionUdderSheep
    - SolutionWoolSheep
  - type: HarvestableSolution
    solutionName: udder
    verbText: udder-system-verb-milk
    emptyMessage: udder-system-dry
    successMessage: udder-system-success
  - type: Shearable
    targetSolutionName: wool
    shearedProductId: MaterialCotton1 # Cotton is spawned because there is no wool item.
    solutionPerProduct: 2.5 # 1 Cotton contains 2.5 Fibre, therefore this is the same.
    toolQuality: Shearing
    shearableMarkupText: sheep-shearable-examine-markup
    unShearableMarkupText: sheep-not-shearable-examine-markup
  - type: Edible
    destroyOnEmpty: false
    solution: wool
    requiresSpecialDigestion: true
    requireDead: false
  - type: ToolRefinable
    refineResult:
    - id: FoodMeat
      amount: 4
  - type: Grammar
    attributes:
      gender: female # Milk-producing animals are female.
  - type: Speech
    speechSounds: Sheep
    speechVerb: Sheep
  - type: Vocal
    emoteSounds: Sheep
  - type: BleatingAccent
  - type: InteractionPopup
    successChance: 0.8 #SHEEP so FRIEND!!! HUG! SQUISHY! SOFT!
    interactDelay: 1
    interactSuccessString: petting-success-sheep
    interactFailureString: petting-failure-sheep
    interactSuccessSpawn: EffectHearts #🥰
    interactSuccessSound:
      collection: Sheep
      params:
        variation: 0.05
  - type: Perishable
    molsPerSecondPerUnitMass: 0.0015
  - type: NpcFactionMember
    factions:
    - Passive
  - type: HTN
    rootTask:
      task: RuminantCompound
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.6
    baseSprintSpeed: 0.8
  - type: GuideHelp
    guides:
    - Chef
    - FoodRecipes

- type: entity
  parent: [ MobSheepBase, SimpleMobBase, BaseMobDestructible ]
  id: MobSheep
  name: sheep
  description: An adorable genetically engineered chemical factory producing milk and cotton.

- type: entity
  parent: SolutionWool
  id: SolutionWoolSheep
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 25

- type: entity
  parent: SolutionUdder
  id: SolutionUdderSheep
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: MilkSheep
        Quantity: 25
  - type: SatiationProduction
    delay: 20
  - type: SolutionProducer
    generated:
      reagents:
      - ReagentId: MilkSheep
        Quantity: 25

- type: entity
  parent: MobSheep
  id: MobSheepRainbow
  name: rainbow sheep
  description: A sheep; this one seems... glowy.
  components:
  - type: PointLight
    radius: 1.5
    energy: 0.5
  - type: RgbLightController
    layers: [ 1 ]
  - type: Shearable
    targetSolutionName: wool
    shearedProductId: LeavesCannabisRainbow
    solutionPerProduct: 6 # How much solution should it take to spawn 1 product?
    toolQuality: Shearing
    shearableMarkupText: rainbow-sheep-shearable-examine-markup
    unShearableMarkupText: rainbow-sheep-not-shearable-examine-markup
    verb: rainbow-sheep-shearable-verb
  - type: SolutionManager
    solutions:
    - SolutionUdderSheep
    - SolutionWoolSheepRainbow
  - type: FlavorProfile
    flavors:
    - leafy

- type: entity
  parent: SolutionWool
  id: SolutionWoolSheepRainbow
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: SpaceDrugs
        Quantity: 25
  - type: SolutionProducer
    generated:
      reagents:
      - ReagentId: SpaceDrugs
        Quantity: 25
