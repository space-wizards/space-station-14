  - type: Item
    heldPrefix: 1
  - type: EyeBlinking
    eyelidsColor: "#b57f4c"

- type: entity
  parent: MobMouse
  id: MobMouse2
  components:
  - type: Sprite
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: mouse-2
    - map: ["enum.HumanoidVisualLayers.Eyelids"]
  - type: SpriteMovement
    movementLayers:
      movement:
        state: mouse-moving-2
    noMovementLayers:
      movement:
        state: mouse-2
  - type: Clothing
    equippedPrefix: 2
  - type: DamageStateVisuals
    states:
      Alive:
        Base: mouse-2
      Critical:
        Base: dead-2
      Dead:
        Base: splat-2
  - type: Item
    heldPrefix: 2
  - type: EyeBlinking
    eyelidsColor: "#6b6b6b"

- type: entity
  name: cancer mouse
  description: Toxic. Squeak!
  parent: MobMouse
  id: MobMouseCancer
  components:
  - type: GhostRole
    name: ghost-role-information-cancer-mouse-name
    description: ghost-role-information-cancer-mouse-description
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgent
  - type: Sprite
    color: LightGreen
  - type: PointLight
    color: LightGreen
    radius: 5
    energy: 5
    netsync: false
  - type: RadiationSource
    intensity: 0.5
    slope: 0.3
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: UnstableMutagen
        Quantity: 50
  - type: Solution
    solution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 5
      - ReagentId: Uranium
        Quantity: 10
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatRat
      amount: 1
    - id: SheetUranium1
      amount: 1
  - type: Damageable
    damageModifierSet: Zombie
