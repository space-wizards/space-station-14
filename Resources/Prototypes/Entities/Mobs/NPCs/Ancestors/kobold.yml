- type: entity
  abstract: true
  parent: MobBaseAncestor
  id: MobBaseKobold
  name: kobold
  description: Cousins to the sentient race of lizard people, kobolds blend in with their natural habitat and are as nasty as monkeys; ready to pull out your hair and stab you to death.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      sprite: Mobs/Animals/Ancestors/kobold.rsi
      state: kobold
    - map: [ "outline" ]
      sprite: Mobs/Animals/Ancestors/kobold.rsi
      state: outline
    - map: [ "horns" ]
      sprite: Mobs/Customization/reptilian_parts.rsi
      state: horns_short
    - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
    - map: [ "ears" ]
    - map: [ "id" ]
    - map: [ "mask" ]
    - map: [ "head" ]
  - type: RandomSprite
    getAllGroups: true
    available:
    - enum.DamageStateVisualLayers.Base:
        kobold: KoboldColors
    - horns:
        horns_curled: KoboldHornColors
        horns_ram: KoboldHornColors
        horns_short: KoboldHornColors
        horns_myrsore: KoboldHornColors
        horns_bighorn: KoboldHornColors
        horns_argali: KoboldHornColors
        horns_ayrshire: KoboldHornColors
        horns_floppy_kobold_ears: Inherit
        horns_double: Inherit
        horns_kobold_ears: Inherit
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Critical
      125: Dead
  - type: TemperatureDamage
    heatDamageThreshold: 360
    coldDamageThreshold: 285
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
        Piercing: 4
  - type: NameIdentifier
    group: Kobold
  - type: Speech
    speechSounds: Lizard
    speechVerb: Reptilian
    allowedEmotes: [ 'Thump' ]
  - type: Vocal
    emoteSounds: MaleReptilian
  - type: BodyEmotes
    soundsId: ReptilianBodyEmotes
  - type: Deathgasp
    prototype: KoboldDeathgasp
  - type: LizardAccent
  - type: ReplacementAccent
    accent: kobold
  - type: TypingIndicator
    proto: lizard
  - type: InteractionPopup
    successChance: 0.9
    interactSuccessString: petting-success-monkey
    interactFailureString: petting-failure-monkey
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/lizard_happy.ogg
    interactFailureSound:
      path: /Audio/Items/wirecutter.ogg
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 2
  - type: GhostTakeoverAvailable
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-kobold
  - type: AlwaysRevolutionaryConvertible
  - type: GhostRole
    prob: 0.05
    makeSentient: true
    name: ghost-role-information-kobold-name
    description: ghost-role-information-kobold-description
    rules: ghost-role-information-nonantagonist-rules

- type: entity
  parent: MobBaseKobold
  id: MobKobold
  name: kobold
  description: Cousins to the sentient race of lizard people, kobolds blend in with their natural habitat and are as nasty as monkeys; ready to pull out your hair and stab you to death.
  components:
  - type: PermanentStatusEffects
    statusEffects:
    - StatusEffectClumsyKobold

- type: entity
  parent: MobBaseKobold
  id: MobBaseSyndicateKobold
  suffix: syndicate base
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: Loadout
    prototypes: [SyndicateOperativeGearMonkey]

- type: entity
  parent: MobBaseSyndicateKobold
  id: MobKoboldSyndicateAgent
  suffix: syndicate agent
  components: # make the player a traitor once its taken
  - type: AutoTraitor
    profile: TraitorReinforcement

- type: entity
  parent: MobBaseSyndicateKobold
  id: MobKoboldSyndicateAgentNukeops # Reinforcement exclusive to nukeops uplink
  suffix: NukeOps
  components:
  - type: NukeOperative
