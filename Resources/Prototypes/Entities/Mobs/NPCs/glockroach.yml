- type: entity
  name: glockroach
  parent: [MobMothroach, BaseSecurityContraband] # it is contraband because it has a gun!
  id: MobGlockroach
  description: "The unholy result of crossbreeding 'murican cockroaches with the humble mothroach."
  components:
  - type: GhostRole
    name: ghost-role-information-glockroach-name
    description: ghost-role-information-glockroach-description
  - type: MobThresholds
    thresholds:
      0: Alive
      45: Critical
      65: Dead
  - type: Hands
    activeHandId: Hand
    hands:
      Hand:
        location: Left
    canBeStripped: false
  - type: Loadout
    prototypes: [ GlockroachGear ]
  - type: InteractionPopup
    interactSuccessString: petting-success-glockroach
    interactFailureString: petting-failure-glockroach

- type: startingGear
  id: GlockroachGear
  inhand:
   - WeaponPistolGlockroach

- type: entity
  name: glockroach mk 58 # I lied. This isn't a glock 17 or whatever. I actually do not know how IRL guns work at all so a mk58 is what this mothroach gets.
  parent: BaseItem
  id: WeaponPistolGlockroach
  description: Oh no.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/mk58.rsi
    layers:
      - state: base
      - state: mag-0
  - type: Gun
    fireRate: 5
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/pistol.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgePistol
    capacity: 10
    proto: CartridgePistol
    cycleable: false # So no infinite ammo
  - type: AmmoCounter
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Unremoveable
  - type: BallisticAmmoSelfRefiller # the glockroach needs its ammo!
    autoRefillRate: 4s

