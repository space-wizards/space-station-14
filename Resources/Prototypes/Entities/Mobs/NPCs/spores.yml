- type: entity
  parent: DrinkCanBaseFull
  id: DrinkieFungalCan
  name: fungal can
  description: wawa
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fungalin
        Quantity: 40
  - type: Sprite
    sprite: Objects/Consumable/Drinks/beer_can.rsi
  - type: Item
    sprite: Objects/Consumable/Drinks/beer_can.rsi
  - type: Tag
    tags:
    - Beer
    - DrinkCan
