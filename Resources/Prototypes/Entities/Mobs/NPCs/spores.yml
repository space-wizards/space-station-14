- type: entity
  abstract: true
  id: BaseGiantSpore
  parent: [ SimpleSpaceMobBase, FlyingMobBase ]
  components:
  - type: Sprite
    sprite: Mobs/Plants/Mushrooms/giant_spore.rsi
    state: icon
  - type: PointLight
    enabled: true
    color: "#000000"
    radius: 2
    energy: 2
  - type: Item
    size: Normal
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 5
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: PassiveDamage
    pauseWhenStored: true
    allowedStates:
    - Alive
    damage:
      types:
        Cellular: 0.25
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          GiantMushroomSpawner:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

