## Spawners

- type: entity
  id: GiantSporeSpawner
  name: giant spore spawner
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: GiantSporeSpawnerTable

- type: entityTable
  id: GiantSporeSpawnerTable
  offset: 0.5
  table: !type:GroupSelector
    children:
    - id: RedGiantSpore
    - id: OrangeGiantSpore
    - id: YellowGiantSpore
    - id: GreenGiantSpore
    - id: PurpleGiantSpore
    - id: PinkGiantSpore

- type: entity
  id: GiantMushroomSpawner
  name: giant mushroom spawner
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: GiantSporeSpawnTable

- type: entityTable
  id: GiantSporeSpawnTable
  offset: 0.5
  table: !type:GroupSelector
    children:
    - id: RedMushroom
    - id: OrangeMushroom
    - id: YellowMushroom
    - id: GreenMushroom
    - id: BlueMushroom
    - id: PurpleMushroom
    - id: PinkMushroom

