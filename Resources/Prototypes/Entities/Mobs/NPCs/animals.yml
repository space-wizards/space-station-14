# Would be cool to have some functionality for the parrot to be able to sit on stuff
- type: entity
  parent: [ SimpleMobBase, FlyingMobBase, BaseSlicingRefinableButchering, BaseMobDestructible ]
  id: MobParrotBase
  name: parrot
  abstract: true
  description: Infiltrates your domain, spies on you, and somehow still a cool pet.
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 6
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: parrot
      sprite: Mobs/Animals/parrot/parrot.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 10
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: parrot
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: ToolRefinable
    refineResult:
    - id: FoodMeat
      amount: 1
  - type: Speech
    speechSounds: Parrot
    speechVerb: Parrot
  - type: Vocal
    emoteSounds: Parrot
  - type: ActiveListener
  - type: Vocalizer
  - type: RadioVocalizer
  - type: ParrotListener
  - type: ParrotMemory
  - type: Inventory
    templateId: parrot
    speciesId: parrot
    # transparent displacement map to hide the headset. this should be an animated displacement map to follow the parrot
    # as it bobs up and down, but this in turn needs some way to change the displacement map on inventory entities when
    # the parrot dies, otherwise the visuals will be broken
    displacements:
      ears:
        sizeMaps:
          32:
            sprite: Mobs/Animals/parrot/displacement.rsi
            state: ears
  - type: InventorySlots
  - type: Strippable
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: InteractionPopup
    successChance: 0.6
    interactSuccessString: petting-success-bird
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/parrot_raught.ogg
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 50

- type: entity
  parent: MobParrotBase
  id: MobParrot
  components:
  - type: ParrotAccent # regular parrots have a parrotaccent. Polly is special and does not

