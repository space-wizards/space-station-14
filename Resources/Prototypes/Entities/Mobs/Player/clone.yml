# Settings for cloning bodies
# If you add a new trait, job specific component or a component doing visual/examination changes for humanoids
# then add it here to the correct prototype.
# The datafields of the components copied using CopyComp.
# If you need persistent fields (carrying over values after cloning)
# or other special overwrite logic, add it to CloningContext.
# And finally, if you need other oddball behavior, like unzombifying a clone,
# add a ClonedEvent handler - this should not be used for copying data where possible.

# Traits that root mentally or otherwise only affect you mentally.
- type: cloningSettings
  id: TraitsMental
  components:
  - LightweightDrunk
  - Pacified
  - Paracusia

# Traits that root in physical things in your body.
- type: cloningSettings
  id: TraitsPhysical
  components:
  - BlackAndWhiteOverlay
  - ImpairedMobility
  # - LegsParalyzed (you get healed)
  - Narcolepsy
  - PermanentBlindness
  - Snoring
  - Unrevivable

- type: cloningSettings
  parent: [TraitsMental, TraitsPhysical]
  id: Traits

# for basic physical traits
- type: cloningSettings
  id: Body
  components:
  # general
  - DetailExaminable
  - Dna
  - Fingerprint
  - Grammar # Pronouns
  - HumanoidProfile # Age, Sex, Gender
  - InnerBodyAnomalyVisuals # How you look with anomalies
  - MeleeWeapon # Attack animation, damage and sound
  - NpcFactionMember
  - RandomPrice
  - TemperatureDamage
  - TemperatureSpeed
  # accents
  - Accentless
  - BackwardsAccent
  - BarkAccent
  - BleatingAccent
  - DamagedSiliconAccent
  - FrenchAccent
  - FrontalLisp
  - GermanAccent
  - LizardAccent
  - MobsterAccent
  - MonkeyAccent
  - MothAccent
  - MumbleAccent
  - OwOAccent
  - ParrotAccent
  - PirateAccent
  # - ReplacementAccent
  # Not supported at the moment because AddAccentClothingComponent will make it permanent when cloned.
  # TODO: AddAccentClothingComponent should use an inventory relay event.
  # Also ZombieComponent overwrites the old replacement accent, because you can only have one at a time.
  - RussianAccent
  - ScrambledAccent
  - SkeletonAccent
  - SlurredAccent
  - SouthernAccent
  - SpanishAccent
  - StutteringAccent
  # CloningContext fields
  - CreamPied # Displacements
  - Damageable # Sprites and damage modifier
  - Flammable # Displacements
  - Hands # displacements
  - Puller
  - Vocal # voice sounds

# for job-specific traits etc.
- type: cloningSettings
  id: Special
  components:
  - BibleUser
  - CommandStaff
  - MimePowers
  - MindShield
  - SpaceNinja
  - Thieving

# antag roles
- type: cloningSettings
  id: Antag
  components:
  - HeadRevolutionary
  - NukeOperative
  - Revolutionary

- type: cloningSettings
  abstract: true
  id: BaseEquipmentBlacklist
  equipmentBlacklist:
    components:
    - AttachedClothing # helmets, which are part of the suit
    - Implanter # they will spawn full again, but you already get the implant. And we can't do item slot copying yet
    - VirtualItem

# a full clone with all traits and items, but no antag roles
- type: cloningSettings
  parent: [Body, Special, Traits, BaseEquipmentBlacklist]
  id: BaseClone

# for cloning pods
- type: cloningSettings
  parent: [BaseClone, Antag]
  id: CloningPod
  forceCloning: false
  copyEquipment: null
  copyInternalStorage: false
  copyImplants: false

# for paradox clones
- type: cloningSettings
  parent: [BaseClone, Antag]
  id: ParadoxCloningSettings
  components:
  - Forensics # This is so hugging data is copied to the clone, so you can't hug metagame them

# changeling identity copying
- type: cloningSettings
  id: ChangelingCloningSettings
  parent: [Body, TraitsPhysical, BaseEquipmentBlacklist]
  statusEffectWhitelist:
    components:
    - ChangelingCloneableStatusEffect
  components:
  # These are already part of the base species prototype that is spawned for the clone,
  # that means we only need to copy them over when switching between species.
  # So these don't need to be part of the Body settings, unless someone makes a trait that adjusts these components.
  - BodyEmotes
  # - Fixtures TODO: A better way to clone fixtures or a fixture fix. Currently if you devour someone on the ground and transform, you lose collision with tables as they were knocked down when they were copied.
  - MessyDrinker
  - ScaleVisuals # for dwarf height
  - Speech
  - TemperatureProtection
  - TypingIndicator
  # CloningContext components
  - Bloodstream # blood reagents
  - Inventory # arachnid pockets and diona feet
  - JumpAbility # vulp leaping
  - MovementSpeedModifier # moths when weightless
  - Rootable # diona
  - Sericulture # arachnids
  - Storage # slime storage
  - Wagging # lizard tails
  copyInternalStorage: false
  copyImplants: false
  raiseEntityRenamedEvent: false


# spawner
- type: entity
  id: RandomCloneSpawner
  name: Random Clone
  suffix: Non-Antag
  components:
  - type: Sprite
    sprite: Mobs/Aliens/paradox_clone.rsi
    state: preview
  - type: RandomCloneSpawner
    settings: BaseClone

# for plant clones
- type: cloningSettings
  id: PlantClone
  components:
  - Plant
  - PlantAtmospheric
  - PlantChemicals
  - PlantConsumeExudeGas
  - PlantGrowth
  - PlantHarvest
  - PlantToxins
  - PlantWeedPest
  # traits
  - PlantTraitKudzu
  - PlantTraitLigneous
  - PlantTraitScream
  - PlantTraitUnviable

# for plant lifecycle clones
- type: cloningSettings
  parent: PlantClone
  id: PlantLifecycleClone
  components:
  - PlantHolder
  # traits
  - PlantTraitSampled
  - PlantTraitSeedless

# for cloned items
- type: cloningSettings
  id: ItemClone
  components:
  - ChameleonClothing
  - Forensics
  - Label
  - Paper
  - Stack
  # CloningContext components
  - Store
