## Base randomHumanoidSettings

- type: randomHumanoidSettings
  id: EventHumanoid
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: GhostTakeoverAvailable # this means do NOT parent from EventHumanoid if the role is not intended to be a ghostrole!
  - type: IdBind

- type: randomHumanoidSettings
  parent: EventHumanoid
  id: EventHumanoidMindShielded
  components:
  - type: AutoImplant
    implants:
    - MindShieldImplant
  - type: AntagImmune

- type: randomHumanoidSettings
  parent: EventHumanoidMindShielded
  id: EventHumanoidCentcomm
  components:
  - type: AutoImplant
    implants:
    - MindShieldImplant
    - DeathRattleImplantCentcomm

## Death Squad

- type: entity
  id: RandomHumanoidSpawnerDeathSquad
  name: death squad commando spawner
  suffix: Task Force
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Hardsuits/deathsquad.rsi
    state: icon
  - type: RandomHumanoidSpawner
    settings: DeathSquad

- type: randomHumanoidSettings
  parent: EventHumanoidCentcomm
  id: DeathSquad
  components:
  - type: GhostRole
    name: ghost-role-information-Death-Squad-name
    description: ghost-role-information-Death-Squad-description
    rules: ghost-role-information-Death-Squad-rules
    raffle:
      settings: short
    mindRoles:
    - MindRoleGhostRoleFamiliar
    job: DeathSquad
  - type: RandomMetadata
    nameSegments:
      - NamesMilitaryLast
    nameFormat: name-format-deathsquad
  - type: Loadout
    prototypes: [ DeathSquadGear ]
    roleLoadout: [ RoleSurvivalEVA ]

