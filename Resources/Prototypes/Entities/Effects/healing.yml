- type: entity
  id: HealingSparkle
  name: sparkle
  components:
  # Animation is like 3 something seconds so we just need to despawn it before then.
  - type: TimedDespawn
    lifetime: 0.5
  - type: EvaporationSparkle
  - type: Transform
    noRot: true
    anchored: true
  - type: Sprite
    layers:
    - sprite: Fluids/wet_floor_sparkles.rsi
      state: sparkles
    drawdepth: Effects
    color: "#FFFFFF80"
  - type: AnimationPlayer
