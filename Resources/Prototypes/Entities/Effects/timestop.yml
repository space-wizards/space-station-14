- type: entity
  id: TimeStopArea
  name: time stop area
  description: Toki yo tomare!
  components:
  - type: Transform
    anchored: True
  - type: InteractionOutline
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: /Textures/Effects/portal.rsi
  - type: Fixtures
    fixtures:
      portalFixture:
        shape:
          !type:PhysShapeCircle
          radius: 3.0
        mask:
        - FullTileMask
        layer:
        - WallLayer
        hard: false
  - type: TimeStopZone
  - type: TimedDespawn
    lifetime: 5
