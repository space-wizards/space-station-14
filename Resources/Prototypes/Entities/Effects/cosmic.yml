
- type: entity
  id: CosmicMalignRift
  name: malign rift
  description: A malign light pours forth from within.
  placement:
    mode: SnapgridCenter
  components:
  - type: InteractionOutline
  - type: Sprite
    sprite: Structures/Specific/cosmic-rift.rsi
    drawdepth: Mobs
    snapCardinals: true
    offset: 0,0.27
    layers:
    - state: base
    - state: vfx
      shader: unshaded
  - type: Clickable
#  - type: CosmicExamine
#    cultistText: cosmic-examine-text-rift
#    othersText: cosmic-examine-text-crew-rift
#  - type: CosmicRift
#  - type: StellarTileConversion
#    conversionMaxTicks: 6
#    conversionTime: 8
#    conversionChance: 1
#    chanceReduction: 0.16
  - type: PointLight
    color: "#42a4ae"
    radius: 2.5
    energy: 6
    castShadows: false
    netsync: false
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour
      interpolate: Linear
      minDuration: 4
      maxDuration: 4
      startValue: 3
      endValue: 9
      property: Energy
      enabled: true
      isLooped: true
      reverseWhenFinished: true

#### VACUOUS BREACH
- type: entity
  id: CosmicBreach
  name: vacuous breach
  description: A complete breach in realspace, allowing passage unto darkness...
  placement:
    mode: SnapgridCenter
  components:
  - type: InteractionOutline
  - type: Sprite
    sprite: Structures/Specific/cosmic-gateway.rsi
    drawdepth: FloorObjects
    snapCardinals: true
    offset: 0, 0
    layers:
    - state: base
    - state: vfx
      shader: unshaded
  - type: Clickable
#  - type: CosmicBreach
#  - type: CosmicExamine
#    cultistText: cosmic-examine-text-gateway
#    othersText: cosmic-examine-text-crew-gateway
#  - type: StellarTileConversion
#    conversionTiles:
#    - FloorCosmicRough
#    - FloorCosmicCorruption
    conversionMaxTicks: 4
    conversionTime: 1
    conversionChance: 1
    chanceReduction: 0.249
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Cosmic/gateway-spawn.ogg
      params:
        variation: 0.025
  - type: PointLight
    color: "#605191FF"
    radius: 4
    energy: 8
    castShadows: false
    netsync: false
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour
      interpolate: Linear
      minDuration: 4
      maxDuration: 4
      startValue: 3
      endValue: 8
      property: Energy
      enabled: true
      isLooped: true
      reverseWhenFinished: true

