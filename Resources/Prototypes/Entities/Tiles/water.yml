- type: entity
  parent: SolutionTile
  id: FloorWaterEntity
  name: water
  description: A real thirst quencher.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: Tiles/TileEntities/liquid-water.rsi
    drawdepth: BelowFloor
  - type: Solution
    id: pool
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 7680
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 100
  - type: DrainableSolution
    solution: pool
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25, -0.25, 0.25, 0.25"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWater
      params:
        volume: 8
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
        - Catwalk
  - type: TileEntityEffect
    effects:
    - !type:Extinguish
  - type: IconSmooth
    key: water
    states:
    - !type:CornerSpriteSmoothing
      mask: [ water, walls ]
      base: water
  - type: PlacementReplacement
    key: tileOverlay

- type: entity
  parent: FloorWaterEntity
  id: FloorSwimmingPoolEntity
  name: swimming pool
  description: Refreshing and relaxing!
  components:
  - type: FloorOccluder
  - type: Sprite
    sprite: Tiles/TileEntities/swimming-pool.rsi
  - type: IconSmooth
    key: pool
    states:
    - !type:CornerSpriteSmoothing
      mask: [ pool ]
      base: water
