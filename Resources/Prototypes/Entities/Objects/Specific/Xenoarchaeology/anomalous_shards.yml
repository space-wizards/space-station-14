- type: entity
  parent: [BaseItem, BaseXenoArtifact]
  id: XenoArtifactShard
  name: anomalous shard
  description: A shard of a greater whole, still possessing a fraction of ancient power.
  components:
  - type: Sprite
    sprite: Objects/Specific/Xenoarchaeology/anomalous_shards.rsi
    layers:
    - state: shard01
      map: [ "enum.ArtifactsVisualLayers.Base" ]
    - state: shard01_on
      map: [ "enum.ArtifactsVisualLayers.UnlockingEffect" ]
      visible: false
    - state: artifact-activation
      sprite: Objects/Specific/Xenoarchaeology/xeno_artifacts.rsi
      map: [ "enum.ArtifactsVisualLayers.ActivationEffect" ]
      visible: false
  - type: RandomArtifactSprite
    maxSprite: 20
    activationTime: 2.4
    prefix: shard
  - type: RandomSprite
    available:
    - enum.ArtifactsVisualLayers.UnlockingEffect:
        shard01_on: Rainbow
  - type: Physics
    bodyType: KinematicController
  - type: CollisionWake
    enabled: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.15"
        density: 10
        mask:
        - ItemMask
        layer:
        - Opaque
        restitution: 0.2
        friction: 0.1
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Artifexium
        Quantity: 15
  - type: Item
  - type: XenoArtifact
    nodeCount:
      min: 1
      max: 1
    segmentSize:
      min: 1
      max: 1
    nodesPerSegmentLayer:
      min: 1
      max: 1
    scatterPerLayer:
      min: 0
      max: 0
    unlockStateRefractory: 1
    triggersTable: !type:NestedSelector
      tableId: XenoArtifactHandheldOnlyTriggerTable
    effectsTable: !type:GroupSelector
      children:
      - !type:NestedSelector
        tableId: XenoArtifactEffectsDefaultTable
        weight: 54
      - !type:NestedSelector
        tableId: XenoArtifactEffectsHandheldOnlyTable
        weight: 2
  - type: Tag
    tags:
      - XenoArtifactShard
  - type: XenoArtifactShard

- type: entity
  parent: XenoArtifactShard
  id: XenoArtifactShardEmpty
  suffix: Empty
  components:
  - type: XenoArtifact
    isGenerationRequired: false
