- type: entity
  id: BaseArtifact
  name: artifact
  description: A strange artifact from time unknown. Looks like a good time.
  abstract: true
  components:
  # Visual
  - type: Appearance
  - type: InteractionOutline
  - type: UserInterface #needs to be here for certain effects
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
      enum.IntercomUiKey.Key:
        type: IntercomBoundUserInterface
  # gameplay interactions
  - type: XenoArtifact
    effectsTable: !type:NestedSelector
      tableId: XenoArtifactEffectsDefaultTable
  - type: Damageable
  - type: Injurable
  - type: Actions
  - type: ContainerContainer
    containers:
      node-container: !type:Container
        showEnts: False
        occludes: True
        ents: []
  # These components are needed for certain triggers to work.
  - type: RadiationReceiver
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
      Acidic: [Touch]
  - type: LightningTarget
    priority: 2
    lightningExplode: false
  - type: Stamina
    animationThreshold: 999
    baseCritThreshold: 1000
    decay: 1000
    cooldown: 0.1

- type: entity
  id: BaseXenoArtifact
  parent: [ BaseArtifact, BaseMob ]
  name: artifact
  description: A strange artifact from time unknown. Looks like a good time.
  abstract: true
  noSpawn: true
  components:
  - type: UseDelay
  - type: StealTarget
    stealGroup: XenoArtifact
  - type: GuideHelp
    guides:
    - Xenoarchaeology
  - type: Physics
    bodyType: KinematicController
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.25
    baseSprintSpeed: 0.5
  - type: Tag
    tags:
    - XenoArtifact

- type: entity
  parent: BaseAction
  id: ActionArtifactActivate
  name: Activate Artifact
  description: Activate yourself, causing chaos to those near you.
  components:
  - type: Action
    useDelay: 300
  - type: Sprite
    sprite: Objects/Specific/Xenoarchaeology/xeno_artifacts.rsi
    layers:
    - state: ano29
  - type: InstantAction
    event: !type:ArtifactSelfActivateEvent
