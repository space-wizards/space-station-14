- type: entity
  id: BaseCargoPallet
  parent: BaseStructure
  name: cargo pallet
  description: Common fixture of logistics and cargo. Subtle reminder where crates go during transport to avoid bruised shins.
  abstract: true
  components:
  - type: InteractionOutline
  - type: Anchorable
    flags:
    - Anchorable
  - type: CollideOnAnchor
  - type: Physics
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 15
        mask:
        - MachineMask
  - type: StaticPrice
    price: 100
  - type: Sprite
    drawdepth: FloorTiles
    layers:
    - sprite: Structures/catwalk.rsi
      state: catwalk_preview
  - type: GuideHelp
    guides:
    - Cargo

- type: entity
  id: [ BaseSimpleMob, BaseMobAnimal, MobCombat, BaseMobDestructible ]
  parent: BaseMob
  name: длинноногий
  description: чёрт беги чёрт
  components:
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Slash: 25
  - type: Sprite
    sprite: Mobs/Aliens/длинногоний
  - type: Insulated
  - type: Flammable
    fireSpread: true
    canResistFire: true
    damage:
      types:
        Heat: 1
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Generic_mob_burning
  - type: Climbing
  - type: MobThresholds
    thresholds:
      0: Alive
      999: Dead
  - type: MovementSpeedModifier
    baseSprintSpeed: 3
    baseWalkSpeed: 3
  - type: GhostKickOnTrigger
    targetUser: true
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    stepOn: true

- type: entity
  id: CargoPalletSell
  name: cargo selling pallet
  description: Designates valid items to sell. Made of plastitanium to discourage pesky vandals.
  parent: BaseCargoPallet
  components:
  - type: CargoPallet
    palletType: sell
  - type: Sprite
    sprite: Structures/cargo_pallets.rsi
  - type: Icon
    sprite: Structures/cargo_pallets.rsi
    state: cargo_pallet_sell
  - type: IconSmooth
    key: cargo_pallet_sell
    states:
    - !type:CornerSpriteSmoothing
      mask: [ cargo_pallet_sell ]
      base: cargo_pallet_sell_

- type: entity
  id: CargoPalletBuy
  name: cargo buying pallet
  description: Designates where orders will appear when purchased. Made of plastitanium to discourage pesky vandals.
  parent: BaseCargoPallet
  components:
  - type: CargoPallet
    palletType: buy
  - type: Sprite
    sprite: Structures/cargo_pallets.rsi
  - type: Icon
    sprite: Structures/cargo_pallets.rsi
    state: cargo_pallet_buy
  - type: IconSmooth
    key: cargo_pallet_buy
    states:
    - !type:CornerSpriteSmoothing
      mask: [ cargo_pallet_buy ]
      base: cargo_pallet_buy_
