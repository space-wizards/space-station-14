- type: entityTable
  id: LootboxTableBasic #generically useful lootbox items
  table: !type:GroupSelector
    children:
    - !type:NestedSelector # lots of fun things in this, pre-made randomness
      tableId: FillSmugglerBackpack
      weight: 3
    - !type:NestedSelector
      tableId: RandomAllHighValueMaterialsTable
    - !type:NestedSelector
      tableId: RandomCommonSurplusMaterialTable
      rolls: 2,3
    - !type:NestedSelector
      tableId: LotteryCashEntityTable
      rolls: 1,2
    - !type:GroupSelector # rare roll from other loot box table
      weight: 0.25
      children:
      - !type:NestedSelector
        tableId: LootboxTableEngineering
      - !type:NestedSelector
        tableId: LootboxTableScience
      - !type:NestedSelector
        tableId: LootboxTableMedical
      - !type:NestedSelector
        tableId: LootboxTableService
