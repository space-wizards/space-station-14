        tableId: LootboxTableCargoSalv
        weight: 0.25
      - !type:NestedSelector
        tableId: LootboxTableSecurity
        weight: 0.1
    - !type:NestedSelector # winner winner roll again
      tableId: LootboxMaintsSpawnTable
      weight: 0.01

