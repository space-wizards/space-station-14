- type: entity
  id: LootboxEffectBasic
  parent: BaseOneTimeXenoArtifactEffect
  description: Becomes a lootbox
  components:
  - type: XAEApplyComponents
    applyIfAlreadyHave: false
    refreshOnReactivate: false
    components:
    - type: RequireProjectileTarget # this is here as PA's can't hit otherwise.
    - type: Weldable
    - type: Lock
      locked: false
    - type: EntityStorage
    - type: EntityTableContainerFill #fill the crate up with the loot
      containers:
        entity_storage: !type:AllSelector
          children:
          - !type:NestedSelector
            tableId: LootboxTableBasic
            rolls: 3,5
          - !type:NestedSelector
            tableId: LootboxTableFluff
  - type: XAERemoveArtifact #we're done now so kill it

