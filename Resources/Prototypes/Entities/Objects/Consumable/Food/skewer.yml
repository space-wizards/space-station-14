# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_single.yml
# Kebabs

- type: entity
  parent: BaseItem
  id: FoodKebabSkewer
  name: skewer
  description: A thin rod of metal used to skewer just about anything and cook it.
  components:
  - type: Item
    shape:
    - 0,0,1,0
    storedOffset: 0,-2
  - type: Sprite
    sprite: Objects/Consumable/Food/skewer.rsi
    state:
    layers:
    - state: skewer
    - map: ["foodSequenceLayers"]
  - type: LandAtCursor
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.40,-0.20
            - -0.30,-0.30
            - 0.50,0.10
            - 0.40,0.20
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 6
  - type: ThrowingAngle
    angle: 245
  - type: EmbeddableProjectile
    offset: -0.15,0.0
  - type: MeleeWeapon
    wideAnimationRotation: -120
    damage:
      types:
        Piercing: 8
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Tag
    tags:
    - Trash
    - Skewer
  - type: Edible
    trash:
    - FoodKebabSkewer
  - type: Solution
    id: food # I'm not having this inherit from basefood because this shouldn't be edible, nor have a solution until you attach an entity to it.
  - type: FoodSequenceStartPoint
    key: Skewer
    maxLayers: 5
    startPosition: -0.15625, -0.125 # 5 pixels left, 4 pixels down
    offset: 0.125, 0.0625 # 4 pixels right, 2 pixels up
    inverseLayers: true
    nameGeneration: food-sequence-skewer-gen
    contentSeparator: ", "
    allowHorizontalFlip: false
