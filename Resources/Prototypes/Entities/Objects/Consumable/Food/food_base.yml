#
# Base component for edible food-like items, different from BaseDrink
#
- type: entity
  abstract: true
  parent: [BaseItem, SolutionFood, SolutionSmall]
  id: FoodBase
  components:
  - type: FlavorProfile
    flavors:
      - food
  - type: Edible
  - type: Sprite
  - type: StaticPrice
    price: 0

#
# Base component for consumable food
# that should be cleaned up in space
#
- type: entity
  abstract: true
  parent: FoodBase
  id: FoodBaseTrash
  components:
  - type: SpaceGarbage

# This base type is used to cover all of the "obvious" things that should be doable to open-package food.
# Practically this means injection.
# But it might in future also mean drawing with a syringe, so this is a base prototype just in case.

- type: entity
  abstract: true
  parent: FoodBaseTrash
  id: FoodInjectableBase
  components:
  - type: InjectableSolution
    solution: food
  - type: RefillableSolution
    solution: food

# usable by any food that can be opened
# handles appearance with states "icon" and "icon-open"
- type: entity
  abstract: true
  id: FoodOpenableBase
  components:
  - type: Appearance
  - type: Sprite
    layers:
    - state: icon
      map: ["icon"]
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        icon:
          True: {state: "icon-open"}
          False: {state: "icon"}
  - type: Openable

# Base type for food that looks tasty but doesn't actually satiate the eater.
- type: entity
  abstract: true
  parent: FoodBase
  id: FakeFoodBase
  components:
    - type: FlavorProfile
      flavors:
        - nothing
    - type: FakeConsumable
      vanishSound: !type:SoundPathSpecifier
        path: /Audio/Effects/quick_exhale.ogg
        params:
          volume: 7
          pitch: 0.5
    - type: Damageable
    - type: Injurable
      damageContainer: Biological
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 1