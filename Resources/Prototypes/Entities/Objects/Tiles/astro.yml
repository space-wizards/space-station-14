
# Faux science tiles
- type: entity
  id: FloorTileItemAstroGrass
  parent: FloorTileItemBase
  name: astro-grass
  description: Fake grass that covers up wires and even comes with realistic NanoTrimmings!
  components:
  - type: Sprite
    state: astrograss
  - type: Item
    heldPrefix: grass
  - type: FloorTile
    outputs:
    - Plating
    - FloorAstroGrass
  - type: Stack
    stackType: FloorTileAstroGrass

