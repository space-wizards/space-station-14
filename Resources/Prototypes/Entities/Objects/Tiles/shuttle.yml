# Shuttles
- type: entity
  name: white shuttle floor
  parent: FloorTileItemBase
  id: FloorTileItemShuttleWhite
  components:
  - type: Sprite
    state: shuttlewhite
  - type: Item
    heldPrefix: shuttlewhite
  - type: FloorTile
    outputs:
    - Plating
    - FloorShuttleWhite
  - type: Stack
    stackType: FloorTileStackShuttleWhite

