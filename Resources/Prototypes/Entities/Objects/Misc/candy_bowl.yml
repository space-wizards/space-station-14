- type: entity
  parent: BaseStorageItem
  id: CandyBowl
  name: "candy bowl"
  description: Grab as much as you can fit in your pockets!
  components:
  - type: Item
    shape:
    - 0,0,1,0
    storedOffset: 0,-3
  - type: Sprite
    sprite: Objects/Misc/candy_bowl.rsi
    drawdepth: SmallObjects
    state: candy_bowl0
  - type: Appearance
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,4,3
    whitelist:
      components:
      - Pill
      tags:
      - FoodSnack
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: DamageOnLand
    damage:
      types:
        Blunt: 5
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 4
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: -1
            max: 0
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.10,-0.10,0.10,0.10"
        density: 20
        mask:
        - TabletopMachineMask
        restitution: 0.3
        friction: 0.2
  - type: ItemMapper
    sprite: Objects/Misc/candy_bowl.rsi
    mapLayers:
      candy_bowl1:
        whitelist:
          components:
          - Pill
          tags:
          - FoodSnack
