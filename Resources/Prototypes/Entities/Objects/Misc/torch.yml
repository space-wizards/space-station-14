- type: entity
  name: torch
  parent: BaseItem
  id: Torch
  description: A torch fashioned from some wood.
  components:
  - type: ExpendableLight
    refuelMaterialID: WoodPlank
    glowDuration: 100
    refuelMaximumDuration: 205
    fadeOutDuration: 4
    iconStateSpent: torch_spent
    turnOnBehaviourID: turn_on
    fadeOutBehaviourID: fade_out
    # Sounds legit nuff
    litSound:
      path: /Audio/Items/Flare/flare_on.ogg
  - type: Sprite
    sprite: Objects/Misc/torch.rsi
    layers:
    - map: [ enum.ExpendableLightVisualLayers.Base ]
      state: torch_unlit
    - map: [ enum.ExpendableLightVisualLayers.Glow ]
      state: lit_overlay
      color: "#FFFFFF"
      visible: false
      shader: unshaded
    - map: [ enum.ExpendableLightVisualLayers.Overlay ]
      state: torch_nocloth
  - type: Icon
    sprite: Objects/Misc/torch.rsi
    state: icon
  - type: Item
    sprite: Objects/Misc/torch.rsi
    heldPrefix: unlit
  - type: Construction
    graph: LightTorch
    node: torch
  - type: Appearance
  - type: PointLight
    enabled: false
    color: "#E25822"
    radius: 1.0
    energy: 5.0
    netsync: false
  - type: IgnitionSource
    temperature: 400
    ignited: false
  - type: LightBehaviour
    behaviours:
    # immediately make it bright and flickery
    - !type:RandomizeBehaviour
      id: turn_on
      interpolate: Nearest
      minDuration: 0.02
      maxDuration: 0.06
      startValue: 6.0
      endValue: 9.0
      property: Energy
      isLooped: true
    # have the radius start small and get larger as it starts to burn
    - !type:FadeBehaviour
      id: turn_on
      maxDuration: 8.0
      startValue: 1.0
      endValue: 6.0
    # weaker flicker as it fades out
    - !type:RandomizeBehaviour
      id: fade_out
      interpolate: Nearest
      minDuration: 0.02
      maxDuration: 0.06
      startValue: 4.0
      endValue: 8.0
      property: Energy
      isLooped: true
    # fade out radius as it burns out
    - !type:FadeBehaviour
      id: fade_out
      maxDuration: 4.0
      startValue: 6.0
      endValue: 1.0
  - type: Tag
    tags:
    - Torch
