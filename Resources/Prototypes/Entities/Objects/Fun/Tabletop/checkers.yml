# Uses the chessboard and generic pieces
- type: entity
  parent: BaseBoardEntity
  id: CheckerBoard
  name: checkerboard
  description: A checkerboard. Pieces included!
  components:
  - type: Sprite
    state: checkers
  - type: TabletopGame
    boardName: tabletop-checkers-board-name
    size: 338, 274
    setup: !type:TabletopCheckerSetup
      boardPrototype: ChessBoardTabletop
      prototypePieceWhite: CheckerPieceRed
      prototypeCrownWhite: CheckerCrownRed
      prototypePieceBlack: CheckerPieceBlack
      prototypeCrownBlack: CheckerCrownBlack

# The pieces
- type: entity
  parent: BaseTabletopPiece
  id: CheckerPieceRed
  name: red checkers piece
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: outer_ring
      color: "#222034"
    - state: inner_circle
      color: "#dd3845"

- type: entity
  parent: BaseTabletopPiece
  id: CheckerCrownRed
  name: red checkers king
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: outer_ring
      color: "#222034"
    - state: inner_circle
      color: "#dd3845"
    - state: crown

- type: entity
  parent: BaseTabletopPiece
  id: CheckerPieceBlack
  name: black checkers piece
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: outer_ring
      color: "#222034"
    - state: inner_circle
      color: "#000000"

- type: entity
  parent: BaseTabletopPiece
  id: CheckerCrownBlack
  name: black checkers king
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: outer_ring
      color: "#222034"
    - state: inner_circle
      color: "#000000"
    - state: crown
      color: "#ffff00"
