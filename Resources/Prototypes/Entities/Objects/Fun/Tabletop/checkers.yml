# Uses the chessboard and generic pieces
- type: entity
  parent: ChessBoard
  id: CheckerBoard
  name: checkerboard
  description: A checkerboard. Pieces included!
  components:
  - type: Sprite
    state: checkers
  - type: TabletopGame
    boardName: tabletop-checkers-board-name
    setup: !type:TabletopCheckersSetup
      boardPrototype: ChessBoardTabletop

# The pieces
- type: entity
  parent: BaseTabletopPiece
  id: CheckersPieceRed
  name: red piece
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: outer_ring
      color: "#222034"
    - state: inner_circle
      color: "#dd3845"

- type: entity
  parent: BaseTabletopPiece
  id: CheckersKingRed
  name: red king
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: outer_ring
      color: "#222034"
    - state: inner_circle
      color: "#dd3845"
    - state: crown

- type: entity
  parent: BaseTabletopPiece
  id: CheckersPieceBlack
  name: black piece
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: outer_ring
      color: "#222034"
    - state: inner_circle
      color: "#000000"

- type: entity
  parent: BaseTabletopPiece
  id: CheckersKingBlack
  name: black king
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: outer_ring
      color: "#222034"
    - state: inner_circle
      color: "#000000"
    - state: crown
      color: "#ffff00"
