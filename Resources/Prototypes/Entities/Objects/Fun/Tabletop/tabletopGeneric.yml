# Instances used in backgammon/parchis setup
- type: entity
  parent: BaseTabletopPiece
  id: RedTabletopPiece
  name: red piece
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: outer_ring
      color: "#222034"
    - state: inner_circle
      color: "#9a353e"

