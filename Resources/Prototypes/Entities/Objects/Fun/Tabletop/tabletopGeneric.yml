# A placeholder entity type for draggable items.
- type: entity
  parent: BaseTabletopPiece
  id: GenericTabletopPiece
  categories: [ HideSpawnMenu ]

- type: entity
  parent: BaseTabletopPiece
  id: RedTabletopPiece
  name: red piece
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/generic_pieces.rsi
    layers:
    - state: outer_ring
      color: "#222034"
    - state: inner_circle
      color: "#9a353e"

