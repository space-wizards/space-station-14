# When adding a new battlemap, also add it to id: AllBattlemapsTable

# region Boards
- type: entity
  parent: BaseBoardEntity
  id: GrassBattlemap
  name: grass battlemap
  description: A battlemap for epic dungeon crawls. Place items on it to send them in!
  components:
  - type: Sprite
    state: battlemap-grass
  - type: TabletopGame
    boardName: tabletop-battlemap-board-name
    size: 288, 288
    setup: !type:TabletopEmptySetup
      boardPrototype: GrassBoardTabletop

- type: entity
  parent: BaseBoardEntity
  id: MoonBattlemap
  name: moon battlemap
