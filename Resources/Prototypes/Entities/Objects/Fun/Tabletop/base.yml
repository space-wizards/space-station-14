# When adding a new board game, also add it to id: AllBoardGamesTable

# Note: all board game pieces should be marked as HideSpawnMenu, they lack most of the physical components for practical use.

# The actual item that players can pick up, or throw when they lose.
- type: entity
  abstract: true
  parent: BaseItem
  id: BaseBoardEntity
  name: board
  description: A blank board.
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/boards.rsi
  - type: TabletopGame
    size: 256, 256
  - type: ActivatableUI
    key: enum.TabletopGameUiKey.Key
    verbText: tabletop-verb-play-game
  - type: UserInterface
    interfaces:
      enum.TabletopGameUiKey.Key:
        type: TabletopGameBoundUserInterface

# A draggable item for tabletop boards.
# Entities dragged onto the board have their appearance copied onto one of these.
- type: entity
  id: BaseTabletopPiece
  name: board game piece
  description: A piece used for playing a board game.
  categories: [HideSpawnMenu]
  components:
  - type: TabletopDraggable
  - type: Sprite
    noRot: true
    sprite: Objects/Fun/Tabletop/generic_pieces.rsi
  - type: Appearance
  - type: Clickable
  - type: InteractionOutline

- type: entity
  parent: BaseTabletopPiece
  id: TabletopHologram
  description: Hang on, where'd this come from?
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    layers: # Backup sprite definition, just to prevent invisible pieces.
    - state: outer_ring
      color: "#000000"
    - state: inner_circle
      color: "#ff00ff"

# Entity that acts as the background sprite in tabletop games.
- type: entity
  abstract: true
  id: BaseBoardTabletop
  name: board
  components:
  - type: TabletopBackground
  - type: Clickable # For pointing
  - type: Sprite
    drawdepth: FloorTiles
