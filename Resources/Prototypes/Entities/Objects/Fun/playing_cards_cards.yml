- type: card
  abstract: true
  id: BaseCard
  sprite: /Textures/Objects/Fun/PlayingCards/basiccards.rsi

- type: card
  abstract: true
  parent: BaseCard
  id: !type:CreateVariants
    values:
    - Clubs
    - Diamonds
    - Hearts
    - Spades
  color: !type:CreateVariants
    values:
    - "#004000" # the darkest system green is too light
    - firebrick
    - maroon
    - midnightblue

- type: card
  abstract: true
  parent: !type:CreateVariants
    values:
    - Clubs
    - Diamonds
    - Hearts
    - Spades
  id: !type:CreateVariants
    values:
    - ClubsIcon
    - DiamondsIcon
    - HeartsIcon
    - SpadesIcon
  layers:
  - state: !type:CreateVariants
      values:
      - sc_ClubsDiamonds
      - sc_ClubsDiamonds
      - sc_Hearts
      - sc_Spades

