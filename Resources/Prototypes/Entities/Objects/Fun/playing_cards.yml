- type: entity
  parent: BaseItem
  id: BaseCards
  name: deck of cards
  categories: [ HideSpawnMenu ]
  components:
  - type: Cards
    layerStates:
    - null
    - deck_nanotrasen_low
    - deck_nanotrasen_half
    - deck_nanotrasen_full
    thresholds: [2, 20, 35]
    cardStackType: CardsStack
  - type: Sprite
    sprite: Objects/Fun/PlayingCards/cardbase.rsi
    layers:
    - state: deck_nanotrasen_full
      map: ["enum.CardVisualLayers.Base"]
  - type: Item
    sprite: Objects/Fun/PlayingCards/cardbase.rsi
    size: Normal
  - type: Appearance

