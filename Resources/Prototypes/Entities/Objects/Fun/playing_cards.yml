- type: entity
  parent: [ BaseStandardDeck, BaseCards ]
  id: CardDeck
  name: deck of cards

- type: entity
  parent: [ BaseStandardDeck, BaseCards ]
  id: RedCardDeck
  name: red deck of cards
  components:
  - type: Cards
    cardBack: red_backside
    baseState: syndi_base

- type: cardStack
  id: CardsStack
  name: deck-of-cards
  maxCount: 156
  spawn: BaseCards

- type: entity
  parent: [ BaseCards, BaseSyndicateContraband ]
  id: SyndiBaseCards
  name: syndicate deck of cards
  categories: [ HideSpawnMenu ]
  components:
  - type: Cards
    cardBack: syndi_backside
    baseState: syndi_base
    cardStackType: SyndicateCardsStack
    layerStates:
    - null
    - deck_syndicate_low
    - deck_syndicate_half
    - deck_syndicate_full
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 10
        Slash: 8
  - type: EmbeddableProjectile
    offset: 0.0,0.0
  - type: LandAtCursor

- type: entity
  parent: [ BaseStandardDeck, SyndiBaseCards ]
  id: SyndiCards
  name: syndicate deck of cards

- type: cardStack
  id: SyndicateCardsStack
  name: syndi-deck-of-cards
  maxCount: 156
  spawn: SyndiBaseCards
