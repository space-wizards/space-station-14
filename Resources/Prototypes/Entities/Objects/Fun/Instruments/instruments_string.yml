- type: entity
  parent: BaseStringInstrumentClothing
  id: RockGuitarInstrument
  name: rock guitar
  description: What an axe!
  components:
  - type: Instrument
    program: 29
  - type: SwappableInstrument
    instrumentList:
      swappable-instrument-style-overdrive: {29: 0}
      swappable-instrument-style-distortion: {30: 0}
      swappable-instrument-style-harmonics: {31: 0}
  - type: Sprite
    sprite: Objects/Fun/Instruments/rockguitar.rsi
  - type: MeleeWeapon
    wideAnimationRotation: 45
    damage:
      types:
        Blunt: 6
        Slash: 2
  - type: Wieldable
  - type: IncreaseDamageOnWield #they don't call it an axe for nothing
    damage:
      types:
        Blunt: 4
        Slash: 2

- type: entity
  parent: BaseStringInstrumentClothing
  id: AcousticGuitarInstrument
  name: acoustic guitar
  description: Anyway, here's Wonderwall.
  components:
  - type: Instrument
    program: 24
  - type: SwappableInstrument
    instrumentList:
      swappable-instrument-style-nylon: {24: 0}
      swappable-instrument-style-steel: {25: 0}
  - type: Sprite
    sprite: Objects/Fun/Instruments/guitar.rsi
  - type: Wieldable
  - type: Damageable # Smash it! Does 20 damage a hit, but breaks after 1 hit.
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Weapons/guitarsmash.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 2
            max: 4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnHit # This makes it destroy after one hit.
    damage:
      types:
        Blunt: 20
  - type: MeleeWeapon
    wideAnimationRotation: 45
    damage:
      types:
        Blunt: 5
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 15

