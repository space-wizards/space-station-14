- type: entity
  name: base shield
  parent: BaseItem
  id: BaseShield
  description: A shield!
  abstract: true
  components:
    - type: Sprite
      sprite: Objects/Weapons/Melee/riot-shield.rsi
      state: icon
    - type: Item
      sprite: Objects/Weapons/Melee/riot-shield.rsi
      heldPrefix: icon
      size: Ginormous
    - type: Blocking
      passiveBlockModifier:
        flatReductions:
          Blunt: 10
          Slash: 10
          Piercing: 10
          Heat: 10
    - type: Damageable
      damageContainer: Shield
    - type: ExaminableDamage
      messages: ShieldMessages
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 220 #This is probably enough damage before it breaks
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:SpawnEntitiesBehavior
          spawn:
            SheetSteel:
              min: 2
              max: 2
            SheetGlass:
              min: 2
              max: 2
    - type: StaticPrice
      price: 100
    #DS14-Start
    - type: EmitSoundOnPickup
      sound:
        path: /Audio/_DeadSpace/Items/Handing/shield/plastic_shield_pickup.ogg
    - type: EmitSoundOnDrop
      sound:
        path: /Audio/_DeadSpace/Items/Handing/shield/plastic_shield_drop.ogg
    - type: EmitSoundOnLand
      sound:
        path: /Audio/_DeadSpace/Items/Handing/shield/plastic_shield_drop.ogg
    #DS14-End

#DS14-Start
- type: entity
  parent: BaseAction
  id: ShieldDashAction
  name: таран щитом
  description: Рывок вперед с поднятым щитом, чтобы сбить врага с ног.
  components:
  - type: Action
    useDelay: 15
    icon:
      sprite: Interface/Actions/jump.rsi
      state: icon
  - type: InstantAction
    event: !type:ShieldDashEvent
#DS14-End

- type: entity
  name: base repairable shield
  parent: BaseShield
  id: BaseRepairableShield
  description: A repairable shield!
  abstract: true
  components:
  - type: Repairable # Negative values represent healing
    damage:
      types:
        Blunt: -20
        Slash: -20
        Piercing: -20
        Heat: -20
    fuelCost: 10 # 1/2 of a Welder for a full repair
    doAfterDelay: 5
    allowSelfRepair: false

#Security Shields

- type: entity
  name: riot shield
  parent: [ BaseRepairableShield, BaseSecurityContraband ]
  id: RiotShield
  description: A large tower shield. Good for controlling crowds.
  components:
    - type: StaticPrice
      price: 90
    - type: Clothing
      sprite: Objects/Weapons/Melee/riot-shield.rsi
      quickEquip: false
      slots:
      - suitStorage
    - type: Blocking
      passiveBlockModifier:
        flatReductions:
          Blunt: 15
          Slash: 15
          Piercing: 5
          Heat: 5
    #DS14-Start
    - type: ShieldDash
      damage:
        types:
          Blunt: 10
      damageToShield:
        types:
            Blunt: 110
      staminaDamage: 60
      staminaDamageToUser: 30
    #DS14-End

