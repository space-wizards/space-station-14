- type: entity
  id: BaseShadow
  abstract: true
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActs
        acts: [ "Destruction" ]
      - !type:PlaySound
        sound:
          path: /Audio/Items/hiss.ogg
          params:
            variation: 0.08
  - type: DamagedByFlashing
    flashDamage:
      types:
        Heat: 10
  - type: Damageable
  - type: Injurable
    damageContainer: ShadowHaze
