- type: entity
  parent: [BaseKnife, BaseHighlyIllegalContraband]
  id: RitualDagger
  name: ritual dagger
  description: A strange dagger used by sinister groups for rituals and sacrifices.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/cult_dagger.rsi
    state: icon
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Slash: 12
  - type: Clothing
    sprite: Objects/Weapons/Melee/cult_dagger.rsi
    slots:
    - back
  - type: DisarmMalus

- type: entity
  parent: [BaseSword, BaseHighlyIllegalContraband]
  id: EldritchBlade
  name: eldritch blade
  description: A sword humming with unholy energy.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/cult_blade.rsi
    state: icon
  - type: MeleeWeapon
    attackRate: 0.75
    damage:
      types:
        Slash: 16
  - type: Clothing
    sprite: Objects/Weapons/Melee/cult_blade.rsi
    slots:
    - back
  - type: DisarmMalus

- type: entity
  parent: [BaseAxe, BaseHighlyIllegalContraband]
  id: UnholyHalberd
  name: unholy halberd
  description: A poleaxe that seems to be linked to its wielder.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/cult_halberd.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 10
        Slash: 10
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 5
        Slash: 5
  - type: Item
    storedRotation: -45
  - type: Clothing
    sprite: Objects/Weapons/Melee/cult_halberd.rsi
    quickEquip: false
    slots:
    - back
