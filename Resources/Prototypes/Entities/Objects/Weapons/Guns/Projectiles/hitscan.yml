# Used by the legacy renderer for special and dynamically-created hitscan effects.
- type: entity
  id: HitscanEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 2.0
  - type: Sprite
    drawdepth: Effects
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu
  - type: AnimationPlayer

# Gun lasers use physical projectiles so their movement and collisions can be predicted.
- type: entity
  id: BasicHitscan
  name: basic laser bolt
  parent: BulletLaser
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    color: "#ff3030"
    layers:
    - state: omnilaser_greyscale
      shader: unshaded
  - type: Ammo
    muzzleFlash: MuzzleFlashEffectHeavyLaser
  - type: Projectile
    damage:
      types:
        Heat: 0
  - type: TimedDespawn
    lifetime: 0.5

- type: entity
  parent: BasicHitscan
  id: RedLightLaser
  name: red light laser bolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
