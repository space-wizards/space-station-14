- type: entity
  id: RandomAnomalySpawner
  name: random anomaly spawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Structures/Specific/anomaly.rsi
      state: anom1
  - type: EntityTableSpawner
    table: !type:GroupSelector
      children:
      - !type:GroupSelector
        weight: 7
        children:
        - id: AnomalyPyroclastic
        - id: AnomalyGravity
        - id: AnomalyElectricity
        - id: AnomalyFlesh
        - id: AnomalyBluespace
        - id: AnomalyIce
        - id: RandomRockAnomalySpawner
        - id: AnomalyLiquid
        - id: AnomalyFlora
        - id: AnomalyShadow
        - id: AnomalyTech
        - id: AnomalySanta
          conditions:
          - !type:HolidayCondition
            holiday: FestiveSeason
      - id: RandomAnomalyInjectorSpawner
        weight: 3
    offset: 0.15 # not to put it higher. The anomaly sychnronizer looks for anomalies within this radius, and if the radius is higher, the anomaly can be attracted from a neighboring tile.

- type: entity
  id: RandomRockAnomalySpawner
  name: random rock anomaly spawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Structures/Specific/anomaly.rsi
      state: anom6
  - type: RandomSpawner
    prototypes:
    - AnomalyRockIron
    - AnomalyRockCoal
    - AnomalyRockSilver
    - AnomalyRockGold
    - AnomalyRockQuartz
    - AnomalyRockUranium
    chance: 1
    offset: 0.15

- type: entity
  id: RandomAnomalyInjectorSpawner
  name: random anomaly injector spawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Structures/Specific/Anomalies/tech_anom.rsi
      state: pulse
  - type: EntityTableSpawner
    table: !type:GroupSelector
      children:
      - id: AnomalyTrapPyroclastic
      - id: AnomalyTrapElectricity
      - id: AnomalyTrapShadow
      - id: AnomalyTrapIce
      - id: AnomalyTrapFlora
      - id: AnomalyTrapBluespace
      - id: AnomalyTrapFlesh
      - id: AnomalyTrapGravity
      - id: AnomalyTrapTech
      - id: AnomalyTrapRock
      - id: AnomalyTrapSanta
        conditions:
        - !type:HolidayCondition
          holiday: FestiveSeason
