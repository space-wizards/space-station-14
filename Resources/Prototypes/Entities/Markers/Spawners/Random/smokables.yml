#Spawners
- type: entity
  id: RandomSmokables
  name: random smokable spawner
  parent: MarkerBase
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    layers:
      - sprite: Objects/Consumable/Smokeables/Cigarettes/Packs/black.rsi
        state: closed
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: SmokablesTable
      prob: 0.95

- type: entity
  id: RandomSoakedCigarette
  name: random soaked cigarette spawner
  parent: MarkerBase
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    layers:
      - sprite: Objects/Consumable/Smokeables/Cigarettes/cigarette.rsi
        state: unlit-icon
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: RandomSoakedSmokeTable

#Tables
- type: entityTable
  id: SmokablesTable
  table: !type:GroupSelector
    children:
    #Just a cig
    - !type:GroupSelector
      weight: 36
      children:
      - id: Cigarette
    #Uncommon
    - !type:GroupSelector
      weight: 9
      children:
      - id: Cigar
      - id: CigPackGreen
      - id: CigPackRed
      - id: CigPackBlue
      - id: CigPackBlack
      - id: PackPaperRollingFilters
    #Butts
    - !type:GroupSelector
      weight: 3
      children:
      - id: CigaretteSpent
      - id: CigarSpent
        weight: 0.2
    #Rare
    - !type:GroupSelector
      children:
      - id: RandomSoakedCigarette
      - !type:GroupSelector
        children:
        - id: Joint
        - id: JointRainbow
          weight: 0.5
        - id: Blunt
        - id: BluntRainbow
          weight: 0.5
      - !type:GroupSelector
        children:
        - id: CigPackMixed
      - id: CigarGold
        weight: 0.10

- type: entityTable
  id: LighterTable
  table: !type:GroupSelector
    children:
    - id: CybersunFlippo
      orGroup: Lighterbox
      weight: 0.15
    - id: InterdyneFlippo
      orGroup: Lighterbox
      weight: 0.15
    - id: NanotrasenFlippo
      orGroup: Lighterbox
      weight: 0.25
    - id: WaffleCoFlippo
      orGroup: Lighterbox
      weight: 0.35
    - id: HonkCoFlippo
      orGroup: Lighterbox
    - id: GorlexMatchbox
      orGroup: Lighterbox
      weight: 0.15
    - id: DonkcoLighter
      orGroup: Lighterbox
      weight: 0.25
    - id: SyndicateFlippo
      orGroup: Lighterbox
      weight: 0.15
    - id: SpiderclanFlippo
      orGroup: Lighterbox
      weight: 0.15

- type: entityTable
  id: LighterSyndicateTable
  table: !type:GroupSelector
    children:
    - id: CybersunFlippo
      orGroup: Lighterbox
    - id: InterdyneFlippo
      orGroup: Lighterbox
    - id: WaffleCoFlippo
      orGroup: Lighterbox
    - id: HonkCoFlippo
      orGroup: Lighterbox
    - id: GorlexMatchbox
      orGroup: Lighterbox
    - id: DonkcoLighter
      orGroup: Lighterbox
    - id: SyndicateFlippo
      orGroup: Lighterbox
