- type: alertLevel
  id: Green
  name: alert-level-green
  announcement: alert-level-green-announcement
  instructions: alert-level-green-instructions
  color: Green
  emergencyLightColor: LawnGreen
  shuttleTime: 600

- type: alertLevel
  id: Blue
  name: alert-level-blue
  announcement: alert-level-blue-announcement
  instructions: alert-level-blue-instructions
  sound: /Audio/Misc/bluealert.ogg
  color: DodgerBlue
  emergencyLightColor: DodgerBlue
  forceEnableEmergencyLights: true
  shuttleTime: 600

- type: alertLevel
  id: Yellow
  name: alert-level-yellow
  announcement: alert-level-yellow-announcement
  instructions: alert-level-yellow-instructions
  sound: /Audio/Misc/notice1.ogg
  color: Yellow
  emergencyLightColor: Goldenrod
  forceEnableEmergencyLights: true
  shuttleTime: 600

- type: alertLevel
  id: Red
  name: alert-level-red
  announcement: alert-level-red-announcement
  instructions: alert-level-red-instructions
  sound: /Audio/Misc/redalert.ogg
  color: Red
  emergencyLightColor: Red
  forceEnableEmergencyLights: true
  shuttleTime: 600
  # No reduction in time as we don't have swiping for red alert like in /tg/.
  # Shuttle times are intended to create friction,
  # so having a way to brainlessly bypass that would be dumb.

- type: alertLevel
  id: Violet
  name: alert-level-violet
