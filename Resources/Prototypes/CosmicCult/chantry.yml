- type: entity
  parent: BaseStructure
  id: CosmicBorgChantry
  name: vacuous chantry
  categories: [ HideSpawnMenu ]
  description: Its surface churns with rampant malign light.
  placement:
    mode: AlignTileAny
  components:
  - type: DoAfter
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.3,0.4,0.6"
        density: 155
        mask:
        - LargeMobMask
        layer:
        - MachineLayer
        - InteractImpassable
  - type: Injurable
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
    - trigger:
        !type:DamageTrigger
        damage: 175
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          path: "/Audio/Cosmic/stigma-destroyed.ogg"
  - type: Sprite
    sprite: Structures/Specific/cosmic-chantry.rsi
    layers:
      - state: spawn
        map: ["base"]
      - state: spawn-unshaded
        map: ["overlay"]
        shader: unshaded
      - state: spawn-animated
        offset: 0, 0.75
        map: ["animated"]
        shader: unshaded
    offset: 0,0.25
    drawdepth: Mobs
  - type: GenericVisualizer
    visuals:
      enum.ChantryVisuals.Status:
        base:
          Off: {state: spawn}
          On: {state: base}
        overlay:
          Off: {state: spawn-unshaded}
          On: {state: base-unshaded}
        animated:
          Off: { state: spawn-animated }
          On: { state: base-animated }
  - type: Appearance
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: PointLight
    enabled: true
    castShadows: false
    radius: 4.5
    energy: 4
    color: "#42a4ae"
  - type: LightBehaviour
    behaviours:
     - !type:FadeBehaviour
       interpolate: Linear
       minDuration: 3
       maxDuration: 5
       startValue: 4.5
       endValue: 1.5
       property: Energy
       enabled: true
       isLooped: true
       reverseWhenFinished: true
  - type: AmbientSound
    volume: 0
    range: 20
    sound:
      path: "/Audio/Cosmic/monument-ambient.ogg"
  - type: CosmicExamine
    cultistText: cosmic-examine-text-forthecult
    othersText: cosmic-examine-text-chantry
  - type: TileConversion
    chanceReduction: 0.02
    enabled: true
    floodFillStarting: true
    conversionMaxTicks: 12
    conversionTime: 1.25
  - type: ContainerContainer
    containers:
      entity_storage: !type:Container
        ent: null
        showEnts: False
        occludes: True
