- type: entity
  parent: [ BaseSimpleMob, FlyingMobBase ]
  abstract: true
  id: MobCosmicColossusBase
  name: entropic colossus
  description: A colossal monstrosity wrought of malign plating.
  categories: [ ForkFiltered ]
  components:
  - type: FTLSmashImmune
  - type: CosmicExamine
    cultistText: cosmic-examine-text-cultentity
    othersText: cosmic-examine-text-entities
  - type: AntagImmune
  - type: StaminaResistance
    damageCoefficient: 0 # Players can't stun colossi but they're still stunnable for the purposes of game systems
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Cosmic/cosmic-colossus.rsi
    layers:
    - state: vfx-bg
      shader: unshaded
      map: ["underlay"]
    - state: colossus
      map: ["base"]
    - state: dead
      visible: false
      map: ["corpse"]
    - state: vfx-fg
      shader: unshaded
      map: ["overlay"]
    - state: attacking
      shader: unshaded
      visible: false
      map: ["attack"]
    - state: hibernate
      shader: unshaded
      visible: false
      map: ["hibernating"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ColossusVisuals.Status:
        underlay:
          Alive: { visible: true }
          Dead: { visible: false }
          Action: { visible: false }
        base:
          Alive: { visible: true }
          Dead: { visible: false }
          Action: { visible: false }
        corpse:
          Alive: { visible: false }
          Dead: { visible: true }
          Action: { visible: false }
        overlay:
          Alive: { visible: true }
          Dead: { visible: false }
          Action: { visible: false }
        attack:
          Alive: { visible: false }
          Dead: { visible: false }
          Action: { visible: true }
      enum.ColossusVisuals.Hibernation:
        hibernating:
          Running: { visible: true }
          Stopped: { visible: false }
      enum.ColossusVisuals.Sunder:
        sunder:
          Running: { visible: true }
          Stopped: { visible: false }

  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 2500
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: WarpPoint
    follow: true
  - type: Body
  - type: Emoting
  - type: Speech
    speechSounds: ColossusSpeech
    speechVerb: Robotic
    allowedEmotes: []
  - type: TypingIndicator
    proto: CosmicTyping
  - type: Grammar
    attributes:
      proper: true
      gender: epicene
  - type: ProtectedFromStepTriggers
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.25
    baseSprintSpeed: 3.25
    baseWeightlessModifier: 1
    weightlessAcceleration: 1.5
    weightlessFriction: 1
  - type: AmbientSound
    volume: +8
    range: 18
    sound:
      path: /Audio/Cosmic/colossus-ambience.ogg
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Cosmic/colossus-spawn.ogg
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - Unimplantable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: PointLight
    color: "#42a4ae"
    radius: 4
    energy: 4
    castShadows: true
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour
      interpolate: Linear
      minDuration: 5.5
      maxDuration: 5.5
      startValue: 1
      endValue: 4
      property: Energy
      enabled: true
      isLooped: true
      reverseWhenFinished: true
  - type: StatusEffects
    allowed:
    - Stutter
    - Stun
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
    - Common
    - CosmicRadio
  - type: ActiveRadio
    channels:
    - Binary
    - Common
    - CosmicRadio
  - type: ZombieImmune
  - type: NoSlip
  - type: Puller
    needsHands: false
  - type: CombatMode
#  - type: ActionGrant
#    actions:
#    - ActionCosmicColossusSunder
#    - ActionCosmicColossusIngress
#    - ActionCosmicColossusHibernate
  - type: MeleeWeapon
    altDisarm: false
    animation: WeaponArcCosmic
    attackRate: 0.425
    range: 3
    damage:
      types:
        Blunt: 25
        Asphyxiation: 5
        Cold: 5
        Structural: 60
    soundHit:
      path: /Audio/_ST/CosmicCult/cosmic-sword-glance.ogg
      params:
        variation: 0.2
        volume: 1
    soundSwing:
      path: /Audio/_ST/CosmicCult/cosmic-weapon-swing.ogg
      params:
        variation: 0.125
        volume: -4
  - type: MeleeThrowOnHit
    speed: 8
    distance: 7
  - type: Reflect
    reflectProb: .20
    spread: 120
    soundOnReflect:
      path: /Audio/_ST/CosmicCult/cosmic-sword-glance.ogg
      params:
        variation: 0.2
        volume: -6
  - type: GhostRole
    name: ghost-role-information-colossus-name
    description: ghost-role-information-colossus-description
    rules: ghost-role-information-colossus-rules
    mindRoles:
    - MindRoleCosmicColossus
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
#  - type: GuideHelp
#    guides:
#    - CosmicColossus

- type: entity
  parent: [ MobCosmicColossusBase ]
  categories: [ HideSpawnMenu ]
  id: MobCosmicColossusLone
  suffix: MidRoundAntag
  description: An ancient monstrosity wrought of malign plating.
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      600: Dead
#  - type: CosmicCorrupting
#    mobile: true
#    autoDisable: false
#    corruptionReduction: 0

- type: entity
  parent: [ MobCosmicColossusBase ]
  id: MobCosmicColossus
  components:
  - type: RandomMetadata
    nameSegments:
    - ColossusNames
    - ColossusTitles
    nameFormat: name-format-colossus
  - type: MobThresholds
    thresholds:
      0: Alive
      450: Dead
  - type: CosmicColossus

- type: speechSounds
  id: ColossusSpeech
  saySound:
    path: /Audio/Cosmic/colossus-say.ogg
  askSound:
    path: /Audio/Cosmic/colossus-ask.ogg
  exclaimSound:
    path: /Audio/Cosmic/colossus-exclaim.ogg

- type: entity
  categories: [ HideSpawnMenu ]
  id: MobTileDamageZone
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Cosmic/tile_detonate.ogg
  - type: TimedDespawn
    lifetime: 8

- type: entity
  categories: [ HideSpawnMenu ]
  id: MobTileDamageArea
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: TimedDespawn
    lifetime: 0.6
  - type: Transform
    anchored: true
  - type: Sprite
    snapCardinals: true
    sprite: _ST/CosmicCult/Effects/tile-attacks.rsi
    offset: 0, 0.27
    layers:
    - state: vfx-1
      shader: unshaded
  - type: Tag
    tags:
    - HideContextMenu
  - type: SpawnOnDespawn
    prototype: MobTileDamageIssuer

- type: entity
  categories: [ HideSpawnMenu ]
  id: MobTileDamageIssuer
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Sprite
    snapCardinals: true
    sprite: _ST/CosmicCult/Effects/tile-attacks.rsi
    offset: 0, 0.27
    layers:
    - state: vfx-2
      shader: unshaded
  - type: Transform
    noRot: true
    anchored: true
  - type: TimedDespawn
    lifetime: 1
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 2500
        hard: false
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    ignoreWeightless: true
    blacklist:
      tags:
        - Catwalk
  - type: TileEntityEffect
    effects:
    - !type:HealthChange
      damage:
        types:
          Cold: 12.5
