- type: entity
  name: entropic blade
  parent: BaseItem
  id: WeaponCosmicBlade
  description: An eerie greatsword wrought of indescribable material, forcibly extruded down into reality.
  components:
  - type: CosmicEquipment
  - type: Sprite
    sprite: Objects/Weapons/Melee/cosmic-entropic-blade.rsi
    layers:
    - state: icon
    - state: icon-overlay
      shader: unshaded
  - type: MeleeWeapon
    resistanceBypass: true
    angle: 90
    animation: WeaponArcCosmic
    wideAnimationRotation: -135
    attackRate: 0.62
    clickDamageModifier: 1.1
    damage:
      types:
        Slash: 12
        Asphyxiation: 12
        Cold: 12
        Structural: 15
    soundHit:
      path: /Audio/Cosmic/cosmic-sword-hit.ogg
      params:
        variation: 0.2
        volume: 1
    soundSwing:
      path: /Audio/Cosmic/cosmic-weapon-swing.ogg
      params:
        variation: 0.125
        volume: -4
    soundNoDamage:
      path: /Audio/Cosmic/cosmic-sword-glance.ogg
      params:
        variation: 0.2
        volume: -11
  - type: Reflect
    reflectProb: .21
    spread: 120
    soundOnReflect:
      path: /Audio/Cosmic/cosmic-sword-glance.ogg
      params:
        variation: 0.2
        volume: -6
  - type: Wieldable
    wieldSound:
      path: /Audio/Cosmic/cosmic-weapon-wield.ogg
      params:
        variation: 0.2
        volume: -2
    unwieldSound:
      path: /Audio/Cosmic/cosmic-weapon-unwield.ogg
      params:
        variation: 0.2
        volume: 0
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 3
        Structural: 5
  - type: DisarmMalus
  - type: Item
    size: Huge
    sprite: Objects/Weapons/Melee/cosmic-entropic-blade-inhands.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right

- type: entity
  name: vacuous lance
  parent: BaseItem
  id: WeaponCosmicLance
  description: An unnerving spear, wrought of indescribable material. Being near it feels like a prickle of static spreading through your nerves.
  components:
  - type: CosmicEquipment
  - type: EmbeddableProjectile
    removalTime: 2
    sound: /Audio/Cosmic/cosmic-lance-impact.ogg
  - type: Sprite
    sprite: Objects/Weapons/Melee/cosmic-vacuous-lance.rsi
    layers:
    - state: icon
    - state: icon-overlay
      shader: unshaded
  - type: MeleeWeapon
    resistanceBypass: true
    angle: 0
    animation: WeaponArcCosmic
    wideAnimation: WeaponArcThrust # ES - Animations with Easing
    wideAnimationRotation: -135
    attackRate: 0.62
    damage:
      types:
        Piercing: 12
        Asphyxiation: 10
        Cold: 10
    soundHit:
      path: /Audio/Cosmic/cosmic-lance-hit.ogg
      params:
        variation: 0.2
        volume: 1
    soundSwing:
      path: /Audio/Cosmic/cosmic-weapon-swing.ogg
      params:
        variation: 0.125
        volume: -4
    soundNoDamage:
      path: /Audio/Cosmic/cosmic-sword-glance.ogg
      params:
        variation: 0.2
        volume: -11
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 16
        Cold: 20
  - type: Wieldable
    wieldSound:
      path: /Audio/Cosmic/cosmic-weapon-wield.ogg
      params:
        variation: 0.2
        volume: -2
    unwieldSound:
      path: /Audio/Cosmic/cosmic-weapon-unwield.ogg
      params:
        variation: 0.2
        volume: 0
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 5
  - type: Item
    size: Huge
    sprite: Objects/Weapons/Melee/cosmic-vacuous-lance-inhands.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: EmitSoundOnThrow
    sound: /Audio/Cosmic/cosmic-weapon-swing.ogg
  - type: ThrowingAngle
    angle: 225
  - type: LandAtCursor
  - type: Tag
    tags:
    - Spear
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.40,-0.30
          - -0.30,-0.40
          - 0.40,0.30
          - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2

- type: entity
  name: astral razor
  parent: BaseItem
  id: WeaponCosmicScythe
  components:
  - type: CosmicFriendlyFireBlocker
  - type: CosmicEquipment
  - type: Sprite
    sprite: Objects/Weapons/Melee/cosmic-astral-razor.rsi
