        variation: 0.2
        volume: -11
  - type: Wieldable
    wieldSound:
      path: /Audio/Cosmic/cosmic-weapon-wield.ogg
      params:
        variation: 0.2
        volume: -2
    unwieldSound:
      path: /Audio/Cosmic/cosmic-weapon-unwield.ogg
