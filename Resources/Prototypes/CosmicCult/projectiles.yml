- type: entity
  id: ProjectileCosmicNova
  name: Astral Nova
  description: Uh oh.
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: "#42a4ae"
    radius: 3.5
    energy: 5.0
  - type: TimedDespawn
    lifetime: 10
  - type: Projectile
    impactEffect: EffectCosmicActionNovaImpact
    forceSound: true
    soundHit:
      path: "/Audio/Cosmic/Abilities/ability-nova-impact.ogg"
      params:
        variation: 0.1
        volume: +14
  - type: CosmicNova
  - type: Sprite
    sprite: Effects/Cosmic/ability-nova.rsi
    layers:
    - state: vfx
      shader: unshaded
  - type: GravityWell
    maxRange: 4
    baseRadialAcceleration: 12.5
    baseTangentialAcceleration: 4
    gravPulsePeriod: 0.05
  - type: AmbientSound
    enabled: true
    volume: 0
    range: 10
    sound:
      path: "/Audio/Cosmic/Abilities/ability-nova-ambient.ogg"

- type: entity
  id: ProjectileCosmic
  name: malign bolt
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  description: Ouch.
  components:
  - type: Sprite
    noRot: false
    sprite: Effects/Cosmic/base-projectile.rsi
    layers:
    - state: vfx
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffectCosmic
    damage:
      types:
        Cold: 8
    soundHit:
      path: "/Audio/Cosmic/cosmic-projectile-hit.ogg"
      params:
        variation: 0.08
  - type: Ammo
    muzzleFlash: null
  - type: DamageMarkerOnCollide
    whitelist:
      components:
      - MobState
    damage:
      types:
        Cold: 8
        Asphyxiation: 8
  - type: TimedDespawn
    lifetime: 0.6
  - type: PointLight
    color: "#42a4ae"
    radius: 1.5
    energy: 6
    castShadows: false
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        interpolate: Linear
        minDuration: 0.58
        maxDuration: 0.59
        startValue: 0.1
        endValue: 6
        property: Energy
        enabled: true
        reverseWhenFinished: true

- type: entity
  id: HitscanCosmicRazor
  name: entropic blast
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Cold: 5
        Asphyxiation: 5
  - type: HitscanAmmo
  - type: HitscanBasicRaycast
    maxDistance: 8
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Effects/Cosmic/cosmic-hitscan.rsi
      state: start
    travelFlash:
      sprite: Effects/Cosmic/cosmic-hitscan.rsi
      state: middle
    impactFlash:
      sprite: Effects/Cosmic/cosmic-hitscan.rsi
      state: end
#  - type: HitscanReflect - You can't reflect Cosmic Cult Hitscans. This is here just so you know it wasn't overlooked.
  - type: HitscanBasicEffects

- type: entity
  id: BulletImpactEffectCosmic
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.66
  - type: Sprite
    drawdepth: Effects
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: Effects/Cosmic/attack-weapons.rsi
      state: vfx
  - type: EffectVisuals
  - type: PointLight
    color: "#42a4ae"
    radius: 1.5
    energy: 6
    castShadows: false
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        interpolate: Linear
        minDuration: 0.64
        maxDuration: 0.65
        startValue: 0.1
        endValue: 6
        property: Energy
        enabled: true
        reverseWhenFinished: true
  - type: Tag
    tags:
      - HideContextMenu
