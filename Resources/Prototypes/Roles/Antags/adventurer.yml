# The Adventuring Party: a four-player team antag in the style of a TTRPG party.
# Spawned via admin tools only: the AdventurerPartySpawn entity (group spawn) or
# the RandomHumanoidSpawnerAdventurer* markers (one-off), both under
# Prototypes/Adventurer/. See Content.Shared/Adventurer for the armor class /
# d20 mechanics.

# Antag identities, referenced by the adventurer mind roles.
- type: antag
  id: AdventurerWarrior
  name: roles-antag-adventurer-warrior-name
  antagonist: true
  objective: roles-antag-adventurer-warrior-objective
  guides: [ MinorAntagonists ]

- type: antag
  id: AdventurerRanger
  name: roles-antag-adventurer-ranger-name
  antagonist: true
  objective: roles-antag-adventurer-ranger-objective
  guides: [ MinorAntagonists ]

- type: antag
  id: AdventurerCleric
  name: roles-antag-adventurer-cleric-name
  antagonist: true
  objective: roles-antag-adventurer-cleric-objective
  guides: [ MinorAntagonists ]

- type: antag
  id: AdventurerWizard
  name: roles-antag-adventurer-wizard-name
  antagonist: true
  objective: roles-antag-adventurer-wizard-objective
  guides: [ MinorAntagonists ]

# ----------------------------- Starting gear ------------------------------

# Common items (shoes, backpack, air tanks, rations...) are regular prototypes
# on purpose; only signature gear is bespoke.
# Masks and air tanks come from RoleSurvivalAdventurer (Adventurer/loadouts.yml)
# so vox get nitrogen and a mask on their face instead of oxygen gear.
- type: startingGear
  id: AdventurerBaseGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitAdventurer
    shoes: ClothingShoesLeather
    back: ClothingBackpack

- type: startingGear
  id: AdventurerWarriorGear
  parent: AdventurerBaseGear
  equipment:
    outerClothing: ClothingOuterArmorAdventurerWarrior
    head: ClothingHeadHelmetAdventurerWarrior
  inhand:
  - WeaponGreatswordAdventurer
  storage:
    back:
    - AdventurerCrowbar
    - WeaponHandaxeAdventurer
    - WeaponDaggerAdventurer
    - Torch
    - FoodTinMRE
    - DrinkWaterBottleFull

- type: startingGear
  id: AdventurerRangerGear
  parent: AdventurerBaseGear
  equipment:
    outerClothing: ClothingOuterArmorAdventurerRanger
    head: ClothingHeadHatBeret
  inhand:
  - WeaponBowAdventurer
  storage:
    back:
    - AdventurerCrowbar
    - WeaponDaggerAdventurer
    - Torch
    - Torch
    - GlowstickRed
    - FoodTinMRE
    - DrinkWaterBottleFull

- type: startingGear
  id: AdventurerClericGear
  parent: AdventurerBaseGear
  equipment:
    outerClothing: ClothingOuterArmorAdventurerCleric
    head: ClothingHeadHelmetAdventurerCleric
    eyes: ClothingEyesEyepatchHudMedical
  inhand:
  - WeaponStaffHealingAdventurer
  storage:
    back:
    - AdventurerCrowbar
    - WeaponMaceAdventurer
    - AdventurerHealingPotion
    - AdventurerHealingPotion
    - AdventurerBandages
    - AdventurerSalve
    - Candle
    - FoodTinMRE

- type: startingGear
  id: AdventurerWizardGear
  parent: AdventurerBaseGear
  equipment:
    outerClothing: ClothingOuterRobesAdventurerWizard
    head: ClothingHeadHatAdventurerWizard
    pocket1: AdventurersGrimoire
  storage:
    back:
    - AdventurerCrowbar
    - WeaponDaggerAdventurer
    - Candle
    - Candle
    - FoodTinMRE
    - DrinkWaterBottleFull
