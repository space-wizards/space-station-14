# ---------------------------- Antag specifiers ----------------------------

- type: antagSpecifier
  abstract: true
  parent: RestrictedAntag
  id: BaseAdventurer
  prefRoles:
  - GenericTeamAntagonist # For antag ban purposes
  briefing:
    text: adventurer-role-greeting
    color: Gold
  components:
  - type: NoSlip
  - type: NpcFactionMember
    factions:
    - Adventurer

- type: antagSpecifier
  parent: BaseAdventurer
  id: AdventurerWarrior
  prefRoles:
  - AdventurerWarrior
  spawnerPrototype: SpawnPointNukeopsCommander # PLACEHOLDER: replace with a bespoke spawn point on a party map
  startingGear: AdventurerWarriorGear
  components:
  - type: Adventurer
    armorClass: 16
    critThreshold: 250
    deadThreshold: 350
  mindRoles:
  - MindRoleAdventurerWarrior

- type: antagSpecifier
  parent: BaseAdventurer
  id: AdventurerRanger
  prefRoles:
  - AdventurerRanger
  spawnerPrototype: SpawnPointNukeopsOperative # PLACEHOLDER: replace with a bespoke spawn point on a party map
  startingGear: AdventurerRangerGear
  components:
  - type: Adventurer
    armorClass: 12
    critThreshold: 120
    deadThreshold: 220
  mindRoles:
  - MindRoleAdventurerRanger

- type: antagSpecifier
  parent: BaseAdventurer
  id: AdventurerCleric
  prefRoles:
  - AdventurerCleric
  spawnerPrototype: SpawnPointNukeopsMedic # PLACEHOLDER: replace with a bespoke spawn point on a party map
  startingGear: AdventurerClericGear
  components:
  - type: Adventurer
    armorClass: 14
    critThreshold: 150
    deadThreshold: 250
  mindRoles:
  - MindRoleAdventurerCleric

- type: antagSpecifier
  parent: BaseAdventurer
  id: AdventurerWizard
  prefRoles:
  - AdventurerWizard
  spawnerPrototype: SpawnPointNukeopsOperative # PLACEHOLDER: replace with a bespoke spawn point on a party map
  startingGear: AdventurerWizardGear
  components:
  - type: Adventurer
    armorClass: 10
    critThreshold: 100
    deadThreshold: 200
  mindRoles:
  - MindRoleAdventurerWizard

# ----------------------------- Starting gear ------------------------------

- type: startingGear
  id: AdventurerBaseGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitAdventurer
    shoes: ClothingShoesAdventurer
    mask: ClothingMaskAdventurer
    back: ClothingBackpackAdventurer
    suitstorage: AdventurerAirTankDouble

- type: startingGear
  id: AdventurerWarriorGear
