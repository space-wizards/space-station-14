  id: CosmicCultist
  prefRoles: [ CosmicCultist ]
  briefing:
    text: cosmiccult-role-greeting
    color: "#4cabb3"
    sound: /Audio/Cosmic/cosmic-start.ogg
  components:
  - type: CosmicCultist
  - type: RevolutionaryImmune
  - type: ZombieImmune
  - type: ActionGrant
    removeOnShutdown: false
    actions:
    - ActionCosmicSiphon
    - ActionCosmicShunt
    - ActionCosmicShift
    # ABILITIES HERE FOR DEBUGGING
    - ActionCosmicFragmentation
    - ActionCosmicNova
    - ActionCosmicImposition
    - ActionCosmicIngress
    - ActionCosmicGlare
    - ActionCosmicLapse
    # ABILITIES HERE FOR DEBUGGING
  mindRoles:
  - MindRoleCosmicCultist
