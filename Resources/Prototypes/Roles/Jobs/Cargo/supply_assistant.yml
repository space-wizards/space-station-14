- type: job
  id: SupplyAssistant
  name: job-name-supply-assistant
  description: job-description-supply-assistant
  playTimeTracker: JobSupplyAssistant
  setPreference: false # TEMPORARILY not a player-facing role until the spawns are mapped; otherwise Cargo is just entirely unplayable for new players
  requirements:
    - !type:DepartmentTimeRequirement
      department: Cargo
      time: 10h
      inverted: true # stop playing intern if you're good at Cargo!
  startingGear: SupplyAssistantGear
  icon: "JobIconSupplyAssistant"
  supervisors: job-supervisors-cargo
  guides: [ Cargo ] # TODO: should have a more specific guidebook page instead of using the department itself
  access:
  - Cargo
  - Maintenance

- type: startingGear
  id: SupplyAssistantGear
  equipment:
    shoes: ClothingShoesColorBlack
    id: SupplyAssistantPDA
    ears: ClothingHeadsetCargo
    pocket1: AppraisalTool
    pocket2: BookLogisticsManual
  #storage:
    #back:
    #- Stuff

- type: chameleonOutfit
  id: SupplyAssistantChameleonOutfit
  job: SupplyAssistant
  equipment:
    head: ClothingHeadHatCargosoft
    eyes: ClothingEyesGlassesCheapSunglasses
    mask: ClothingMaskBreath
    outerClothing: ClothingOuterWinterCargo
    neck: ClothingNeckScarfStripedBrown
    gloves: ClothingHandsGlovesFingerless
