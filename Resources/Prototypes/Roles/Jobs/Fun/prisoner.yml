# Prisoner isn't an actual roundstart role, so these startingGear prototypes are mostly for admeme/debug/mapping purposes
- type: startingGear
  id: PrisonerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitPrisoner
    shoes: ClothingShoesColorBlack
    id: PrisonerIDCard

- type: startingGear
  parent: PrisonerGear
  id: PrisonerMuzzledGear
  equipment:
    mask: ClothingMaskMuzzle

- type: chameleonOutfit
  id: PrisonerChameleonOutfit
  loadoutName: job-name-prisoner
  name: job-name-prisoner
  icon: "JobIconPrisoner"
  startingGear: PrisonerMuzzledGear
  equipment: # "real" prisoners obviously have limited access to clothing, so the head/eyes/outerClothing slots just use generic clothes to place *something* in that slot
    head: ClothingHeadHatOrangesoft
    eyes: ClothingEyesGlassesCheapSunglasses
    ears: ClothingHeadsetGrey
    outerClothing: ClothingOuterWinterColorOrange
    neck: ClothingNeckBling
    back: ClothingBackpack # we COULD use the eletropack, but an electropack that doesn't work and that security doesn't remember handing out is probably more suspicious
    gloves: ClothingHandsGlovesColorBlack
    id: PrisonerPDA # PDA instead of the ID alone so that a chameleon PDA isn't just left as-is

