- type: entity
  id: ActionActivateAdrenalImplant
  name: Активировать имплант
  description: Повышает ваш пульс, скорость и все побочки, не используйте все заряды разом.
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: _DeadSpace/Actions/implants_actions.rsi
      state: adrenal
    useDelay: 120
    checkCanInteract: false
  - type: InstantAction
    event: !type:UseInjectReagentsImplantEvent

- type: entity
  parent: BaseAction
  id: ActionRetractableItemMantisBladesImplant
  name: "[color=red]Переключить клинки богомола[/color]"
  description: Пустите их под клинок.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    raiseOnAction: true
    itemIconStyle: BigAction
    icon:
      sprite: _DeadSpace/Actions/mantisblades_actions.rsi
      state: mantis-toggle
  - type: InstantAction
    event: !type:OnRetractableItemActionEvent
  - type: RetractableItemAction
    spawnedPrototype: MantisBladesSyndicate
    summonSounds:
      collection: MantisExtend
    retractSounds:
      collection: MantisRetract

- type: entity
  parent: BaseAction
  id: ActionRetractableItemMonowireImplant
  name: "[color=red]Переключить моноструну[/color]"
  description: Распилите их пополам.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    raiseOnAction: true
    itemIconStyle: BigAction
    icon:
      sprite: _DeadSpace/Actions/monowire_actions.rsi
      state: monowire-toggle
  - type: InstantAction
    event: !type:OnRetractableItemActionEvent
  - type: RetractableItemAction
    spawnedPrototype: MonowireSyndicate
    summonSounds:
      collection: MonowireExtend
    retractSounds:
      collection: MonowireRetract

- type: entity
  parent: BaseAction
  id: ActionMantisJump
  name: "[color=red]Рывок богомола[/color]"
  description: Набросьтесь на врага со всей ненавистью.
  components:
  - type: Action
    useDelay: 2
    itemIconStyle: NoItem
    icon:
      sprite: _DeadSpace/Actions/mantisblades_actions.rsi
      state: mantis-dash
  - type: InstantAction
    event: !type:GravityJumpEvent {}


- type: entity
  id: ActionActivateRezervImplant
  name: "[color=cyan]Высвободить резервы[/color]"
  description: Форсаж организма для того самого момента.
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: _DeadSpace/Actions/implants_actions.rsi
      state: rezerv
    useDelay: 90
    checkCanInteract: false
  - type: InstantAction
    event: !type:UseInjectReagentsImplantEvent

- type: entity
  id: ActionActivateSandevistanImplant
  name: "[color=red]Активировать Сандевистан[/color]"
  description: Продашь свою душу за силу?
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: _DeadSpace/Actions/implants_actions.rsi
      state: sandevistan
    useDelay: 2
    checkCanInteract: false
  - type: InstantAction
    event: !type:ActivateSandevistanImplantEvent
