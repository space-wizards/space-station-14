- type: entity
  parent: WallPlastitanium
  id: WallTitanaluminum
  name: титан алюминиевая стена
  description: Благодаря уникальному сочетанию титана и алюминия, такие стены обладают высокой стойкостью к коррозии, отличной прочностью и низким весом. Отличное решение для применения в космических условиях и не только!
