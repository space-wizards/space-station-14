- type: entity
  parent: BaseMobSpeciesOrganic
  id: BaseMobKobolt
  abstract: true
  components:
  - type: HumanoidAppearance
    species: Kobolt
    hideLayersOnEquip:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
    - Tail
  - type: Hunger
  - type: Puller
    needsHands: false
  - type: Thirst
  - type: Icon
    sprite: Mobs/Species/Reptilian/parts.rsi
    state: full
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    scale: 0.9, 0.8
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        # they r smaller
        density: 120
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Body
    prototype: Kobolt
    requiredLegs: 2
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatLizard
      amount: 5
  - type: LizardAccent
  - type: Speech
    speechSounds: Lizard
    speechVerb: Reptilian
    allowedEmotes: ['Weh']
  - type: TypingIndicator
    proto: lizard
  - type: Vocal
    sounds:
      Male: MaleReptilian
      Female: FemaleReptilian
      Unsexed: MaleReptilian
  # - type: BodyEmotes
  #   soundsId: ReptilianBodyEmotes
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Scale
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 42
  - type: TemperatureSpeed
    thresholds:
      301: 0.8
      295: 0.6
      285: 0.4
  - type: Wagging
  - type: Inventory
    speciesId: reptilian # for reptilian masks
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.7
    baseSprintSpeed: 4.9
  - type: Stamina
  - type: Sanity # DS14
  - type: Language
    selectedLanguage: GeneralLanguage
    knownLanguages:
    - ReptilianLanguage
    - GeneralLanguage
  - type: SpeedSliding
    minSlideSpeed: 5
  - type: SlowOnDamage
    speedModifierThresholds:
      50: 0.7
      70: 0.5
  - type: MobThresholds
    thresholds:
      0: Alive
      90: PreCritical
      110: Critical
      190: Dead

- type: entity
  parent: BaseSpeciesDummy
  id: MobKoboltDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: HumanoidAppearance
    species: Kobolt
    hideLayersOnEquip:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
    - Tail
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    scale: 0.9, 0.8
  - type: Inventory
    speciesId: reptilian
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: Language
    selectedLanguage: GeneralLanguage
    knownLanguages:
    - ReptilianLanguage
    - GeneralLanguage
