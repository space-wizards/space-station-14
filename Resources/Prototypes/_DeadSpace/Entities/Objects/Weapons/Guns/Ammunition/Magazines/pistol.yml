- type: entity
  parent: BaseMagazinePistolSubMachineGun
  id: DrumPistolSubMachineGun
  name: барабанный магазин ПП (9х19 мм)
  description: Магазин барабанного типа на 60 патронов калибра 9х19 мм.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistol
    mayTransfer: true
    whitelist:
      tags:
        - CartridgePistol
    capacity: 60
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/bullet_insert.ogg
  - type: Sprite
    sprite: _DeadSpace/Objects/Weapons/Guns/Ammunition/Magazine/Pistol/smg_drum.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  
- type: entity
  parent: DrumPistolSubMachineGun
