    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Tag
    tags:
      - SMGDrumMagazine
  
