- type: entity
  id: BulletEnergyCrossbow
  name: bullet(crossbow)
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Weapons/Guns/Projectiles/crossbowbullet.rsi
    layers:
    - state: bulletcrossbow
      shader: unshaded
  - type: Reflective
    reflective:
    - NonEnergy
  - type: Projectile
    damage:
      types:
        Poison: 10
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: StaminaDamageOnCollide
    damage: 20
  - type: StunOnCollide
    knockdownAmount: 3

- type: entity
  id: BulletEnergyCrossbowLarge
  name: bullet(crossbow large)
  parent: BulletEnergyCrossbow
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Poison: 5
        Caustic: 5
  - type: StaminaDamageOnCollide
    damage: 15
  - type: StunOnCollide
    knockdownAmount: 0.5
