- type: entity
  parent: BaseItem
  id: SyndieFlamethrower
  name: огнемёт
  description: Огнемёт пневматический высокого давления. Лучшая ветвь эволюции главного орудия военных преступлений Эры Земли.
  components:
  - type: Tag
    tags:
    - FlamethrowerNozzle
  - type: Sprite
    sprite: _DeadSpace/Objects/Weapons/Guns/Basic/syndie_flamethrower.rsi
    state: icon
  - type: Item
    sprite: _DeadSpace/Objects/Weapons/Guns/Basic/syndie_flamethrower.rsi
    size: Large
    shape:
    - 0,0,4,1
  - type: ContinuousFlamethrower
    shotSound:
      path: /Audio/_DeadSpace/Weapons/Guns/Gunshots/flamethrower.ogg
    ambientSound:
      path: /Audio/_DeadSpace/Weapons/Guns/Gunshots/flamethrower_effect.ogg
  - type: PointLight
    enabled: false
    color: "#FF4A08"
    radius: 5
    energy: 4
    softness: 1
    castShadows: false
  - type: MultiHandedItem
  - type: Appearance
  - type: SlotBasedConnectedContainer
    targetSlot: suitStorage
    containerWhitelist:
      tags:
      - FlamethrowerBackTank
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_DeadSpace/Items/Handing/gun/gun_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_DeadSpace/Items/Handing/gun/gun_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_DeadSpace/Items/Handing/gun/gun_drop.ogg
