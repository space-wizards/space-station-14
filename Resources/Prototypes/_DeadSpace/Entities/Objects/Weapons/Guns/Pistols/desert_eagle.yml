  id: WeaponPistolGoldDesertEagle
  name: золотой пустынный орёл
  description:  Позолочённый корпус из 18-каратного золота ложится очень хорошо, сочетая в себе элегантность и удобства. Убей своих врагов со стилем!
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Weapons/Guns/Pistols/golddeserteagle.rsi
  - type: Clothing
    sprite: _DeadSpace/Objects/Weapons/Guns/Pistols/golddeserteagle.rsi
  - type: Gun
    fireRate: 2
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_DeadSpace/Weapons/Guns/Gunshots/deserteagle.ogg
      params:
        volume: 2
  - type: Tag
    tags:
    - PistolDesertEagle
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineEagleGold
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineEagle
            - MagazineEagleAP
      gun_chamber:
        name: Chamber
        startingItem: CartridgeHeavyPistol
        priority: 1
        whitelist:
          tags:
            - CartridgeHeavyPistol
  - type: StaticPrice
    price: 198400

- type: entity
  parent: BaseMagazineEagle
  id: MagazineEagleGold
  name: позолоченый пистолетный магазин пустынного орла (.50 AE)
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeHeavyPistol
  - type: Sprite
