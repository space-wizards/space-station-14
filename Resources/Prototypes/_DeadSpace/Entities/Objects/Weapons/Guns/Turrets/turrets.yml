- type: entity
  parent: [BaseWeaponBallisticTurret, BaseSyndicateContraband]
  id: WeaponTurretTaipan
  name: баллистическая турель
  description: Автоматическая турель с баллистическим пулемётом.
  suffix: Тайпан
  components:
  - type: NpcFactionMember
    factions:
    - Taipan
  - type: TurretTargetSettings
    turretFactions: [Taipan, SyndicateAssault]
    exemptAccessLevels:
    - Borg
    - BasicSilicon

- type: entity
  parent: WeaponEnergyTurretStationBase
  id: WeaponEnergyTurretTaipanAI
  name: охранная турель
  description: Высокотехнологичная автономная система вооружения, предназначенная для предотвращения проникновений посторонних лиц в важные зоны.
  suffix: Тайпан, ИИ, Борги
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Weapons/Guns/Turrets/sentry_turret.rsi
  - type: AccessReader
    access: [["StationAi"], ["TaipanResearchDirector"]]
  - type: StationAiTurret
  - type: TurretTargetSettings
    turretFactions: [Taipan, SyndicateAssault]
    exemptAccessLevels:
    - Borg
    - BasicSilicon
  - type: Machine
    board: WeaponEnergyTurretTaipanAIMachineCircuitboard
  - type: DeviceNetwork
    receiveFrequencyId: TurretControlAI
    transmitFrequencyId: TurretAI

