  description: Плюшевая игрушка девушки-бестида в снаряжении... ядерных оперативников? ЦентКому вообще нечего делать? Она выглядит... мелкой. Зачем вы... От неё не пахнет, хватит нюхать игрушки. На бирке кто-то написал "Оперативник Хвостатая". Не гладь её хвост!
