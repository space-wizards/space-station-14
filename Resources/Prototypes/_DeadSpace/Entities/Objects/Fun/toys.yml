# Плюшевые игрушки очень крутых админов или же плюшки IV класса.
- type: entity
  parent: BasePlushieDeadSpaceMisc
  id: PlushieMagicColonel
  name: плюшевый Полковник
  description: Половник.. Полковник.. Неважно. Одет в знакомую, но не повсеместно используемую форму с шевроном буквы А. Лицо фигурировало в нескольких новостных статьях, вот только не лучшего содержания. Обычно ему никто не пишет. Возможно содержит внутри гранату. Бирка на груди гласит - "Валентин Шевченко".
  components:
  - type: Sprite
    state: plushie_colonel
    scale: 1.1,1.1
  - type: TTS
    voice: Barman
  - type: SpeakOnTrigger
    pack: PlushieColonelSpeech

- type: entity
  parent: BasePlushieDeadSpaceMisc
  id: PlushieFyrmorEklmn
  name: плюшевый ЁКЛМН037
  description: Плюшевый, явно не железный, как могло показаться на первый взгляд, - синтетик. Чистый белоснежный халат и бежевый мониторчик необычной формы. . . Вроде бы милая и яркая игрушка, пока вы не замечаете бирку с надписью на задней стороне халата - "Надеюсь, ты хотя бы помыл руки перед тем, как трогать мою маленькую копию, недоумок".
  components:
  - type: Sprite
    state: plushie_fyrmor
    scale: 0.9,0.9
  - type: TTS
    voice: Dick
  - type: SpeakOnTrigger
    pack: PlushieFyrmorEklmnSpeech

- type: entity
  parent: BasePlushieDeadSpaceMisc
