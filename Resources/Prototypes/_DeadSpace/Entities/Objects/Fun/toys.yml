  description: Плюшевая игрушка с одеждой инструктора службы безопасности. На открытых частях тела виднеются шрамы, особенно выделяется алый шрам на правом глазе, в котором виднеются маленькие красные кристаллы, а также вы чуете от неё запах напалма. На бирке написано - Дмитрий Спейсов.
  components:
  - type: Sprite
