- type: entity
  parent: BasePlushieDeadSpaceMisc
  id: PlushieDosDydosYukari
  name: плюшевая Юкари Идзуми Каэро
  description: Плюшевая офицер специальных операций. Можно заметить, что у неё в ушах находятся совмещённые с гарнитурой наушники, а в карманах завалялся музыкальный плеер, баночка пива, а из бездонной сумки проглядывается бутылочка сакэ.. и христов с скороходами. Туда дальше смотреть страшно, ибо там похоже половина всего арсенала СЦК покоится. И... Разве костюм-карандаш, обычные туфли, колготки и мантия полевого офицера по уставу у неё?
  components:
  - type: Sprite
    state: plushie_yukari
  - type: TTS
    voice: Elisif
  - type: SpeakOnTrigger
    pack: PlushieYukariSpeech

- type: entity
