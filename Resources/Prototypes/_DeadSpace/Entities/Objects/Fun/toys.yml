  id: PlushieDajidanNikita
  name: плюшевый Никита Даджиданов
  description: Эксклюзивная плюшевая игрушка в элитарной форме Квартирмейстера. Острые скулы, охотничий взгляд. Плюшка выглядит крайне недовольно, а пахнет от неё безграничными деньгами. На поясе виден миниатюрный планшет заявок, забитый заказами нищих глав. На бирке написано — «Сшита и одобрена шефом Алексеем Французовым».
