  id: PlushieYosugaMarsel
  name: плюшевый Марсель
  description: Плюшевая игрушка в одежде пилота службы безопасности. На его лице маска пилота, к сожалению, таких больше не выдают. От него исходит легкий холодок бескрайнего космоса. На бирке написано - Марсель Тихонов.
