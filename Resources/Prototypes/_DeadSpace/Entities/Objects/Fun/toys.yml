  description: Акула на ножках с баллоном и газоанализатором. Пахнет рыбой и вульпканином. Совершенно точно не взорвётся через 10 секунд. К каске прикреплена бирка с надписью "Щтиц'Юин'Тейльсс Иехан'Вийт'Ойанекс"
