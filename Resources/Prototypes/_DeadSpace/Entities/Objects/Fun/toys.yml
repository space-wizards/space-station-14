  id: PlushieCyberBobeksRiikka
  name: плюшевая Рийкка
  description: Плюшевая аркана, референс которой, по всей видимости, брали с крайне уставшей личности. Одета в одежду, чем то напоминающую форму командира отряда "Синдиката"... Или это очередная мода ЦентКома?.. На хвосте виднеется бирка с надписью "Рийкка Меервинг Иреноиаль".
  components:
  - type: Sprite
