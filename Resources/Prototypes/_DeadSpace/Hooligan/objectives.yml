- type: entity
  parent: BaseTargetObjective
  id: HooliganBeatObjective
  description: Кажись этот индивид чё-то сказал про мою прическу. Вот урод!
  components:
  - type: Objective
    difficulty: 1.5
    issuer: objective-issuer-hooligan
    icon:
      sprite: Objects/Weapons/Melee/baseball_bat.rsi
      state: icon
  - type: TargetObjective
    title: objective-condition-hooligan-beat-title
  - type: PickRandomPerson
    filters:
    - !type:SameMapMindFilter
    - !type:BlacklistedJobsMindFilter
      blacklist:
      - TaipanAtmosphericsEngineer
      - TaipanBotanist
      - TaipanCargotech
      - TaipanChef
      - TaipanCommunicationsOfficer
      - TaipanMedic
      - TaipanParamedic
      - TaipanRecruit
      - TaipanResearchDirector
      - TaipanResearcher
      - TaipanTechnicalOperationsSupervisor
      - TaipanTechnician
  - type: NumberObjective
    min: 30
    max: 50
  - type: HooliganBeatCondition
  - type: RandomObjectiveDescription
    descriptions:
      - objective-condition-hooligan-beat-description
      - objective-condition-hooligan-beat-description-1
      - objective-condition-hooligan-beat-description-2
      - objective-condition-hooligan-beat-description-3
      - objective-condition-hooligan-beat-description-4
      - objective-condition-hooligan-beat-description-5

