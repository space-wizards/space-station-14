          reagent: Gliomorphin
          min: 16
          max: 20
        time: 2
        type: Remove
      - !type:ModifyParalysis
        conditions:
        - !type:ReagentCondition
          reagent: Gliomorphin
          min: 16
          max: 20
        time: 2
        type: Remove

