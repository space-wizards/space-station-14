# Sentidol - Anxiolytic
- type: reagent
  id: Sentidol
  name: reagent-name-sentidol
  group: Medicine
  desc: reagent-desc-sentidol
  physicalDesc: reagent-physical-desc-pungent
  flavor: medicine
  color: "#57356a"
  metabolisms:
    Medicine:
      metabolismRate: 0.5
      effects:
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Sentidol
          min: 2.5
          max: 4.99
        type: Local
        visualType: Small
        messages: ["sentidol-effect-melancholy"]
        probability: 0.2
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Sentidol
          min: 5
          max: 14.99
        type: Local
        visualType: Small
        messages: ["sentidol-effect-relaxation"]
        probability: 0.2
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Sentidol
          min: 15
          max: 19.99
        type: Local
        visualType: Small
        messages: ["sentidol-effect-sleepy"]
        probability: 0.2
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Sentidol
          min: 15
        effectProto: StatusEffectDrowsiness
        time: 4
        type: Add
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Sentidol
          min: 20
        type: Local
        visualType: MediumCaution
        messages: ["sentidol-effect-overdose"]
        probability: 0.2
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: Sentidol
          min: 20
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Sentidol
          min: 20
        damage:
          types:
            Poison: 0.37

# Gliomorphin - Neuroleptic
