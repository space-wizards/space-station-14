# Friogeliyeva kislota (Cryogenic Acid) - Anti-burn
- type: reagent
  id: FriogeliyevaKislota
  name: reagent-name-friogeliyeva-kislota
  group: Medicine
  desc: reagent-desc-friogeliyeva-kislota
  physicalDesc: reagent-physical-desc-crystalline
  flavor: medicine
  color: "#81d4fa"
  specificHeat: 2.9
  boilingPoint: 100.0
  meltingPoint: 0.0
  worksOnTheDead: true
  reactiveEffects:
    Extinguish:
      methods: [ Touch ]
      effects:
      - !type:Extinguish
        minScale: 5
      - !type:AdjustTemperature
        minScale: 5
        scaling: false
        amount: -15000
  metabolisms:
    Poison:
      metabolismRate: 0.5
      effects:
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: FriogeliyevaKislota
          min: 0.7
          max: 1
        damage:
          types:
            Cold: 3.7
      - !type:AdjustTemperature
        conditions:
        - !type:ReagentCondition
          reagent: FriogeliyevaKislota
          min: 3
        amount: -15000

