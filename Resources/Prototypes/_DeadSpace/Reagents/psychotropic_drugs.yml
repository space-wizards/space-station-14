        messages: ["gliomorphin-effect-haze"]
        probability: 0.2
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Gliomorphin
          min: 5
          max: 6.99
        key: TemporaryBlindness
        component: TemporaryBlindness
        time: 10
        type: Update
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Gliomorphin
          min: 7
          max: 14.99
        type: Local
        visualType: Small
        messages: ["gliomorphin-effect-numb"]
        probability: 0.2
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Gliomorphin
          min: 7
          max: 14.99
        key: TemporaryBlindness
        component: TemporaryBlindness
        time: 10
        type: Update
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Gliomorphin
          min: 15
          max: 15.99
        type: Local
        visualType: Small
        messages: ["gliomorphin-effect-pain"]
        probability: 0.2
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Gliomorphin
          min: 15
          max: 15.99
        key: TemporaryBlindness
        component: TemporaryBlindness
        time: 15
        type: Update
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Gliomorphin
          min: 16
          max: 20
        type: Local
        visualType: MediumCaution
        messages: ["gliomorphin-effect-rage"]
        probability: 0.2
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Gliomorphin
          min: 16
          max: 20
        key: TemporaryBlindness
        component: TemporaryBlindness
        time: 15
        type: Update
      - !type:Emote
        conditions:
