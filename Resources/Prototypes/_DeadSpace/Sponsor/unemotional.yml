- type: entity
  parent: PowerDrill
  id: PowerDrillIrisReda
  name: электродрель "LuaTech"
  description: Изготовлено на заказ организацией LuaTech.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/unemotional/Tools/iris_tools_powerdrill.rsi
    state: drill_screw
  - type: Item
    sprite: _DeadSpace/Sponsor/unemotional/Tools/iris_tools_powerdrill.rsi
    size: Small
  - type: Clothing
    sprite: _DeadSpace/Sponsor/unemotional/Tools/iris_tools_powerdrill.rsi
    quickEquip: false
    slots:
      - Belt
  - type: MultipleTool
    statusShowBehavior: true
    entries:
      - behavior: Screwing
        sprite:
          sprite: _DeadSpace/Sponsor/unemotional/Tools/iris_tools_powerdrill.rsi
          state: drill_screw
        useSound:
          path: /Audio/Items/drill_use.ogg
        changeSound:
          path: /Audio/Items/change_drill.ogg
      - behavior: Anchoring
        sprite:
          sprite: _DeadSpace/Sponsor/unemotional/Tools/iris_tools_powerdrill.rsi
          state: drill_bolt
        useSound:
          path: /Audio/Items/drill_use.ogg
        changeSound:
          path: /Audio/Items/change_drill.ogg

