  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/unemotional/Tools/iris_tools_multitool.rsi
    layers:
    - state: icon
    - state: green-unlit
      shader: unshaded
  - type: Clothing
    sprite: _DeadSpace/Sponsor/unemotional/Tools/iris_tools_multitool.rsi
    quickEquip: false
    slots:
    - Belt

- type: entity
  parent: trayScanner
  id: trayScannerIrisReda
  name: Т-лучевой сканер "LuaTech"
  description: Т-лучевой сканер, изготовленый на заказ организацией LuaTech.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/unemotional/Tools/iris_tools_trayscanner.rsi
    layers:
    - state: tray-off
      map: ["base"]
  - type: Item
    sprite: _DeadSpace/Sponsor/unemotional/Tools/iris_tools_trayscanner.rsi

- type: entity
  parent: JawsOfLife
  id: JawsOfLifeIrisReda
  name: челюсти жизни "LuaTech"
  description: Изготовлено на заказ организацией "LuaTech".
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/unemotional/Tools/iris_tools_jawsoflife.rsi
    state: syn_jaws_pry
  - type: Item
    inhandVisuals:
      left:
      - state: syn_inhand-left
      right:
      - state: syn_inhand-right
    size: Normal
  - type: Clothing
    sprite: _DeadSpace/Sponsor/unemotional/Tools/iris_tools_jawsoflife.rsi
    quickEquip: false
    slots:
      - Belt
  - type: MultipleTool
    entries:
      - behavior: Prying
        sprite:
          sprite: _DeadSpace/Sponsor/unemotional/Tools/iris_tools_jawsoflife.rsi
          state: syn_jaws_pry
        useSound: /Audio/Items/jaws_pry.ogg
        changeSound: /Audio/Items/change_jaws.ogg
      - behavior: Cutting
        sprite:
          sprite: _DeadSpace/Sponsor/unemotional/Tools/iris_tools_jawsoflife.rsi
          state: syn_jaws_cutter
        useSound: /Audio/Items/jaws_cut.ogg
        changeSound: /Audio/Items/change_jaws.ogg
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 10

- type: entity
  parent: WelderExperimental
  id: WelderIrisReda
  name: сварочный аппарат "LuaTech"
