# Crusher
- type: entity
  id: WeaponCrusherDrGnarAlt
  parent: WeaponCrusherGlaive
  name: Посох с бубенцами
  description: "К мосту подошёл путешественник, держа трость с колокольчиками. Он заметил меня в той канаве, я улыбнулась и окликнула его. С добрым взглядом он ответил: «Выглядишь ужасно». Я была поражена. Затем он спрыгнул вниз и перевязал мою лодыжку. "
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/DrGnarAlt/crusher.rsi
    layers:
    - state: icon
  - type: Item
    sprite: _DeadSpace/Sponsor/DrGnarAlt/crusher.rsi
    size: Huge
  - type: Clothing
    sprite: _DeadSpace/Sponsor/DrGnarAlt/crusher.rsi
    quickEquip: false
    slots:
    - suitStorage
  - type: Gun
    soundGunshot: /Audio/_DeadSpace/Sponsor/DrGnarAlt/Shot_Crusher.ogg
    fireRate: 1
    useKey: false
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.5
    rechargeSound:
      path: /Audio/_DeadSpace/Sponsor/DrGnarAlt/Reload_Crusher.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletCharge
    capacity: 1
    count: 1
  - type: PointLight
    color: "#ffba53"
    enabled: false
    radius: 4

