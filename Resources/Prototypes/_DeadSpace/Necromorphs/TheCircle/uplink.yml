- type: entity
  parent: [ BaseItem, UniPhonePresetUplink ]
  id: UniPhoneUplink
  name: аплинк uniPhone
  description: Новенький uniPhone 15 Pro, теперь в расцветке Титан.
  components:
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/TheCircle/Mics/etc/uplink.rsi
    layers:
    - state: icon
  - type: Item
    sprite: _DeadSpace/Necromorfs/TheCircle/Mics/etc/uplink.rsi
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Store
    balance:
      Telecrystal: 700

- type: entity
  id: UniPhonePresetUplink
  abstract: true
  components:
  - type: Store
    name: circle-store-name
    categories:
    - UniPhoneUplinkWeaponry
    - UniPhoneUplinkAmmo
    - UniPhoneUplinkMedical
    - UniPhoneUplinkGear
    - UniPhoneUplinkImplants
    - UniPhoneUplinkGrenade
    - UniPhoneUplinkOther
    currencyWhitelist:
    - Telecrystal
    balance:
      Telecrystal: 0

- type: storeCategory
  id: UniPhoneUplinkWeaponry
  name: Вооружение
  priority: 1

- type: storeCategory
