- type: gamePreset
  id: SiegeOfTheCircle
  alias:
    - UniOps
  name: thecircle-title
  description: thecircle-description
  showInVote: true
  showInAdminVote: true 
  voteType: rdm 
  rules:
  - WageScheduler 
  - SiegeOfTheCircle
  - BasicStationEventScheduler
  - MeteorSwarmScheduler
  - SpaceTrafficControlEventScheduler
  - BasicRoundstartVariation

- type: gamePreset
  id: SecretSiegeOfTheCircle
  alias:
    - secretUniOps
  name: secret-title
  description: secret-description
  showInVote: false
  showInAdminVote: false
  voteType: rdm 
  rules:
  - WageScheduler 
  - SiegeOfTheCircle
  - BasicStationEventScheduler
  - MeteorSwarmScheduler
  - SpaceTrafficControlEventScheduler
  - BasicRoundstartVariation

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseSiegeOfTheCircle
  components:
  - type: RuleGrids
  - type: AntagSelection
  - type: AntagLoadProfileRule
    speciesOverride: Human
    speciesOverrideBlacklist:
    - Vox
    - Diona
    - Xenomorph
    - IPC
    - Felinid
  - type: RandomMetadata
    nameSegments:
    - UnitologyHeavyFirst
    - UnitologyFighterSecond
    nameFormat: name-format-nuclear-operation

- type: entity
  parent: BaseSiegeOfTheCircle
  id: SiegeOfTheCircle
  components:
  - type: GameRule
    minPlayers: 50
  - type: CircleOpsRule
    windowUntilSendObelisk:
      min: 1m
      max: 1m
    windowBefoteWarDeclaration:
      min: 1m
      max: 1m
    windowAfterWarDeclare:
      min: 15m
      max: 15m
    windowUntilSpawnMoon:
      min: 15m
      max: 15m
  - type: LoadMapRule
    mapPath: /Maps/Nonstations/ds_thecircle_outpost_docked.yml
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    definitions:
    - prefRoles: [ CircleCommander ]
      fallbackRoles: []
      spawnerPrototype: SpawnPointCircleCommander
      startingGear: TheCircleLeaderGear
      playerRatio: 12
      briefing:
        text: roles-antag-thecircle-commander-start
        color: CornflowerBlue
        sound: "/Audio/_DeadSpace/Necromorfs/TheCircle/the-circle-start.ogg"
      roleLoadout:
        - RoleSurvivalTheCircle
      components:
      - type: Skill
        group: ALL
      - type: ObeliskActivateAbility
      - type: IntrinsicRadioTransmitter
        channels:
        - Unitolog
      - type: ActiveRadio
        channels:
        - Unitolog
      - type: IntrinsicRadioReceiver
      - type: Unitology
      - type: ImmunNecroobelisk
      - type: IgnoreKudzu
      - type: RandomMetadata
        nameSegments:
        - UnitologyCommanderFirst
        - UnitologyFighterSecond
        nameFormat: name-format-nuclear-operation
      - type: NpcFactionMember
        factions:
        - Syndicate
        - Necromorfs
      - type: Language
        selectedLanguage: NecromorfLanguage
        knownLanguages:
        - NecromorfLanguage
        - GeneralLanguage
      mindRoles:
      - MindRoleCircleCommander
      sponsorsPriority: true
    - prefRoles: [ CircleMedic ]
      fallbackRoles: []
