### Картридж Застабы
- type: entity
  id: BaseCartridgeRifleZastaba
  name: патрон (5,7х39 мм)
  parent: [ BaseCartridge, BaseSyndicateContraband ]
  abstract: true
  components:
  - type: Tag
    tags:
    - Cartridge
    - CartridgeZastabaNosle
  - type: CartridgeAmmo
    proto: BulletRifleZastaba
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/TheCircle/Weapon/weapons/zastaba/zastaba-casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  id: CartridgeRifleZastaba
  name: патрон (5,7х39 мм)
  parent: BaseCartridgeRifleZastaba
  components:
  - type: CartridgeAmmo
    proto: BulletRifleZastaba

### Проджектайл Застабы
- type: entity
  id: BulletRifleZastaba
  name: патрон (5,7х39 мм)
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanAmmo
  - type: HitscanBasicRaycast
    collisionMask: BulletImpassable
    maxDistance: 40
  - type: HitscanReflect
    reflectiveType: NonEnergy
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _DeadSpace/Objects/Weapons/Guns/Projectiles/traces.rsi
      state: muzzle
    travelFlash:
      sprite: _DeadSpace/Objects/Weapons/Guns/Projectiles/traces.rsi
      state: trace
    impactFlash:
      sprite: _DeadSpace/Objects/Weapons/Guns/Projectiles/traces.rsi
      state: impact
    bullet:
      sprite:
        sprite: _DeadSpace/Necromorfs/TheCircle/Weapon/weapons/zastaba/zastaba-projectile.rsi
        state: heavy-bullet-5.7
    speed: 315
  - type: HitscanBasicEffects
    sound:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: HitscanBasicDamage
    damage:
      types:
        Piercing: 15
        Blunt: 4
  - type: StaminaDamageOnCollide
    damage: 15

