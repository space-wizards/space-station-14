# Точмаш

- type: entity
  name: СР-92 Точмаш
  parent: BaseWeaponSubMachineGun
  id: WeaponTochmash
  description: Убойный пистолет-пулемёт специальной разработки, стоящий на вооружении у АПБТ. Заточен под CQB.
  suffix: Пистолет-пулемёт
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Clothing
    slots:
    - suitStorage
    - Belt
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/BSAA/weapons/Tochmash/Tochmash.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 7
    soundGunshot:
      path: /Audio/_DeadSpace/Necromorfs/BSAA/weapons/Tochmash/shot/Tochmash.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineCaselessRifle
        priority: 2
        whitelist:
          tags:
          - MagazineCaselessRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeCaselessRifle
        priority: 1
        whitelist:
          tags:
          - CartridgeCaselessRifle
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

- type: entity
  id: MagazineCaselessRifleBurn
  name: магазин (4.7х33 мм безгильзовые, Dragon's breath)
  parent: MagazineCaselessRifle
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeCaselessDragon
  - type: Sprite
    scale: 1.1, 1.1
    sprite: _DeadSpace/Necromorfs/BSAA/weapons/Tochmash/caseless_rifle_mag_burn.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: practice
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#76270d"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#76270d"

# Арес

- type: entity
  name: М8 "Арес"
  parent: BaseWeaponRifle
  id: WeaponRifleAres
  description: Автомат имеет подвижный ствол, двухкамерный ДТК замкнутого типа и смещенный вправо относительно оси канала ствола магазин.
  suffix: Автомат
  components:
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/BSAA/weapons/Ares/icon.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _DeadSpace/Necromorfs/BSAA/weapons/Ares/inhands.rsi
  - type: Item
    sprite: _DeadSpace/Necromorfs/BSAA/weapons/Ares/inhands.rsi
    size: Large
  - type: Gun
    fireRate: 7
    burstFireRate: 18
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - Burst
    shotsPerBurst: 2
    burstCooldown: 0.25
    soundGunshot:
      path: /Audio/_DeadSpace/Necromorfs/BSAA/weapons/Ares/shot/Ares.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: ADTExtMagazineRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - ADTExtMagazineRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeRifle
        priority: 1
        whitelist:
          tags:
            - CartridgeRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: UseDelay
    delay: 1.5

- type: entity
  id: ExtMagazineRifleBurn
  name: расширенный магазин (5.56х45 мм Dragon's breath)
  description: Увеличенный магазин под патрон 5.56 мм, с вместимостью в 45 единиц
  parent: ADTExtMagazineRifle
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeDragon
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/BSAA/weapons/Ares/magburn.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  id: BSAAPhaseBladeImplant
  parent: BaseSubdermalImplant
  name: имплант фазового клинка АПБТ
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionRetractableBSAAPhaseBlade
    whitelist:
      components:
      - Hands

- type: entity
  id: ActionRetractableBSAAPhaseBlade
  parent: BaseAction
  name: выпустить фазовый клинок
  description: Выпустить или убрать встроенный фазовый клинок.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    raiseOnAction: true
    itemIconStyle: BigAction
    icon:
      sprite: _DeadSpace/Necromorfs/BSAA/weapons/phase_blade.rsi
      state: action
  - type: InstantAction
    event: !type:OnRetractableItemActionEvent
  - type: RetractableItemAction
    spawnedPrototype: WeaponBSAAPhaseBlade
    summonSounds:
      collection: MantisExtend
    retractSounds:
      collection: MantisRetract

- type: entity
  id: WeaponBSAAPhaseBlade
  parent: BaseItem
  name: фазовый клинок АПБТ
  description: Встроенный клинок, фазовая кромка которого проходит сквозь броню.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/BSAA/weapons/phase_blade.rsi
    state: animation-icon
  - type: Item
    sprite: _DeadSpace/Necromorfs/BSAA/weapons/phase_blade.rsi
  - type: MeleeWeapon
    autoAttack: true
    attackRate: 1.35
    damage:
      types:
        Piercing: 15
    resistanceBypass: true
    animation: WeaponArcBSAAPhaseBlade
    wideAnimation: WeaponArcBSAAPhaseBlade
    angle: 0
    soundHit:
      collection: MantisAttack
    soundNoDamage:
      collection: MantisAttack
    soundSwing:
      collection: MantisAttack
  - type: Sharp

- type: entity
  id: WeaponArcBSAAPhaseBlade
  parent: WeaponArcStatic
  categories: [ HideSpawnMenu ]
  components:
  - type: WeaponArcVisuals
    fadeOut: false
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/BSAA/weapons/phase_arcs.rsi
    state: phase-precise
    drawdepth: Effects
  - type: TimedDespawn
    lifetime: 0.4
