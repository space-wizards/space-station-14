# Щит ВАНТ, Вереск и Сайга с их настройками

- type: entity
  name: ВАНТ-ВМ
  parent: BaseShield
  id: VantShield
  description: Передовой бронещит боевого стандарта КСО предназначенный для проведения штурмовых операций.
  components:
    - type: Sprite
      sprite: _DeadSpace/Necromorfs/BSAA/weapons/vant/vant.rsi
      state: icon
    - type: Item
      sprite: _DeadSpace/Necromorfs/BSAA/weapons/vant/vant.rsi
      heldPrefix: icon
    - type: Clothing
      sprite: _DeadSpace/Necromorfs/BSAA/weapons/vant/vant.rsi
      quickEquip: false
      slots:
      - suitStorage
    - type: Flash
    - type: LimitedCharges
      maxCharges: 2
    - type: AutoRecharge
      rechargeDuration: 30
    - type: Blocking
      passiveBlockFraction: 0.7
      activeBlockFraction: 0.7
      passiveBlockModifier:
        coefficients:
          Blunt: 0.7
          Slash: 0.7
          Piercing: 0.7
          Heat: 0.7
      activeBlockModifier:
        coefficients:
          Blunt: 0.8
          Slash: 0.8
          Piercing: 0.8
          Heat: 0.8
    - type: ShieldDash
      damage: 
        types:
          Blunt: 25
      damageToShield: 
        types:
            Blunt: 55
      staminaDamage: 60
      staminaDamageToUser: 30  

# Синабир-410

- type: entity
  name: Синабир-410
  parent: [BaseItem, BaseGunWieldable]
  id: WeaponSinabir
  description: Военизированная версия некогда гражданского оружия для охоты и самообороны. Использование тактических приспособлений, а также перевод в автоматический режим стрельбы, позволили сделать из простого ружья - машину смерти на близкой дистанции.
  components:
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/BSAA/weapons/Sinabir/Sinabir.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Large
  - type: Clothing
    sprite: _DeadSpace/Necromorfs/BSAA/weapons/Sinabir/Sinabir.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: GunRequiresWield
  - type: Gun
    fireRate: 2.4
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_DeadSpace/Necromorfs/BSAA/weapons/Sinabir/shot/Sinabir-shot.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineForSinabir
        priority: 2
        whitelist:
          tags:
          - MagazineForSinabir
          - MagazineForSinabirBurn
          - DrumForSinabirBurn
          - DrumForSinabir
        whitelistFailPopup: gun-magazine-whitelist-fail
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineAmmoProvider
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 500
  - type: UseDelay
    delay: 1.5

- type: entity
  id: BaseMagazineForSinabir
  name: магазин для Синабир-410 (12х70 дробь)
  parent: BaseItem
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag
    tags:
    - MagazineShotgun
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - ShellShotgun
    capacity: 10
    soundRack:
      path: /Audio/_Corvax/Weapons/Guns/Cock/shotgun_cock.ogg
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    scale: 1.1, 1.1
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Shotgun/m12.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: MagazineForSinabir
  name: магазин для Синабир-410 (12х70 дробь)
  parent: BaseMagazineForSinabir
  components:
  - type: BallisticAmmoProvider
    proto: ShellShotgun
    capacity: 10
  - type: Tag
    tags:
    - MagazineForSinabir
  - type: Item
    sprite: _DeadSpace/Necromorfs/BSAA/weapons/Sinabir/mag.rsi
  - type: Sprite
