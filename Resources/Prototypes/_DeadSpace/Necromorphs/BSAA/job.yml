# Джобка

- type: job
  id: BSAAFighterJob
  name: Боец АПБТ
  description: "Штурмовая единица альянса повышенной эффективности КСО"
  playTimeTracker: JobBSAA
  setPreference: false
  requirements:
    - !type:DepartmentTimeRequirement
      department: Security
      time: 201600 # 56 hours
    - !type:OverallPlaytimeRequirement
      time: 3096000 # 860 hours
  icon: "JobIconBSAAFighter"
  supervisors: job-supervisors-centcom
  canBeAntag: false
  accessGroups:
  - AllAccess
  access:
  - CentralCommand

