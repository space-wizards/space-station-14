- type: entity
  parent: [ BaseMobAsteroid, BaseMobLavalandFauna ]
  id: MobLavalandAshDrakePlayer
  name: пепельный дрейк
  description: Временное воплощение могучего хранителя некрополя.
  suffix: Lavaland, Player
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeadSpace/Lavaland/Mobs/AshDrake.rsi
    layers:
    - state: dragon
      map: ["enum.LavalandAshDrakeVisualLayers.Base"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.LavalandAshDrakeVisuals.State:
        enum.LavalandAshDrakeVisualLayers.Base:
          Dragon: { state: dragon }
          Shadow: { state: shadow }
          Swoop: { state: swoop }
          Dead: { state: dragon_dead }
  - type: MobThresholds
    thresholds:
      0: Alive
      550: Dead
  - type: MeleeWeapon
    angle: 0
    attackRate: 0.8
    animation: WeaponArcBite
    soundHit:
      path: /Audio/_DeadSpace/Lavaland/AshDrake/demon_attack1.ogg
    damage:
      types:
        Slash: 30
        Structural: 30
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.65
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: NoSlip
  - type: ActionGrant
    actions:
    - ActionDrakeFireBreath
    - ActionDrakeFireRain
    - ActionDrakeSwoop

- type: entity
  parent: BaseAction
  id: ActionDrakeFireBreath
  name: огненное дыхание
  description: Выпускает перед дрейком прямую полосу пламени.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 7
    icon:
      sprite: _DeadSpace/Lavaland/Effects/AshDrakeFireball.rsi
      state: fireball
  - type: TargetAction
    range: 6
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:DrakeFireBreathActionEvent
      range: 6
      stepDelay: 0.075
      sound:
        path: /Audio/_DeadSpace/Lavaland/AshDrake/fireball.ogg

- type: entity
  parent: BaseAction
  id: ActionDrakeFireRain
  name: огненный дождь
  description: Покрывает квадрат 5×5 клеток пламенем.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 7
    icon:
      sprite: _DeadSpace/Lavaland/Effects/AshDrakeFire.rsi
      state: fire
  - type: TargetAction
    range: 7
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:DrakeFireRainActionEvent
      radius: 2
      targetPrototype: LavalandAshDrakeTarget
      delay: 0.9
      sound:
        path: /Audio/_DeadSpace/Lavaland/AshDrake/fleshtostone.ogg

- type: entity
  parent: BaseAction
  id: ActionDrakeSwoop
  name: пикирование
  description: Перелетает в выбранную точку и обрушивается на окружающих.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 7
    icon:
      sprite: _DeadSpace/Lavaland/Mobs/AshDrake.rsi
      state: swoop
  - type: TargetAction
    range: 8
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:DrakeSwoopActionEvent
      maxRange: 8
      stepDelay: 0.085
      windup: 0.6
      recover: 0.35
      windupSound:
        path: /Audio/_DeadSpace/Lavaland/AshDrake/fireball.ogg
      impactSound:
        path: /Audio/_DeadSpace/Lavaland/AshDrake/meteorimpact.ogg

