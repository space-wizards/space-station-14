# threats called in by ninja hacking comms console
- type: weightedRandom
  id: NinjaThreats
  weights:
    Dragon: 1
    Revenant: 1
    Changeling: 0.75 # lower weight due to midround lings being able to spawn earlier in comparison to revenant and dragon

- type: ninjaHackingThreat
  id: Dragon
  announcement: terror-dragon
  rule: DragonSpawn

- type: ninjaHackingThreat
  id: Revenant
  announcement: terror-revenant
  rule: RevenantSpawn

- type: changelingHackingThreat
  id: Changeling
  announcement: terror-changeling
  rule: SpaceChangelingSpawn
