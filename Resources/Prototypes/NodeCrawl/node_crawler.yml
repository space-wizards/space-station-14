- type: entity
  abstract: true
  id: MobNodeCrawler
  components:
  - type: NodeCrawler
    revealedComponents:
    - Content.Shared.Atmos.Components.PipeAppearanceComponent
    exitNodes:
      components:
      - NodeCrawlVentAccess

- type: entity
  categories: [ HideSpawnMenu ]
  id: NodeCrawlMover
  components:
  - type: InputMover
  - type: NodeCrawlerMovement
  - type: Physics
    bodyType: KinematicController
    canCollide: false
  - type: ContainerContainer
    containers:
      mover-container: !type:Container
  - type: LagCompensation
  - type: MovementSpeedModifier
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 15
        layer:
        - GhostImpassable
  - type: Input
    context: "human"
