- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerPulsing
  name:  xenoarch-trigger-tip-pulsing
  components:
  - type: XATToolUse
    requiredTool: Pulsing
  - type: XATExaminableText
    examineText: xenoarch-trigger-examine-pulsing

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerTimer
  name:  xenoarch-trigger-tip-timer
  components:
  - type: XATTimer
    possibleDelayInSeconds:
      min: 80
      max: 120

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerBlood
  name:  xenoarch-trigger-tip-blood
  components:
  - type: XATReactive
    reagents:
    - Blood
    - CopperBlood
    - InsectBlood
    - Slime
    - AmmoniaBlood
    - ZombieBlood
    - Sap
    - SulfurBlood

- type: entity
