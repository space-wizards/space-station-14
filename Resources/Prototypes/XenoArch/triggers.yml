- type: xenoArchTrigger
  id: TriggerAttackStaminaDamage
  tip: xenoarch-trigger-tip-stamina-damage
  components:
  - type: XATInteractAttack
    interactionCount:
      max: 3
    whitelist:
      components:
      - StaminaDamageOnCollide
      - StaminaDamageOnHit

- type: xenoArchTrigger
  id: TriggerAttackLaser
  tip: xenoarch-trigger-tip-laser
