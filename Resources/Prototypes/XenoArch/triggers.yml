    - Fiber
    - JuiceThatMakesYouWeh
    - Lye
    - Nutriment
    - PestKiller
    - SpaceLube
    - SpaceGlue
    - SpaceCleaner
    - Sugar
    - TableSalt
    - Vitamin
    - WeedKiller
    - WeldingFuel
#endregion
#region Handheld triggers

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerMicrowave
  name: Microwave radiation
  components:
  - type: XATMicrowave

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerThrow
  name: Being thrown
  components:
  - type: XATItemLand

#endregion
