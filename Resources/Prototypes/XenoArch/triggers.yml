- type: entityTable
  id: XenoArtifactTriggerDefaultTable
  table: !type:GroupSelector
    conditionsForChildren:
      - !type:ExcludeEntitiesFromContextCondition
    children:
    - id: TriggerMusic
      weight: 1
    - id: TriggerHeat
      weight: 1
    - id: TriggerCold
      weight: 0.5
    - id: TriggerNoOxygen
      weight: 1
    - id: TriggerWater
      weight: 1
    - id: TriggerCO2
      weight: 0.5
    - id: TriggerPlasma
      weight: 0.5
    - id: TriggerN2O
      weight: 0.5
    - id: TriggerTritium
      weight: 0.1
    - id: TriggerAmmonia
      weight: 0.1
    - id: TriggerFrezon
      weight: 0.1
    - id: TriggerRadiation
      weight: 1
    - id: TriggerPressureHigh
      weight: 0.5
    - id: TriggerPressureLow
      weight: 1
    - id: TriggerExamine
      weight: 1
    - id: TriggerBruteDamage
      weight: 1
    #- id: TriggerInteraction
    #  weight: 1 #this one interferes with activating artifact AND brute dmg!
    - id: TriggerWrenching
      weight: 0.5
    - id: TriggerPrying
      weight: 0.5
    - id: TriggerScrewing
      weight: 0.5
    - id: TriggerPulsing
      weight: 0.5
    - id: TriggerTimer
      weight: 0.25
    - id: TriggerBlood
      weight: 1
    - id: TriggerDeath
      weight: 1
    - id: TriggerMagnet
      weight: 1
    - id: TriggerConsumeMoney
      weight: 1
    - id: TriggerConsumeKnowledge
      weight: 0.25
    - id: TriggerConsumeCarbs
      weight: 1
    - id: TriggerConsumeMeat
      weight: 0.5
    - id: TriggerConsumeProduce
      weight: 0.5
    - id: TriggerInteractStamp
      weight: 1
    - id: TriggerInteractShock
      weight: 1
    - id: TriggerAttackParticleAnomaly
      weight: 1
    - id: TriggerAttackStaminaDamage
      weight: 1
    - id: TriggerAttackLaser
      weight: 0.5
    - id: TriggerAttackParticleEngine
      weight: 0.1

- type: entityTable
  id: XenoArtifactHandheldOnlyTriggerTable
  table: !type:GroupSelector
    conditionsForChildren:
    - !type:ExcludeEntitiesFromContextCondition
    children:
    - !type:NestedSelector
      tableId: XenoArtifactTriggerDefaultTable
      weight: 35
    - !type:NestedSelector
      tableId: XenoArtifactTriggerHandheldOnlyTable
      weight: 2

- type: entityTable
  id: XenoArtifactTriggerHandheldOnlyTable
  table: !type:GroupSelector
    children:
    - id: TriggerThrow
      weight: 1
    - id: TriggerMicrowave
      weight: 1

- type: entity
  id: BaseXenoArtifactTrigger
  name: Unknown
  categories: [XenoArtifactTriggers]
  abstract: true

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerMusic
  components:
  - type: XATCompNearby
    requireComponentWithName: ActiveInstrument
    radius: 2

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerHeat
  components:
  - type: XATTemperature
    targetTemperature: 373
    triggerOnHigherTemp: true
  - type: XATDamageThresholdReached
    typesNeeded:
      Heat: 20
  # This kinda trivializes the difficulty.
  #  - type: XATToolUse
  #    requiredTool: Welding
  #    delay: 5
  #    fuel: 10

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerCold
  components:
  - type: XATTemperature
    targetTemperature: 255
    triggerOnHigherTemp: false
  - type: XATDamageThresholdReached
    typesNeeded:
      Cold: 20

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerNoOxygen
  components:
  - type: XATGas
    targetGas: Oxygen
    moles: 10
    shouldBePresent: false

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerWater
  components:
  - type: XATGas
    targetGas: WaterVapor
  - type: XATReactive
    reagents:
    - Water

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerCO2
  components:
  - type: XATGas
    targetGas: CarbonDioxide
  - type: XATReactive
    reagents:
    - CarbonDioxide

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerPlasma
  components:
  - type: XATGas
    targetGas: Plasma
  - type: XATReactive
    reagents:
    - Plasma

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerTritium
  components:
  - type: XATGas
    targetGas: Tritium
  - type: XATReactive
    reagents:
    - Tritium

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerAmmonia
  components:
  - type: XATGas
    targetGas: Ammonia
  - type: XATReactive
    reagents:
    - Ammonia

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerN2O
  components:
  - type: XATGas
    targetGas: NitrousOxide
  - type: XATReactive
    reagents:
    - NitrousOxide

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerFrezon
  components:
  - type: XATGas
    targetGas: Frezon
  - type: XATReactive
    reagents:
    - Frezon

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerRadiation
  components:
  - type: XATDamageThresholdReached
    typesNeeded:
      Radiation: 20

- type: entity
  id: TriggerMicrowave
  parent: BaseXenoArtifactTrigger
  components:
  - type: XATMicrowave

- type: entity
  id: TriggerPressureHigh
  parent: BaseXenoArtifactTrigger
  components:
  - type: XATPressure
    maxPressureThreshold: 385

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerPressureLow
  components:
  - type: XATPressure
    minPressureThreshold: 50

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerExamine
  components:
  - type: XATExamine

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerBruteDamage
  components:
  - type: XATDamageThresholdReached
    groupsNeeded:
      Brute: 20

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerInteraction
  components:
  - type: XATInteraction

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerWrenching
  components:
  - type: XATToolUse
    requiredTool: Anchoring
  - type: XATExaminableText
    examineText: xenoarch-trigger-examine-wrenching

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerPrying
  components:
  - type: XATToolUse
    requiredTool: Prying
  - type: XATExaminableText
    examineText: xenoarch-trigger-examine-prying

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerScrewing
  components:
  - type: XATToolUse
    requiredTool: Screwing
  - type: XATExaminableText
    examineText: xenoarch-trigger-examine-screwing

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerPulsing
  components:
  - type: XATToolUse
    requiredTool: Pulsing
  - type: XATExaminableText
    examineText: xenoarch-trigger-examine-pulsing

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerTimer
  components:
  - type: XATTimer
    possibleDelayInSeconds:
      min: 80
      max: 120

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerBlood
  components:
  - type: XATReactive
    reagents:
    - Blood
    - CopperBlood
    - InsectBlood
    - Slime
    - AmmoniaBlood
    - ZombieBlood
    - Sap
    - SulfurBlood

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerThrow
  components:
  - type: XATItemLand

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerDeath
  components:
  - type: XATDeath

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerMagnet
  components:
  - type: XATMagnet

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerConsumeMoney
  components:
  - type: XATInteractWith
    interactionCount:
      min: 100
      max: 200
    destroyAfter: true
    interactionTime: 1.5
    successTriggerSound: /Audio/Machines/machine_vend.ogg
    whitelist:
      components:
      - Cash

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerConsumeKnowledge
  components:
  - type: XATInteractWith
    destroyAfter: true
    interactionTime: 1.5
    successTriggerSound: /Audio/Machines/machine_vend.ogg
    whitelist:
      components:
      - TechnologyDisk
      tags:
      - Book

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerConsumeCarbs
  components:
  - type: XATInteractWith
    destroyAfter: true
    interactionTime: 1.5
    successTriggerSound:
      collection: eating
      params:
        volume: 5
    whitelist:
      tags:
      - Bread
      - Cake
      - DonkPocket
      - Donut
      - Pie
      - Pizza

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerConsumeMeat
  components:
  - type: XATInteractWith
    destroyAfter: true
    interactionTime: 1.5
    successTriggerSound:
      collection: eating
      params:
        volume: 5
    whitelist:
      tags:
      - Meat
  - type: XATReactive
    reagents:
    - Protein
    - UncookedAnimalProteins

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerConsumeProduce
  components:
  - type: XATInteractWith
    destroyAfter: true
    interactionTime: 1.5
    successTriggerSound:
      collection: eating
      params:
        volume: 5
    whitelist:
      tags:
      - Fruit
      - Vegetable
      - CottonBoll
      - Ambrosia
      - Mushroom

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerInteractStamp
  components:
  - type: XATInteractWith
    interactionTime: 0.5
    successTriggerSound:
      path: /Audio/Items/Stamp/thick_stamp_sub.ogg
      params:
        volume: -2
        maxDistance: 5
    whitelist:
      components:
      - Stamp

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerInteractShock
  components:
  - type: XATShock
  - type: XATDamageThresholdReached
    typesNeeded:
      Shock: 5

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerAttackParticleEngine
  components:
  - type: XATInteractAttack
    whitelist:
      components:
      - ParticleProjectile

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerAttackParticleAnomaly
  components:
  - type: XATInteractAttack
    whitelist:
      components:
      - AnomalousParticle

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerAttackStaminaDamage
  components:
  - type: XATStaminaDamageThresholdReached
    damageNeeded: 8 # half a practice disabler capacity

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerAttackLaser
  components:
  - type: XATInteractAttack
    interactionCount:
      max: 3
    whitelist:
      components:
      - LaserProjectile
      tags:
      - EmitterBolt
