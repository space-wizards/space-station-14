    - BlackRussian
    - BloodyMary
    - CoconutRum
    - CubaLibre
    - GargleBlaster
    - GinTonic
    - Grog
    - LongIslandIcedTea
    - ManlyDorf
    - Margarita
    - Martini
    - Moonshine
    - PinaColada
    - WhiskeyCola
    - WhiteRussian
    - ArnoldPalmer
    - CafeLatte
    - CreamOfCoconut
    - IceCream
    - IcedCoffee
    - IcedGreenTea
    - IcedTea
    - OrangeLimeSoda
    - Lemonade
    - SoyLatte
    - Pilk

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerReactiveReagentEasy
  name: Specific Reagent # should get overwritten
  components:
