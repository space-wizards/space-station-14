- type: entityTable
  id: XenoArtifactTriggerDefaultTable
  table: !type:GroupSelector
    conditionsForChildren:
      - !type:IsNotRepeatingCondition
    children:
    - id: TriggerMusic
      weight: 1
    - id: TriggerHeat
      weight: 1
    - id: TriggerCold
      weight: 0.5
    - id: TriggerNoOxygen
      weight: 1
    - id: TriggerWater
      weight: 1
    - id: TriggerCO2
      weight: 0.5
    - id: TriggerPlasma
      weight: 0.5
    - id: TriggerN2O
      weight: 0.5
    - id: TriggerTritium
      weight: 0.1
    - id: TriggerAmmonia
      weight: 0.1
    - id: TriggerFrezon
      weight: 0.1
    - id: TriggerRadiation
      weight: 1
    - id: TriggerPressureHigh
      weight: 0.5
    - id: TriggerPressureLow
      weight: 1
    - id: TriggerExamine
      weight: 1
    - id: TriggerBruteDamage
      weight: 1
    #- id: TriggerInteraction
    #  weight: 1 #this one interferes with activating artifact AND brute dmg!
    - id: TriggerWrenching
      weight: 0.5
    - id: TriggerPrying
      weight: 0.5
    - id: TriggerScrewing
      weight: 0.5
    - id: TriggerPulsing
      weight: 0.5
    - id: TriggerTimer
      weight: 0.25
    - id: TriggerBlood
      weight: 1
    - id: TriggerDeath
      weight: 1
    - id: TriggerMagnet
      weight: 1

- type: entityTable
  id: XenoArtifactHandheldOnlyTriggerTable
  table: !type:GroupSelector
    conditionsForChildren:
    - !type:IsNotRepeatingCondition
    children:
    - !type:NestedSelector
      tableId: XenoArtifactTriggerDefaultTable
      weight: 23
    - !type:NestedSelector
      tableId: XenoArtifactTriggerHandheldOnlyTable
      weight: 1

- type: entityTable
  id: XenoArtifactTriggerHandheldOnlyTable
  table: !type:GroupSelector
    children:
    - id: TriggerThrow
      weight: 1

- type: entity
  id: BaseXenoArtifactTrigger
  name: Unknown
  categories: [XenoArtifactTriggers]
  abstract: true

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerMusic
  name:  xenoarch-trigger-tip-music
  components:
  - type: XATCompNearby
    requireComponentWithName: ActiveInstrument
    radius: 2

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerHeat
  name:  xenoarch-trigger-tip-heat
  components:
  - type: XATTemperature
    targetTemperature: 373
    triggerOnHigherTemp: true
  - type: XATDamageThresholdReached
    typesNeeded:
      Heat: 20
  # This kinda trivializes the difficulty.
  #  - type: XATToolUse
  #    requiredTool: Welding
  #    delay: 5
  #    fuel: 10

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerCold
  name:  xenoarch-trigger-tip-cold
  components:
  - type: XATTemperature
    targetTemperature: 255
    triggerOnHigherTemp: false
  - type: XATDamageThresholdReached
    typesNeeded:
      Cold: 20

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerNoOxygen
  name:  xenoarch-trigger-tip-no-oxygen
  components:
  - type: XATGas
    targetGas: Oxygen
    moles: 10
    shouldBePresent: false

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerWater
  name:  xenoarch-trigger-tip-water
  components:
  - type: XATGas
    targetGas: WaterVapor
  - type: XATReactive
    reagents:
    - Water

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerCO2
  name:  xenoarch-trigger-tip-co2
  components:
  - type: XATGas
    targetGas: CarbonDioxide
  - type: XATReactive
    reagents:
    - CarbonDioxide

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerPlasma
  name:  xenoarch-trigger-tip-plasma
  components:
  - type: XATGas
    targetGas: Plasma
  - type: XATReactive
    reagents:
    - Plasma

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerTritium
  name:  xenoarch-trigger-tip-tritium
  components:
  - type: XATGas
    targetGas: Tritium
  - type: XATReactive
    reagents:
    - Tritium

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerAmmonia
  name:  xenoarch-trigger-tip-ammonia
  components:
  - type: XATGas
    targetGas: Ammonia
  - type: XATReactive
    reagents:
    - Ammonia

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerN2O
  name:  xenoarch-trigger-tip-n2o
  components:
  - type: XATGas
    targetGas: NitrousOxide
  - type: XATReactive
    reagents:
    - NitrousOxide

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerFrezon
  name:  xenoarch-trigger-tip-frezon
  components:
  - type: XATGas
    targetGas: Frezon
  - type: XATReactive
    reagents:
    - Frezon

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerRadiation
  name:  xenoarch-trigger-tip-radiation
  components:
  - type: XATDamageThresholdReached
    typesNeeded:
      Radiation: 20
  # TODO: legendary microwave trigger

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerPressureHigh
  name:  xenoarch-trigger-tip-pressure-high
  components:
  - type: XATPressure
    maxPressureThreshold: 385

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerPressureLow
  name:  xenoarch-trigger-tip-pressure-low
  components:
  - type: XATPressure
    minPressureThreshold: 50

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerExamine
  name:  xenoarch-trigger-tip-examine
  components:
  - type: XATExamine

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerBruteDamage
  name:  xenoarch-trigger-tip-brute-damage
  components:
  - type: XATDamageThresholdReached
    groupsNeeded:
      Brute: 20

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerInteraction
  name:  xenoarch-trigger-tip-interaction
  components:
  - type: XATInteraction

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerWrenching
  name:  xenoarch-trigger-tip-wrenching
  components:
  - type: XATToolUse
    requiredTool: Anchoring
  - type: XATExaminableText
    examineText: xenoarch-trigger-examine-wrenching

- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerPrying
  name:  xenoarch-trigger-tip-prying
  components:
  - type: XATToolUse
