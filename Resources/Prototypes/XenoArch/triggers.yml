- type: entity
  parent: BaseXenoArtifactTrigger
  id: TriggerReactiveReagentHard
  name: Specific Reagent # should get overwritten
  components:
  - type: XATReactiveSpecific
    reagents: #things medical probably hasn't made already, not neccisarily hard for them to make
    - Cryptobiolin #good reagents
    - Doxarubixadone
    - Ethylredoxrazine
    - Haloperidol
    - Lipozine
    - Mannitol
