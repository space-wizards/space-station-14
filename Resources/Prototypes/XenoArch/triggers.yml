- type: xenoArchTrigger
  id: TriggerConsumeMoney
  tip: xenoarch-trigger-tip-money
  components:
  - type: XATInteractWith
    interactionCount:
      min: 100
      max: 200
    destroyAfter: true
    interactionTime: 1.5
    successTriggerSound: /Audio/Machines/machine_vend.ogg
    whitelist:
      components:
      - Cash

- type: xenoArchTrigger
  id: TriggerConsumeKnowledge
  tip: xenoarch-trigger-tip-knowledge
  components:
  - type: XATInteractWith
    destroyAfter: true
    interactionTime: 1.5
    successTriggerSound: /Audio/Machines/machine_vend.ogg
    whitelist:
      components:
      - TechnologyDisk
      tags:
      - Book

- type: xenoArchTrigger
  id: TriggerConsumeCarbs
  tip: xenoarch-trigger-tip-carbs
  components:
  - type: XATInteractWith
    destroyAfter: true
    interactionTime: 1.5
    successTriggerSound:
      collection: eating
      params:
        volume: 5
    whitelist:
      tags:
      - Bread
      - Cake
      - DonkPocket
      - Donut
      - Pie
      - Pizza

- type: xenoArchTrigger
  id: TriggerConsumeMeat
  tip: xenoarch-trigger-tip-meat
