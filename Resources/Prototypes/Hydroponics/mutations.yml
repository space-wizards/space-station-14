- type: randomPlantMutation
  id: Sentient
  name: Sentient
  description: mutation-plant-sentient
  effect: !type:MakeSentient # existing effect.

- type: randomPlantMutation
  id: Slippery
  name: Slippery
  description: mutation-plant-slippery
  effect: !type:PlantChangeTraits
    trait: PlantTraitSlippery
    type: Add

