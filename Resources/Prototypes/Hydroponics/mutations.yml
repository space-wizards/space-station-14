- type: randomPlantMutation
  id: ChangeWaterConsumption
  name: ChangeWaterConsumption
  effect: !type:PlantChangeStat
    targetComponent: PlantGrowth
    targetDataField: WaterConsumption
    applyRange:
      min: 0.3
      max: 0.9
    up: !type:PlantAdjustWaterConsumption
      amount: 0.1
    down: !type:PlantAdjustWaterConsumption
      amount: -0.1

