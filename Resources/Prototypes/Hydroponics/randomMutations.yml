- type: randomPlantMutationList
  id: FarmingPlantMutations
  ignoreMutationMod: true
  mutations:
    - baseOdds: 0.15
      mutation:
        prototype: MutateFarmingChemicals
    - baseOdds: 0.01
      mutation:
        prototype: ChangeHarvest
    - baseOdds: 0.01
      mutation:
        prototype: ChangeSeedless
    - baseOdds: 0.15 # higher chance relatively, but lower adjustment amount
      mutation:
        prototype: ChangePotency
        effect: !type:PlantChangeStat
          targetComponent: Plant
          targetDataField: Potency
          applyRange:
            min: 15
            max: 65
          up: !type:PlantAdjustPotency
            amount: 5
          down: !type:PlantAdjustPotency
            amount: -5
    - baseOdds: 0.02
      mutation:
        prototype: ChangeYield
        effect: !type:PlantChangeStat
          targetComponent: Plant
          targetDataField: Yield
          applyRange:
            min: 3
            max: 7
          up: !type:PlantAdjustYield
            amount: 1
          down: !type:PlantAdjustYield
            amount: -1
    - baseOdds: 0.01
      mutation:
        prototype: ChangeWaterConsumption
    - baseOdds: 0.01
      mutation:
        prototype: ChangeNutrientConsumption
    - baseOdds: 0.03
      mutation:
        prototype: ChangeLifespan
    - baseOdds: 0.03
      mutation:
        prototype: ChangeMaturation
    - baseOdds: 0.03
      mutation:
        prototype: ChangeProduction
        effect: !type:PlantChangeStat
          targetComponent: Plant
          targetDataField: Production
          applyRange:
            min: 1
            max: 10
          up: !type:PlantAdjustProduction
            amount: 1
          down: !type:PlantAdjustProduction
            amount: -1
    - baseOdds: 0.05
      mutation:
        prototype: ChangeEndurance
        effect: !type:PlantChangeStat
          targetComponent: Plant
          targetDataField: Endurance
          applyRange:
            min: 80
            max: 120
          up: !type:PlantAdjustEndurance
            amount: 5
          down: !type:PlantAdjustEndurance
            amount: -5
    - baseOdds: 0.05
      mutation:
        prototype: Lignification
    - baseOdds: 0.03
      mutation:
        prototype: Kudzufication
    - baseOdds: 0.1
      mutation:
        prototype: ChangeScreaming
    - baseOdds: 0.01
      mutation:
        prototype: Slippery

- type: randomPlantMutationList
  id: EvilPlantMutations
  ignoreMutationMod: true
  mutations:
  - baseOdds: 1
    mutation:
      prototype: MutateEvilChemicals
