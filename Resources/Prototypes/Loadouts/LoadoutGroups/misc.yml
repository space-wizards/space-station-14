# These loadout groups generally aren't manually selectable.
# e.g, stuff that members of a specific job/species automatically spawn with.

# Breath tools

- type: loadoutGroup
  id: GroupSpeciesBreathTool
  name: loadout-group-breath-tool
  minLimit: 1
  maxLimit: 1
  hidden: true
  loadouts:
  - LoadoutSpeciesBreathTool

- type: loadoutGroup
  id: GroupSpeciesBreathToolMedical
  name: loadout-group-breath-tool
  minLimit: 1
  maxLimit: 1
  hidden: true
  loadouts:
  - LoadoutSpeciesBreathToolMedical

- type: loadoutGroup
  id: GroupSpeciesBreathToolSecurity
  name: loadout-group-breath-tool
  minLimit: 1
  maxLimit: 1
  hidden: true
  loadouts:
  - LoadoutSpeciesBreathToolSecurity

# Tanks

- type: loadoutGroup
  id: GroupTankHarness
  name: loadout-group-tank-harness
  minLimit: 1
  hidden: true
  loadouts:
  - LoadoutTankHarness

- type: loadoutGroup
  id: GroupEVATank
  name: loadout-group-EVA-tank
  hidden: true
  loadouts: # nitrogen or oxygen tank, depending on what your species needs
  - LoadoutSpeciesEVANitrogen
  - LoadoutSpeciesEVAOxygen

- type: loadoutGroup
  id: GroupEVATankVox
  name: loadout-group-vox-tank
  hidden: true
  loadouts: # vox get a nitrogen tank, other species get nothing
  - LoadoutSpeciesVoxNitrogen

- type: loadoutGroup
  id: GroupPocketTankDouble
  name: loadout-group-pocket-tank-double
  hidden: true
  loadouts: # double emergency nitrogen/oxygen tank (depending on species) in the pocket, intended for nukies and similar
  - LoadoutSpeciesPocketDoubleNitrogen
  - LoadoutSpeciesPocketDoubleOxygen

# Survival boxes

- type: loadoutGroup
  parent: SurvivalBase
  id: Survival
  loadouts:
  - EmergencyNitrogen
  - EmergencyOxygen
  - LoadoutSpeciesVoxNitrogen

- type: loadoutGroup
  parent: SurvivalBase
  id: SurvivalClown
  loadouts:
  - EmergencyNitrogenClown
  - EmergencyOxygenClown
  - LoadoutSpeciesVoxNitrogen

- type: loadoutGroup
  parent: SurvivalBase
  id: SurvivalExtended
  loadouts:
  - EmergencyNitrogenExtended
  - EmergencyOxygenExtended
  - LoadoutSpeciesVoxNitrogen

- type: loadoutGroup
  parent: SurvivalBase
  id: SurvivalMedical
  loadouts:
  - EmergencyNitrogenMedical
  - EmergencyOxygenMedical
  - LoadoutSpeciesVoxNitrogen

- type: loadoutGroup
  parent: SurvivalBase
  id: SurvivalSecurity
  loadouts:
  - EmergencyNitrogenSecurity
  - EmergencyOxygenSecurity
  - LoadoutSpeciesVoxNitrogen

- type: loadoutGroup
  parent: SurvivalBase
  id: SurvivalExtendedAntag # Larger survival box containing food/water, used by antags that spawn off-station (e.g ninjas, wizards)
  loadouts:
  - EmergencyNitrogenExtendedAntag
  - EmergencyOxygenExtendedAntag
  - LoadoutSpeciesVoxNitrogen

- type: loadoutGroup
  parent: SurvivalBase
  id: SurvivalSyndicate # Larger survival box containing food, used by syndicate operatives that spawn off-station (e.g nukies)
  loadouts:
  - EmergencyNitrogenSyndicate
  - EmergencyOxygenSyndicate
  - LoadoutSpeciesVoxNitrogen

- type: loadoutGroup
  parent: SurvivalBase
  id: SurvivalMilitaryDouble # Survival box mostly used by ERT/deathsquad
  loadouts:
  - EmergencyNitrogenMilitaryDouble
  - EmergencyOxygenMilitaryDouble
