# These loadouts are used for non-crew spawns, like off-station antags and event mobs.
# They will be used without player configuration, thus they will only ever apply what is forced by MinLimit.

- type: roleLoadout
  id: RoleSurvivalVoxSupport # Gives vox a harness and breathing mask. Nitrogen tank not included.
  groups:
  - GroupSpeciesBreathTool
  - GroupTankHarness

- type: roleLoadout
  id: RoleSurvivalVoxTank # Gives vox a nitrogen breathing tank. Other species get nothing.
  groups:
  - GroupEVATankVox

- type: roleLoadout
  id: RoleSurvivalStandard
  groups:
  - Survival
  - GroupSpeciesBreathTool
  - GroupTankHarness

- type: roleLoadout
  id: RoleSurvivalClown
  groups:
  - SurvivalClown
  - GroupTankHarness

- type: roleLoadout
  id: RoleSurvivalExtended
  groups:
  - SurvivalExtended
  - GroupSpeciesBreathTool
  - GroupTankHarness

- type: roleLoadout
  id: RoleSurvivalExtendedAntag # Used by antagonists that spawn off-station (e.g wizards).
  groups:
  - SurvivalExtendedAntag
  - GroupSpeciesBreathTool
  - GroupTankHarness

- type: roleLoadout
  id: RoleSurvivalMedical
  groups:
  - MedicalSurvival
  - GroupSpeciesBreathToolMedical
  - GroupTankHarness

- type: roleLoadout
  id: RoleSurvivalSecurity
  groups:
  - SurvivalSecurity
  - GroupSpeciesBreathToolSecurity
  - GroupTankHarness

- type: roleLoadout
  id: RoleSurvivalSyndicate
  groups:
  - SurvivalSyndicate
  - GroupSpeciesBreathTool
  - GroupTankHarness

- type: roleLoadout
  id: RoleSurvivalMilitaryDouble
  groups:
  - SurvivalMilitaryDouble

- type: roleLoadout
  id: RoleSurvivalNukie
  groups:
  - SurvivalSyndicate
  - GroupSpeciesBreathTool
  - GroupPocketTankDouble

- type: roleLoadout
  id: RoleSurvivalEVA
  groups:
  - GroupEVATank
  - SurvivalExtended

- type: roleLoadout
  id: RoleSurvivalEVAAntag # Used by antagonists that spawn off-station AND in space (e.g ninjas).
