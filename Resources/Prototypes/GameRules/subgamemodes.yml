- type: entity
  parent: BaseGameRule
  id: Thief
  components:
  - type: ThiefRule
  - type: AntagObjectives
    objectives:
    - EscapeThiefShuttleObjective
  - type: AntagRandomObjectives
    sets:
    - groups: ThiefBigObjectiveGroups
      prob: 0.7
      maxPicks: 1
    - groups: ThiefObjectiveGroups
      maxPicks: 10
    maxDifficulty: 2.5
  - type: AntagSelection
    agentName: thief-round-end-agent-name
    selectionTime: PrePlayerSpawn
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Thief
      playerRatio: 20
      range:
        min: 1
        max: 3
  - type: DynamicRuleCost
    cost: 75
  - type: GameRule
    cancelPresetOnTooFewPlayers: false

- type: entity
  id: Changeling
  parent: [BaseGameRule, BaseRoundstartAntagRule]
  components:
  - type: ChangelingRule
  - type: GameRule
    minPlayers: 20
    delay:
      min: 240
      max: 420
    cancelPresetOnTooFewPlayers: false
  - type: AntagSelection
    agentName: changeling-round-end-agent-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Changeling
      playerRatio: 15
      range:
        min: 1
        max: 3
  - type: AntagRandomObjectives
    sets:
    - groups: ChangelingObjectiveGroupDevourDummy
      maxPicks: 1
    - groups: ChangelingObjectiveGroupEscapeDummy
      maxPicks: 1
    - groups: ChangelingObjectiveGroupKillDummy
      maxPicks: 1
    maxDifficulty: 8
  - type: DynamicRuleCost
    cost: 75

