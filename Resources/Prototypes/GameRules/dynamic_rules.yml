          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:RoundDurationCondition
            min: 1800 # 30 minutes
        - id: SpaceChangelingSpawn
          weight: 25
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 15
          - !type:RoundDurationCondition
            min: 1800 # 30 minutes
        - !type:NestedSelector
          tableId: DerelictBorgEventTable
          weight: 25
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 20
          - !type:RoundDurationCondition
            min: 1800 # 30 minutes
        - id: ZombieOutbreak
          weight: 2.5
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 20
          - !type:RoundDurationCondition
            min: 2700 # 45 minutes
        - id: LoneOpsSpawn
          weight: 15
