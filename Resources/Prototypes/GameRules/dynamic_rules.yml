- type: entity
  parent: BaseGameRule
  id: DynamicRule
  components:
  - type: GameRule
    minPlayers: 5 # <5 is greenshift hours, buddy.
  - type: DynamicRule
    minBudgetPerSecond: 0.05
    maxBudgetPerSecond: 0.1
    startingBudgetMin: 150
    startingBudgetMax: 350
    minRuleInterval: 180 # 3 minutes
    maxRuleInterval: 540 # 9 minutes
    table: !type:AllSelector
      children:
      # Roundstart Major Rules
      - !type:GroupSelector
        conditions:
        - !type:RoundDurationCondition
          max: 1
        children:
        - id: Traitor
          weight: 60
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
        - id: Nukeops
          weight: 25
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 20
        - id: Revolutionary
          weight: 5
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
        - id: Zombie
          weight: 5
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 20
        - id: Wizard
          weight: 5
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 10
        - id: Xenoborgs
          weight: 5
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 35
      # Roundstart Minor Rules
      - !type:GroupSelector
        conditions:
        - !type:RoundDurationCondition
          max: 1
        children:
        - id: Thief
          prob: 0.5
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
        - id: Changeling
          prob: 0.25
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition

      # Midround rules
      - !type:GroupSelector
        conditions:
        - !type:RoundDurationCondition
          min: 180 # minimum 3 minutes
        children:
        - !type:GroupSelector
          weight: 30
          children: # copy paste of BasicCalmEventsTable because it's an AllSelector
          - id: AnomalySpawn
          - id: BluespaceArtifact
          - id: BluespaceLocker
          - id: BreakerFlip
          - id: BureaucraticError
          - id: ClericalError
          - id: CockroachMigration
          - id: GasLeak
          - id: GreytideVirus
          - id: IonStorm
          - id: KudzuGrowth
          - id: MassHallucinations
          - id: MouseMigration
          - id: PowerGridCheck
          - id: RandomSentience
          - id: SlimesSpawnHorde
          - id: SolarFlare
          - id: SnakeSpawnHorde
          - id: SpiderClownSpawnHorde
          - id: SpiderSpawnHorde
          - id: VentClog
        - id: SleeperAgents
          weight: 15
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:RoundDurationCondition
            min: 1200 # 20 minutes
        - id: ClosetSkeleton
          weight: 25
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:RoundDurationCondition
            min: 1200 # 20 minutes
        - id: KingRatMigration
          weight: 25
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 15
          - !type:RoundDurationCondition
            min: 1200 # 20 minutes
        - id: ParadoxCloneSpawn
          weight: 25
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:RoundDurationCondition
            min: 1200 # 20 minutes
        - id: DragonSpawn
          weight: 15
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:RoundDurationCondition
            min: 1800 # 30 minutes
        - id: NinjaSpawn
