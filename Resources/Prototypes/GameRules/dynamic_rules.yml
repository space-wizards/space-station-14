- type: entity
  parent: BaseGameRule
  id: DynamicRule
  components:
  - type: GameRule
    minPlayers: 5 # <5 is greenshift hours, buddy.
  - type: DynamicRule
    minBudgetPerSecond: 0.05
    maxBudgetPerSecond: 0.1
    startingBudgetMin: 175
    startingBudgetMax: 325
    minRuleInterval: 180 # 3 minutes
    maxRuleInterval: 540 # 9 minutes
    roundStartTable: !type:AllSelector
      children:
      # Roundstart Major Rules
      - !type:GroupSelector
        children:
        - id: Traitor
          weight: 35
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 5
        - id: Nukeops
          weight: 25
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 20
        - id: Revolutionary
          weight: 5
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 15
        - id: Zombie
          weight: 5
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 20
      # Roundstart Minor Rules
      - !type:GroupSelector
        children:
        - id: Thief
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
        - id: Changeling
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 20
        - id: Xenoborgs
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 35

    table: !type:AllSelector
      children:
      # Midround rules
      - !type:GroupSelector
        conditions:
        - !type:RoundDurationCondition
          min: 180 # minimum 3 minutes
        children:
