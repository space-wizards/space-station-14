# Admin-spawnable adventurer ghost roles, following the ERT pattern:
# spawn the RandomHumanoidSpawnerAdventurer* marker from the entity spawn menu
# and it offers itself to ghosts as that party member, fully geared.
# Note: ghost-role adventurers get no objectives (those come from the Adventurers
# game rule); they're reinforcements for the party or an admeme.
#
# Parented to EventHumanoid (NOT EventHumanoidMindShielded) since adventurers
# are antagonists and must not receive AntagImmune or a mindshield.

# ------------------------------- Warrior --------------------------------

- type: entity
  id: RandomHumanoidSpawnerAdventurerWarrior
  name: Adventurer - Warrior
  suffix: AdventurerRole
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/claymore.rsi
    state: icon
  - type: RandomHumanoidSpawner
    settings: AdventurerWarrior

- type: randomHumanoidSettings
  id: AdventurerWarrior
  parent: EventHumanoid
  components:
  - type: GhostRole
    name: roles-antag-adventurer-warrior-name
    description: ghost-role-information-adventurer-warrior-description
    rules: ghost-role-information-rules-team-antagonist
    raffle:
      settings: short
    mindRoles:
    - MindRoleAdventurerWarrior
  - type: Adventurer
    armorClass: 16
    critThreshold: 250
    deadThreshold: 350
  - type: NoSlip
  - type: NpcFactionMember
    factions:
    - Adventurer
  - type: Loadout
    prototypes: [ AdventurerWarriorGear ]

