# Admin-spawnable adventurer ghost roles, following the ERT pattern: spawn the
# RandomHumanoidSpawnerAdventurer* marker from the entity spawn menu and it
# offers itself to ghosts as that class, fully geared. The AdventurerPartySpawn
# entity (party_spawn.yml) spawns bodies from these same humanoid settings.
#
# Parented to EventHumanoid (NOT EventHumanoidMindShielded) since adventurers
# are antagonists and must not receive AntagImmune or a mindshield.

# ------------------------------- Warrior --------------------------------

- type: entity
  id: RandomHumanoidSpawnerAdventurerWarrior
  name: Adventurer - Warrior
  suffix: AdventurerRole
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/claymore.rsi
    state: icon
  - type: RandomHumanoidSpawner
    settings: AdventurerWarrior

- type: randomHumanoidSettings
  id: AdventurerWarrior
  parent: EventHumanoid
  randomizeName: false
  components:
  - type: GhostRole
    name: roles-antag-adventurer-warrior-name
    description: ghost-role-information-adventurer-warrior-description
    rules: ghost-role-information-rules-team-antagonist
    raffle:
      settings: short
    mindRoles:
    - MindRoleAdventurerWarrior
  - type: Adventurer
    armorClass: 16
    critThreshold: 250
    deadThreshold: 350
  - type: NoSlip
  - type: NpcFactionMember
    factions:
    - Adventurer
  - type: RandomMetadata
    nameSegments:
    - NamesAdventurerFirst
    - NamesAdventurerEpithet
    nameFormat: name-format-adventurer
  - type: AutoObjectives
    objectives:
    - AdventurerClearDungeonObjective
    - AdventurerLootObjective
    - AdventurerSurviveObjective
  - type: Loadout
    prototypes: [ AdventurerWarriorGear ]
    roleLoadout: [ RoleSurvivalAdventurer ]

