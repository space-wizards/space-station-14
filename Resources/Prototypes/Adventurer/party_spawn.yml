# The Adventurer Party Spawn: an admin-menu entity that places four linked ghost
# role markers, one per class (see GhostRolePartySystem for the group mechanics).
# Claimed players wait in a dialog until all four slots are filled, then the
# whole party spawns simultaneously; cancelling re-offers that role.
# Members reuse the standalone AdventurerWarrior/... humanoid settings, so party
# members and one-off admin-spawned adventurers stay identical.

- type: entity
  parent: MarkerBase
  id: AdventurerPartySpawn
  name: Adventurer Party Spawn
  description: Spawns a linked set of four adventurer ghost roles that enter the world together once every role is claimed.
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: Objects/Fun/dice.rsi
      state: d20_20
  - type: GhostRolePartyController
    members:
    - SpawnPointGhostAdventurerWarrior
    - SpawnPointGhostAdventurerRanger
    - SpawnPointGhostAdventurerCleric
    - SpawnPointGhostAdventurerMage

# ---------------------------- Party slot markers ----------------------------
# Placed by the party controller above; they don't work when placed by hand
# (nothing links them to a controller), so each one carries HideSpawnMenu to
# keep it out of the entity spawn panel. HideSpawnMenu is not inheritable,
# which is why it sits on every concrete marker instead of the base.

- type: entity
  abstract: true
  parent: MarkerBase
  id: BaseSpawnPointGhostAdventurer
  categories: [ Spawner ]
  components:
  - type: GhostRole
    rules: ghost-role-information-adventurer-rules
    raffle:
      settings: default

- type: entity
  parent: BaseSpawnPointGhostAdventurer
  id: SpawnPointGhostAdventurerWarrior
  name: Adventurer - Warrior spawn point
  categories: [ HideSpawnMenu ]
  components:
  - type: GhostRole
    name: roles-antag-adventurer-warrior-name
    description: ghost-role-information-adventurer-warrior-description
  - type: GhostRolePartySpawner
    settings: AdventurerWarrior
    mindRoles:
    - MindRoleAdventurerWarrior
  - type: Sprite
    layers:
    - state: green
    - sprite: Objects/Weapons/Melee/claymore.rsi
      state: icon

- type: entity
  parent: BaseSpawnPointGhostAdventurer
  id: SpawnPointGhostAdventurerRanger
  name: Adventurer - Ranger spawn point
  categories: [ HideSpawnMenu ]
  components:
  - type: GhostRole
    name: roles-antag-adventurer-ranger-name
    description: ghost-role-information-adventurer-ranger-description
  - type: GhostRolePartySpawner
    settings: AdventurerRanger
    mindRoles:
    - MindRoleAdventurerRanger
  - type: Sprite
    layers:
    - state: green
    - sprite: Objects/Weapons/Guns/Bow/bow.rsi
      state: unwielded

- type: entity
  parent: BaseSpawnPointGhostAdventurer
  id: SpawnPointGhostAdventurerCleric
  name: Adventurer - Cleric spawn point
  categories: [ HideSpawnMenu ]
  components:
  - type: GhostRole
    name: roles-antag-adventurer-cleric-name
    description: ghost-role-information-adventurer-cleric-description
  - type: GhostRolePartySpawner
    settings: AdventurerCleric
    mindRoles:
    - MindRoleAdventurerCleric
  - type: Sprite
    layers:
    - state: green
    - sprite: Objects/Weapons/Guns/Basic/staves.rsi
      state: healing

- type: entity
  parent: BaseSpawnPointGhostAdventurer
  id: SpawnPointGhostAdventurerMage
  name: Adventurer - Mage spawn point
  categories: [ HideSpawnMenu ]
  components:
  - type: GhostRole
    name: roles-antag-adventurer-mage-name
    description: ghost-role-information-adventurer-mage-description
  - type: GhostRolePartySpawner
    settings: AdventurerMage
    mindRoles:
    - MindRoleAdventurerMage
  - type: Sprite
    layers:
    - state: green
    - sprite: Clothing/Head/Hats/wizardhat.rsi
      state: icon
