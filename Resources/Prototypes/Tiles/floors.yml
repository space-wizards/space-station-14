- type: tile
  abstract: true
  id: BaseStationTile
  isSubfloor: false
  deconstructTools: [ Prying ]
  footstepSounds:
    collection: FootstepFloor
  heatCapacity: 10000
  weather: false
  baseTurf: Plating
  baseWhitelist:
  - PlatingBrass
  - FloorAsteroidIronsand
  - FloorAsteroidSand
  - FloorAsteroidSandBorderless
  - FloorAsteroidIronsandBorderless
  - PlatingAsteroid
  - PlatingSnow
  - FloorPlanetDirt
  - FloorDesert
  - FloorPlanetGrass
  - FloorSnow
  - FloorDirt
  - PlatingRCD
  - FloorHullReinforced

