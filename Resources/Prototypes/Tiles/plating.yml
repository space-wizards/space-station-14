- type: tile
  id: BasePlating
  abstract: true
  friction: 1.5
  heatCapacity: 10000
  isSubfloor: true
  footstepSounds:
    collection: FootstepPlating
  baseTurf: Lattice

- type: tile
  id: Plating
  parent: BasePlating
  name: tiles-plating
  sprite: /Textures/Tiles/plating.png

- type: tile
  id: PlatingRCD
  parent: Plating
  name: tiles-rcd-plating
  baseWhitelist:
    - Space
    - FloorPlanetDirt
    - FloorDesert
    - FloorPlanetGrass
    - FloorSnow
    - FloorDirt
    - FloorAsteroidIronsand
    - FloorAsteroidSand
    - FloorAsteroidSandBorderless
    - FloorAsteroidIronsandBorderless

- type: tile
  id: FloorHullReinforced
  parent: BasePlating
  name: tiles-hull-reinforced
  sprite: /Textures/Tiles/hull_reinforced.png
  footstepSounds:
    collection: FootstepHull
  itemDrop: FloorTileItemSteel
  heatCapacity: 100000 #/tg/ has this set as "INFINITY." I don't know if that exists here so I've just added an extra 0
  indestructible: true

- type: tile
  id: PlatingAsteroid
  parent: BasePlating
  name: tiles-asteroid-plating
  sprite: /Textures/Tiles/Asteroid/asteroid-plating.png

- type: tile
  id: PlatingSnow
  name: tiles-snow-plating
  parent: BasePlating
  sprite: /Textures/Tiles/Snow/snow-plating.png #Not in the snow planet RSI because it doesn't have any metadata. Should probably be moved to its own folder later.
  friction: 0.75 #a little less then actual snow

- type: tile
  id: Lattice
  name: tiles-lattice
  sprite: /Textures/Tiles/lattice.png
  baseTurf: Space
  isSubfloor: true
  deconstructTools: [ Cutting ]
  weather: true
  footstepSounds:
    collection: FootstepCatwalk
  friction: 1.5
  isSpace: true
  itemDrop: PartRodMetal1
  heatCapacity: 10000
  mass: 200
  variants: 3
