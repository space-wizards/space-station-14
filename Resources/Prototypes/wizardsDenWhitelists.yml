# This is the whitelist used for Wizard's Den Salamander

- type: playerConnectionWhitelist
  id: salamanderMrpWhitelist
  conditions:
  # Deny blacklisted (MRP ban)
  - !type:ConditionManualBlacklistMembership
    action: Deny
  # Deny for high severity notes in the last 30 days
  - !type:ConditionNotesPlaytimeRange
    includeExpired: false
    minimumSeverity: 3 # High
    minimumNotes: 1
    range: 30 # 30 days
    action: Deny
    includeSecret: false
  # Deny for >=3 medium severity notes in the last 90 days
  - !type:ConditionNotesPlaytimeRange
    includeExpired: false
    minimumSeverity: 2 # Medium
    minimumNotes: 3
    range: 90 # 90 Days
    action: Deny
    includeSecret: false
  # Deny for >=3 low severity notes in the last 14 days
  - !type:ConditionNotesPlaytimeRange
    includeExpired: false
    minimumSeverity: 1 # Low
    minimumNotes: 3
    range: 30 # 30 Days
    action: Deny
    includeSecret: false
  # Allow whitelisted players
  - !type:ConditionManualWhitelistMembership
    action: Allow
  # Allow when <= 15 players are online
  - !type:ConditionPlayerCount
    minimumPlayers: 0
    maximumPlayers: 15
    action: Allow
  - !type:ConditionPlaytime
    minimumPlaytime: 1200 # 20 hours to be whitelisted
    action: Allow
  - !type:ConditionAlwaysMatch
    action: Deny
