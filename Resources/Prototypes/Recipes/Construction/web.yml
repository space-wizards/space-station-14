# region Base
- type: construction
  abstract: true
  id: BaseWeb
  graph: WebStructures
  category: construction-category-furniture
  objectType: Structure
  placementMode: SnapgridCenter
  canRotate: false
  entityWhitelist:
    tags:
    - SpiderCraft

# region Web
- type: construction
  parent: BaseWeb
  id: WallWeb
  targetNode: wall
  category: construction-category-structures
  conditions: &TileNotBlocked
  - !type:TileNotBlocked

- type: construction
  parent: BaseWeb
  id: TableWeb
  targetNode: table
  conditions: *TileNotBlocked

- type: construction
  parent: BaseWeb
  id: WebBed
  targetNode: bed
  conditions: *TileNotBlocked

- type: construction
  parent: BaseWeb
  id: ChairWeb
  targetNode: chair
  canRotate: true
  conditions: *TileNotBlocked

- type: construction
  parent: BaseWeb
  id: CrateWeb
  targetNode: crate
  category: construction-category-storage

- type: construction
  parent: BaseWeb
  id: WebDoor
  targetNode: door
  category: construction-category-structures
  conditions: *TileNotBlocked
