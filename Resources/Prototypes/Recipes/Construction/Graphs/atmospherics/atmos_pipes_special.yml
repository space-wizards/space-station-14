- type: constructionGraph
  id: GasPipeSpecial
  start: start
  graph:
  - node: start
    edges:
    - to: manifold
      steps:
      - material: Steel
        amount: 2
        doAfter: 1

  - node: broken
    entity: GasPipeBroken
    edges:
    - to: start
      conditions:
      - !type:EntityAnchored
        anchored: false
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 1
      - !type:DeleteEntity
      steps:
      - tool: Welding
        doAfter: 1

  - node: manifold
    entity: GasPipeManifold
    edges:
    - to: start
      conditions:
      - !type:EntityAnchored
        anchored: false
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:DeleteEntity
      steps:
      - tool: Welding
        doAfter: 1