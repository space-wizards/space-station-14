        amount: 2
        doAfter: 1

  - node: pressurepump
    entity: !type:CreateVariants
      values: [ GasPressurePump, GasPressurePumpAlt1, GasPressurePumpAlt2 ]
    edges:
    - to: start
      conditions:
      - !type:EntityAnchored
        anchored: false
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:DeleteEntity
      steps:
      - tool: Welding
        doAfter: 1

