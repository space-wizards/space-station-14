- type: constructionGraph
  id: !type:CreateVariants
    values: [ GasBinary, GasBinaryAlt1, GasBinaryAlt2 ]
  start: start
  graph:
  - node: start
    edges:
    - to: pressurepump
      steps:
      - material: Steel
        amount: 2
        doAfter: 1

    - to: volumepump
      steps:
      - material: Steel
        amount: 2
        doAfter: 1

    - to: passivegate
      steps:
      - material: Steel
        amount: 2
        doAfter: 1

    - to: valve
      steps:
      - material: Steel
        amount: 2
        doAfter: 1

    - to: signalvalve
      steps:
      - material: Steel
        amount: 2
        doAfter: 1

    - to: pressureregulator
      steps:
      - material: Steel
        amount: 2
        doAfter: 1

    - to: port
      steps:
