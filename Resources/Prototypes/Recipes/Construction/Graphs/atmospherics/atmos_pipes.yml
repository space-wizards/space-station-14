    edges:
    - to: half
      steps:
      - material: Steel
        amount: 1
        doAfter: 1

    - to: straight
      steps:
      - material: Steel
        amount: 1
        doAfter: 1

    - to: bend
      steps:
      - material: Steel
        amount: 1
        doAfter: 1

    - to: tjunction
      steps:
