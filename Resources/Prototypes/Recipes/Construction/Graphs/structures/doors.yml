- type: constructionGraph
  id: DoorGraph
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity
      edges:
        - to: woodDoor
          completed:
            - !type:SnapToGrid
          steps:
            - material: WoodPlank
              amount: 10
              doAfter: 8
        - to: plasmaDoor
          completed:
            - !type:SnapToGrid
          steps:
            - material: Plasma
              amount: 10
              doAfter: 8
        - to: goldDoor
          completed:
            - !type:SnapToGrid
          steps:
            - material: Gold
              amount: 10
              doAfter: 8
        - to: silverDoor
          completed:
            - !type:SnapToGrid
          steps:
            - material: Silver
              amount: 10
              doAfter: 8
        - to: paperDoor
          completed:
            - !type:SnapToGrid
          steps:
            - material: Paper
              amount: 10
              doAfter: 8
        - to: cardDoor
          completed:
            - !type:SnapToGrid
          steps:
            - material: Cardboard
              amount: 10
              doAfter: 8
    - node: woodDoor
      entity: WoodDoor
      edges:
        - to: start
          completed:
            - !type:SpawnEntity
              entity: MaterialWoodPlank1
              number: 10
          steps:
            - tool: Anchoring
              doAfter: 8
    - node: plasmaDoor
      entity: PlasmaDoor
      edges:
        - to: start
          completed:
            - !type:SpawnEntity
              entity: SheetPlasma
              number: 10
          steps:
            - tool: Anchoring
              doAfter: 8
    - node: goldDoor
      entity: GoldDoor
      edges:
        - to: start
          completed:
            - !type:SpawnEntity
              entity: IngotGold1
              number: 10
          steps:
            - tool: Anchoring
              doAfter: 8
    - node: silverDoor
      entity: SilverDoor
      edges:
        - to: start
          completed:
            - !type:SpawnEntity
              entity: IngotSilver1
              number: 10
          steps:
            - tool: Anchoring
              doAfter: 8
    - node: paperDoor
      entity: PaperDoor
      edges:
        - to: start
          completed:
            - !type:SpawnEntity
              entity: SheetPaper1
              number: 10
          steps:
            - tool: Anchoring
              doAfter: 8
    - node: cardDoor
      entity: CardDoor
      edges:
        - to: start
          completed:
          - !type:PlaySound
            playAtPosition: true
            sound: /Audio/Items/Toys/ToyFall2.ogg
          - !type:SpawnEntity
             entity: MaterialCardboard1
             number: 8
          - !type:DeleteEntity
          steps:
            - tool: Slicing
              doAfter: 2
