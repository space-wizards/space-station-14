- type: constructionGraph
  id: ConveyorGraph
  start: start
  graph:

  - node: start
    edges:
    - to: conveyor
      steps:
      - material: ConveyorBeltStack
        amount: 1
        doAfter: 2

  - node: item
    entity: ConveyorBeltAssembly
    actions:
    - !type:SetAnchor
      value: false

  - node: conveyor
    entity: ConveyorBelt
    actions:
    - !type:SetAnchor
      value: true
    - !type:SnapToGrid
    edges:
    - to: item
      steps:
      - tool: Prying
        doAfter: 3
    - to: conveyor_left
      steps:
      - tool: Screwing
        doAfter: 1

  - node: conveyor_left
    entity: ConveyorBeltLeft
    actions:
    - !type:SetAnchor
      value: true
    - !type:SnapToGrid
    edges:
    - to: item
      steps:
      - tool: Prying
        doAfter: 3
    - to: conveyor_right
      steps:
      - tool: Screwing
        doAfter: 1

  - node: conveyor_right
    entity: ConveyorBeltRight
    actions:
    - !type:SetAnchor
      value: true
    - !type:SnapToGrid
    edges:
    - to: item
      steps:
      - tool: Prying
        doAfter: 3
    - to: conveyor
      steps:
      - tool: Screwing
        doAfter: 1
