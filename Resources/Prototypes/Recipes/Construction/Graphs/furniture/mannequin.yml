- type: constructionGraph
  id: Mannequin
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity
      edges:
        - to: mannequin
          completed:
            - !type:SnapToGrid
          steps:
            - material: WoodPlank
              amount: 5
            - material: MetalRod
              amount: 2
              doAfter: 2
    - node: mannequin
      entity: Mannequin
      edges:
        - to: start
          completed:
            - !type:EmptyAllContainers
            - !type:SpawnEntity
              entity: MaterialWoodPlank
              number: 5
            - !type:SpawnEntity
              entity: PartRodMetal
              number: 2
          steps:
            - tool: Screwing
              doAfter: 3
