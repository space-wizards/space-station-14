- type: constructionGraph
  id: WallBoard
  start: start
  graph:
  - node: start
    actions:
    - !type:DestroyEntity
    edges:
    - to: noticeBoard
      completed:
      - !type:SnapToGrid
      steps:
      - material: WoodPlank
        amount: 3
        doAfter: 2
    - to: postBoard
      completed:
      - !type:SnapToGrid
      steps:
      - material: WoodPlank
        amount: 3
        doAfter: 2
#Notice Board
  - node: noticeBoard
    entity: NoticeBoard
    edges:
    - to: start
      completed:
      - !type:GivePrototype
        prototype: MaterialWoodPlank
        amount: 3
      steps:
      - tool: Prying
        doAfter: 3
#Post Board
  - node: postBoard
    entity: PostBoard
    edges:
    - to: start
      completed:
      - !type:GivePrototype
        prototype: MaterialWoodPlank
        amount: 3
      steps:
      - tool: Prying
        doAfter: 3
