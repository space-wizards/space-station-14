- type: constructionGraph
  id: StationMap
  start: start
  graph:
  - node: start
    actions: # This action on the start node ensures we delete regardless of how we get here (sometimes reduces code duplication)
    - !type:DeleteEntity {}
    edges:
    - to: assembly
      steps:
      - material: Steel
        amount: 2
        doAfter: 2
      completed:
      - !type:PlaySound
        sound: /Audio/Items/genhit.ogg

  - node: assembly
    entity: StationMapAssembly
    actions:
    - !type:AppearanceChange
    edges:
    - to: wired
      steps:
      - material: Cable
        amount: 2
        doAfter: 1
      completed:
      - !type:PlaySound
        sound:
          collection: ConnectWires
    - to: start
      steps:
      - tool: Welding
        doAfter: 2
      completed:
      - !type:GivePrototype
        prototype: SheetSteel1
        amount: 2

  - node: wired
    entity: StationMapAssembly
    actions:
    - !type:AppearanceChange
    edges:
    - to: electronics
      steps:
      - tag: StationMapElectronics
        store: &Container board
        name: construction-graph-tag-station-map-electronics
        icon:
          sprite: "Objects/Misc/module.rsi"
          state: "door_electronics"
        doAfter: 1
      completed:
      - !type:PlaySound
        sound:
          collection: SlotElectronics
    - to: assembly
      steps:
      - tool: Cutting
        doAfter: 1
      completed:
      - !type:GivePrototype
        prototype: CableApcStack1
        amount: 2

  - node: electronics
    entity: StationMapAssembly
    actions:
    - !type:AppearanceChange
    edges:
    - to: screen
      steps:
      - material: Glass
        amount: 2
      completed:
      - !type:PlaySound
        sound: /Audio/Items/genhit.ogg
    - to: electronics
    - to: wired
      steps:
      - tool: Cutting
        doAfter: 1
      completed:
      - !type:EmptyContainer
        container: *Container
        pickup: true

  - node: screen
    entity: StationMapAssembly
    actions:
    - !type:AppearanceChange
    edges:
    - to: station_map
      steps:
      - tool: Screwing
        doAfter: 2
      completed:
      - !type:PlaySound
        sound: /Audio/Machines/light_tube_on.ogg
    - to: electronics
      conditions: # Safety condition. Should never be false but surfaces something went wrong
      - !type:ContainerNotEmpty
        container: *Container
        examineText: deconstructible-verb-activate-no-target-text
      steps:
      - tool: Prying
        doAfter: 1
      completed:
      - !type:GivePrototype
        prototype: SheetGlass1
        amount: 2

  # Final destination
  - node: station_map
    entity: StationMap
    edges:
    - to: screen
      steps:
      - tool: Screwing
        doAfter: 2

  # The entity prototype has a random fill so there's two nodes to cover both possibilities
  - node: broken
    entity: StationMapBroken
    edges:
    - to: wired
      conditions:
      - !type:ContainerEmpty
        container: *Container
      steps: &StepsBroken
      - tool: Screwing
        doAfter: 3
      completed: &CompletedBroken
      - !type:GivePrototype
        prototype: ShardGlass
        amount: 2
    - to: electronics
      conditions:
      - !type:ContainerNotEmpty
        container: *Container
      steps: *StepsBroken
      completed: *CompletedBroken
