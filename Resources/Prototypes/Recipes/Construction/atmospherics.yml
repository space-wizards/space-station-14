# region Base
- type: construction
  abstract: true
  id: BaseAtmos
  placementMode: SnapgridCenter
  category: construction-category-atmospherics
  objectType: Structure
  canRotate: true

- type: construction
  abstract: true
  parent: BaseAtmos
  id: BaseGasPipe
  placementMode: AlignAtmosPipeLayers
  graph: GasPipe
  canBuildInImpassable: true # for player convenience

- type: construction
  abstract: true
  parent: BaseAtmos
  id: BaseGasDevice
  conditions:
  - !type:NoUnstackableInTile

# we allow stacking for shit like radiators on top of atmosdevices
# for now (trademark patent pending)
- type: construction
  abstract: true
  parent: BaseAtmos
  id: BaseGasDeviceStackable

- type: construction
  abstract: true
  parent: BaseGasDevice
  id: BaseGasUnary
  graph: GasUnary

- type: construction
  abstract: true
  parent: BaseGasDevice
  id: BaseGasBinary
  graph: GasBinary
  placementMode: AlignAtmosPipeLayers # most binary devices support layers

- type: construction
  abstract: true
  parent: BaseGasDeviceStackable
  id: BaseGasBinaryStackable
  graph: GasBinary
  placementMode: AlignAtmosPipeLayers

- type: construction
  abstract: true
  parent: BaseGasDevice
  id: BaseGasTrinary
  graph: GasTrinary
# endregion Base

# region Machines
- type: construction
  parent: BaseAtmos
  id: AirAlarmFixture
  graph: AirAlarm
  targetNode: air_alarm
  canBuildInImpassable: true
  conditions:
  - !type:WallmountCondition

- type: construction
  parent: BaseAtmos
  id: FireAlarm
  graph: FireAlarm
  targetNode: fire_alarm
  canBuildInImpassable: true
  conditions:
  - !type:WallmountCondition

- type: construction
  parent: BaseAtmos
  id: AirSensor
  graph: AirSensor
  targetNode: sensor

- type: construction
  parent: BaseAtmos
  id: !type:CreateVariants
    values: [ GasPipeSensor, GasPipeSensorAlt1, GasPipeSensorAlt2 ]
  placementMode: AlignAtmosPipeLayers
  hide: !type:CreateVariants
    values: [ false, true, true ]
  graph: !type:CreateVariants
    values: [ GasPipeSensor, GasPipeSensorAlt1, GasPipeSensorAlt2 ]
  targetNode: sensor
# endregion Machines

