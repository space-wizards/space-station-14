# Modifier sets for entities that can be described as fully (or mostly) composed of some specific material

#region Metallic
## Metals resist brute making them resilient to common attacks, but have an exploitable weakness to burn.

# Extremely strong metal that's unavailable to crew.
- type: damageModifierSet
  id: PlastitaniumMod
  coefficients:
    Blunt: 0.4
    Slash: 0.4
    Piercing: 0.4
    Heat: 0.8
    Cold: 0.8
    Shock: 0.8
    Caustic: 0.8
  flatReductions:
    Blunt: 8
    Slash: 8
    Piercing: 8
    Heat: 4
    Cold: 4
    Shock: 4
    Caustic: 4
    Structural: 8

# Strong metal used by crew to protect important areas and items.
- type: damageModifierSet
  id: PlasteelMod
  coefficients:
    Blunt: 0.6
    Slash: 0.6
    Piercing: 0.6
  flatReductions:
    Blunt: 8
    Slash: 8
    Piercing: 8
    Structural: 4

# Common metal found all over the place
- type: damageModifierSet
  id: SteelMod
  coefficients:
    Blunt: 0.8
    Slash: 0.8
    Piercing: 0.8
    Heat: 1.3
  flatReductions:
    Blunt: 4
    Slash: 4
    Piercing: 4

# Weak metal used for specific or aesthetic reasons.
- type: damageModifierSet
  id: BrassMod
  coefficients:
    Heat: 1.5
    Cold: 1.2
    Shock: 1.2

# Metals that you really shouldn't be building things out of. Gold, silver, uranium, etc.
- type: damageModifierSet
  id: PreciousMetalMod
  coefficients:
    Blunt: 1.2
    Slash: 1.2
    Piercing: 1.2
    Heat: 2
    Cold: 1.5
    Shock: 1.5
    Caustic: 0.5

#endregion
#region Glass

# Resists burns, but is weak to common blunt damage.
- type: damageModifierSet
  id: GlassMod
  coefficients:
    Blunt: 1.5
    Heat: 0.7
    Cold: 0.7
    Shock: 0.7
  flatReductions:
    Heat: 6
    Cold: 6
    Shock: 6

# Halfway between steel and glass.
- type: damageModifierSet
  id: GlassReinforcedMod
  coefficients:
    Blunt: 1.2
    Slash: 0.9
    Piercing: 0.9
    Heat: 1.1
    Cold: 0.8
    Shock: 0.8
  flatReductions:
    Slash: 2
    Piercing: 2
    Shock: 4
    Caustic: 4

# Halfway between plasma and glass.
- type: damageModifierSet
  id: GlassPlasmaMod
  coefficients:
    Slash: 0.7
    Piercing: 1.5
    Heat: 0.6
    Cold: 1.4
    Shock: 1.4
    Caustic: 0.7
  flatReductions:
    Slash: 6
    Heat: 8
    Caustic: 6
    Structural: 4

# Halfway between reinforced glass and plasma.
- type: damageModifierSet
  id: GlassReinforcedPlasmaMod
  coefficients:
    Blunt: 0.8
    Slash: 0.7
    Piercing: 1.5
    Heat: 0.8
    Cold: 1.4
    Shock: 1.4
    Caustic: 0.7
  flatReductions:
    Blunt: 4
    Slash: 6
    Heat: 4
    Caustic: 6
    Structural: 4

#endregion
#region Organic
## Poor resistances with specific, obvious weaknesses.

- type: damageModifierSet
  id: CardboardMod
  coefficients:
    Blunt: 1.5
    Slash: 2
    Heat: 2
  flatReductions:
    Structural: -2 # Falls apart no matter what you do to it

- type: damageModifierSet
  id: WoodMod
  coefficients:
    Blunt: 0.8
    Slash: 1.5
    Piercing: 0.8
    Heat: 1.5
  flatReductions:
    Blunt: 4
    Piercing: 4

# Silk, cloth, and other woven materials.
- type: damageModifierSet
  id: ThreadMod
  coefficients:
    Slash: 2
    Piercing: 1.5
    Heat: 2

# Halfway between thread and plastic.
- type: damageModifierSet
  id: DurathreadMod
  coefficients:
    Blunt: 0.9
    Slash: 1.5
    Piercing: 1.2
    Heat: 1.5
    Cold: 0.9
    Shock: 0.9
    Caustic: 1.5

# Standard "weak to everything" design. Meat is as good a place as any for it.
- type: damageModifierSet
  id: MeatMod
  coefficients:
    Blunt: 1.5
    Slash: 1.5
    Piercing: 1.5
    Heat: 1.5
    Cold: 1.5
    Shock: 1.5
    Caustic: 1.5
    Poison: 1.5
    Radiation: 1.5
    Asphyxiation: 1.5
    Bloodloss: 1.5
    Cellular: 1.5
    Holy: 1.5
    Structural: 1.5

#endregion
