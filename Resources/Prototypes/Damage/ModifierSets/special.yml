# These modifiers don't appear as a natural set used by any entity, but for some other novel purpose.

# Represents which damage types should be modified in relation to how they cause bleed rate.
# Make sure to add any new damage type here.
- type: damageModifierSet
  id: BloodlossHuman
  coefficients:
    Asphyxiation: 0.0
    Bloodloss: 0.0 # no double dipping
    Blunt: 0.08
    Caustic: 0.0
    Cellular: 0.0
    Cold: 0.0
    Heat: -0.5 # heat damage cauterizes wounds, but will still hurt obviously.
    Holy: 0
    Piercing: 0.2
    Poison: 0.0
    Radiation: 0.0
    Shock: 0.0
    Slash: 0.25
    Structural: 0.0
