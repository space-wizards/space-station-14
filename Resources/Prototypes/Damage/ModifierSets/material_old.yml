# Modifier sets previously used by structures which may be removed in the future

## Metallic

- type: damageModifierSet
  id: Metallic
  coefficients:
    Blunt: 0.7
    Slash: 0.5
    Piercing: 0.7
    Shock: 1.2
    Structural: 0.5
  flatReductions:
    Blunt: 5
    Heat: 5

- type: damageModifierSet
  id: StructuralMetallicStrong
  coefficients:
    Blunt: 0.5
    Slash: 0.5
    Piercing: 0.5
    Shock: 1.2
    Structural: 0.25
  flatReductions:
    Blunt: 10
    Slash: 10
    Piercing: 10
    Heat: 10
    Structural: 10

- type: damageModifierSet
  id: StructuralMetallic
  coefficients:
    Shock: 1.2
    Heat: 1.2
    Structural: 0.5
  flatReductions:
    Blunt: 10
    Slash: 10
    Piercing: 10
    Heat: 10
    Structural: 10

# Like metallic, but without flat reduction so it can be damaged with fists.
- type: damageModifierSet
  id: FlimsyMetallic
  coefficients:
    Blunt: 0.7
    Slash: 0.5
    Piercing: 0.7
    Shock: 1.2

# Like metallic but very strong to resist most all basic tools and weapons.
- type: damageModifierSet
  id: StrongMetallic
  coefficients:
    Blunt: 0.7
    Slash: 0.5
    Piercing: 0.7
    Shock: 1.2
  flatReductions:
    Blunt: 10
    Slash: 10
    Piercing: 10
    Shock: 10
    Heat: 10

- type: damageModifierSet
  id: PerforatedMetallic
  coefficients:
    Blunt: 2
    Piercing: 0.2
    Shock: 0.6
  flatReductions:
    Piercing: 10

