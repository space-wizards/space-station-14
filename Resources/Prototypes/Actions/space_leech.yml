- type: entity
  parent: BaseAction
  id: ActionSpaceLeechUpgradeMenu
  name: Evolve
  description: Opens the evolution terminal to spend blood on upgrades.
  components:
  - type: Action
    icon: Interface/Actions/shop.png
    checkCanInteract: false
  - type: InstantAction
    event: !type:SpaceLeechUpgradeMenuActionEvent

- type: entity
  parent: BaseAction
  id: ActionSpaceLeechSting
  name: Venom Spit
  description: Spit a paralyzing bolt that knocks the target down. Knockdown duration scales with Venom evolution rank.
  components:
  - type: Action
    icon: { sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi, state: crossbowbolt }
    useDelay: 45
    checkCanInteract: false
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Weapons/Guns/Gunshots/energycrossbow_shoot.ogg
  - type: TargetAction
    checkCanAccess: false
    range: 8
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ProjectileSpaceLeechSting
