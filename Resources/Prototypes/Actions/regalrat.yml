- type: entity
  parent: BaseAction
  id: ActionRatKingRaiseArmy
  name: Raise Army
  description: Spend some hunger to summon an allied rat to help defend you.
  components:
  - type: Action
    useDelay: 4
  - type: Sprite
    sprite: Interface/Actions/actions_rat_king.rsi
    layers:
    - state: ratKingArmy
  - type: InstantAction
    event: !type:RatKingRaiseArmyActionEvent

- type: entity
  parent: BaseAction
  id: ActionRatKingDomain
  name: Rat King's Domain
  description: Spend some hunger to release a cloud of ammonia into the air.
  components:
  - type: Action
    useDelay: 6
  - type: Sprite
    sprite: Interface/Actions/actions_rat_king.rsi
    layers:
    - state: ratKingDomain
  - type: InstantAction
    event: !type:RatKingDomainActionEvent

- type: entity
  parent: BaseAction
  id: ActionRatKingOrderStay
  name: Stay
  description: Command your army to stand in place.
  components:
  - type: Action
    useDelay: 1
    startDelay: true
    priority: 5
  - type: Sprite
    sprite: Interface/Actions/actions_rat_king.rsi
    layers:
    - state: stayOff
      map: ["enum.ActionVisuals.Icon"]
    - state: stay
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:RatKingOrderActionEvent
      type: Stay

- type: entity
  parent: BaseAction
  id: ActionRatKingOrderFollow
  name: Follow
  description: Command your army to follow you around.
  components:
  - type: Action
    useDelay: 1
    startDelay: true
    toggled: true
    priority: 6
  - type: Sprite
    sprite: Interface/Actions/actions_rat_king.rsi
    layers:
    - state: followOff
      map: ["enum.ActionVisuals.Icon"]
    - state: follow
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:RatKingOrderActionEvent
      type: Follow

- type: entity
  parent: BaseAction
  id: ActionRatKingOrderCheeseEm
  name: Cheese 'Em
  description: Command your army to attack whoever you point at.
  components:
  - type: Action
    useDelay: 1
    startDelay: true
    priority: 7
  - type: Sprite
    sprite: Interface/Actions/actions_rat_king.rsi
    layers:
    - state: attackOff
      map: ["enum.ActionVisuals.Icon"]
    - state: attack
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:RatKingOrderActionEvent
      type: CheeseEm

- type: entity
  parent: BaseAction
  id: ActionRatKingOrderLoose
  name: Loose
  description: Command your army to act at their own will.
  components:
  - type: Action
    useDelay: 1
    startDelay: true
    priority: 8
  - type: Sprite
    sprite: Interface/Actions/actions_rat_king.rsi
    layers:
    - state: looseOff
      map: ["enum.ActionVisuals.Icon"]
    - state: loose
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:RatKingOrderActionEvent
      type: Loose
