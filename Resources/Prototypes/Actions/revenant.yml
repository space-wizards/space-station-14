- type: entity
  parent: BaseAction
  id: ActionRevenantMalfunction
  name: Malfunction
  description: Costs 60 Essence.
  components:
  - type: Action
    useDelay: 20
    raiseOnAction: true
    itemIconStyle: BigAction
  - type: Sprite
    layers:
    - texture: Interface/Actions/malfunction.png
  - type: ActionRequirements
    failPopup: revenant-not-enough-essence
    failPopupType: SmallCaution
    conditions:
      Performer:
      - !type:SatiationCondition
        satiationType: Essence
        min: 60
    effects:
      Performer:
      - !type:Satiate
        satiationType: Essence
        factor: -60
  - type: InstantAction
    event: !type:RevenantMalfunctionActionEvent
  - type: RevenantMalfunctionAction
    stunDuration: 2
    corporealDuration: 8
    malfunctionRadius: 3.5
    malfunctionWhitelist:
      components:
      # emag lockers open
      - EntityStorage
      # emag doors open
      - Airlock
      # troll medical to help get kills
      - StasisBed
      - EmaggableMedibot
      # borg become killer
      - EmagSiliconLaw
