- type: entity
  parent: ActionIntrinsicStore
  id: ActionRevenantShop
  name: Shop
  description: Opens the ability shop.

- type: entity
  parent: BaseAction
  id: ActionRevenantDefile
  name: Defile
  description: Costs 30 Essence.
  components:
  - type: Action
    useDelay: 15
    raiseOnAction: true
    itemIconStyle: BigAction
  - type: Sprite
    layers:
    - texture: Interface/Actions/defile.png
  - type: ActionRequirements
    failPopup: revenant-not-enough-essence
    failPopupType: SmallCaution
    conditions:
      Performer:
      - !type:SatiationCondition
        satiationType: Essence
        min: 30
    effects:
      Performer:
      - !type:Satiate
        satiationType: Essence
        factor: -30
  - type: InstantAction
    event: !type:RevenantDefileActionEvent
  - type: RevenantDefileAction
    stunDuration: 1
    corporealDuration: 4
    defileRadius: 3.5
    defileTilePryAmount: 15
    defileEffectChance: 0.5

- type: entity
