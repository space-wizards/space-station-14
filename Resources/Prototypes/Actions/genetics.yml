- type: entity
  parent: BaseAction
  id: ActionGeneticTelepathy
  name: action-genetics-telepathy-name
  description: action-genetics-telepathy-description
  components:
  - type: Action
    useDelay: 5
  - type: Sprite
    sprite: Interface/Actions/voice-mask.rsi
    layers:
    - state: icon
  - type: EntityTargetAction
    range: 12
    event: !type:GeneticTelepathyActionEvent

- type: entity
  parent: BaseAction
  id: ActionGeneticTelekinesis
  name: action-genetics-telekinesis-name
  description: action-genetics-telekinesis-description
