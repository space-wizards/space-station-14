  - type: Action
    useDelay: 2
  - type: Sprite
    sprite: Interface/Actions/actions_ai.rsi
    layers:
    - state: camera_light
  - type: EntityTargetAction
    range: 6
    event: !type:GeneticTelekinesisActionEvent

- type: entity
