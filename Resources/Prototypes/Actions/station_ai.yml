# Actions
- type: entity
  parent: BaseAction
  id: ActionJumpToCore
  name: Jump to core
  description: Sends your eye back to the core.
  components:
  - type: Action
    priority: -9
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/actions_ai.rsi
    layers:
    - state: ai_core
  - type: InstantAction
    event: !type:JumpToCoreEvent

- type: entity
  parent: BaseMentalAction
  id: ActionAIViewLaws
  name: View Laws
  description: View the laws that you must follow.
  components:
  - type: Action
    priority: -3
    itemIconStyle: NoItem
    useDelay: 0.5
  - type: Sprite
    sprite: Interface/Actions/actions_ai.rsi
    layers:
    - state: state_laws
  - type: InstantAction
    event: !type:ToggleLawsScreenEvent

- type: entity
  parent: BaseMentalAction
  id: ActionOpenDoorRadialMenu
  name: Set door action
  description: Set the action that will happen when you interact with doors.
  components:
  - type: Action
    priority: -8
    itemIconStyle: NoItem
  - type: Sprite
    sprite: Objects/Devices/door_remote.rsi
    layers:
    - state: door_remotebase
    - state: door_remotelightscolour
      color: "#5ed7aa"
    - state: door_remotescreencolour
      color: "#5ed7aa"
  - type: InstantAction
    event: !type:OpenDoorRadialMenuEvent
