- type: entity
  parent: BaseDoAfterAction
  id: ActionCosmicSiphon
  name: Siphon Entropy
  description: Stealthily siphon entropy from your target. Siphoning large amounts of entropy will increase your power.
  components:
  - type: DoAfterArgs
    delay: 0.9
    hidden: True
    breakOnMove: True
  - type: Action
    raiseOnAction: true
    useDelay: 50
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/cosmic-actions.rsi
    layers:
    - state: siphon
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - HumanoidProfile
    blacklist:
      components:
      - CosmicCultist
      - ActiveNPC
    event: !type:EventCosmicSiphon
  - type: CosmicActionSiphon
  - type: CosmicCultAction
    sfx:
      path: "/Audio/Cosmic/Abilities/ability-siphon.ogg"

- type: entity
  parent: BaseDoAfterAction
  id: ActionCosmicShunt
  name: Shunt Subjectivity
  description: Shunt your target's mind out of their body and unto the cosmic dark, temporarily rendering their body mindless.
  components:
  - type: DoAfterArgs
    delay: 0.566
    breakOnMove: True
  - type: Action
    raiseOnAction: true
    useDelay: 120
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/cosmic-actions.rsi
    layers:
    - state: shunt
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components:
      - HumanoidProfile
    blacklist:
      components:
      - CosmicCultist
      - CosmicShuntedOrigin
      - ActiveNPC
    event: !type:EventCosmicShunt
  - type: CosmicActionShunt
    conversionBlacklist: # Entities with these components can be shunted, but cannot be converted.
      components:
      - ChangelingDevour
      - SpaceNinja
      - NukeOperative
      - Revolutionary
  - type: CosmicCultAction
    vfx: EffectCosmicActionShunt
    sfx:
      path: "/Audio/Cosmic/Abilities/ability-shunt.ogg"

- type: entity
  parent: BaseMentalAction
  id: ActionCosmicLapse
  name: Astral Lapse
  description: Lapse your target's corporeal form, temporarily rendering it immutable, impassible, and frozen in place.
  components:
  - type: Action
    raiseOnAction: true
    useDelay: 45
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/cosmic-actions.rsi
    layers:
    - state: lapse
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components:
      - HumanoidProfile
    blacklist:
      components:
      - CosmicShuntedOrigin
    event: !type:EventCosmicLapse
  - type: CosmicActionLapse
  - type: CosmicCultAction
    vfx: EffectCosmicActionLapse
    sfx:
      path: "/Audio/Cosmic/Abilities/ability-lapse.ogg"
  - type: SpeakOnAction
    dialogueDataset: DatasetCosmicDialogueLapse

- type: entity
  parent: BaseMentalAction
  id: ActionCosmicGlare
  name: Malign Glare
  description: Emit a horrid pulse of cosmic light, slowing and disorienting everyone around you. Its effects are amplified against silicon-based entities.
  components:
  - type: ConfirmableAction
    popup: cosmicability-glare-confirm
    confirmDelay: 0.1
    primeTime: 3
  - type: Action
    raiseOnAction: true
    useDelay: 40
    checkCanInteract: false
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/cosmic-actions.rsi
    layers:
    - state: glare
  - type: InstantAction
    event: !type:EventCosmicGlare
  - type: CosmicActionGlare
  - type: CosmicCultAction
    vfx: EffectCosmicActionGlare
    sfx:
      path: "/Audio/Cosmic/Abilities/ability-glare.ogg"
  - type: SpeakOnAction
    dialogueDataset: DatasetCosmicDialogueGlare

- type: entity
  parent: BaseMentalAction
  id: ActionCosmicIngress
  name: Force Ingress
  description: Use a concentrated blast of power to force a secure doorway open.
  components:
  - type: Action
    raiseOnAction: true
    useDelay: 20
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/cosmic-actions.rsi
    layers:
    - state: ingress
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - Door
    event: !type:EventCosmicIngress
  - type: CosmicActionIngress
  - type: CosmicCultAction

- type: entity
  parent: BaseMentalAction
  id: ActionCosmicImposition
  name: Vacuous Imposition
  description: You negate any incoming damage for a short time.
  components:
  - type: Action
    raiseOnAction: true
    useDelay: 100
    checkCanInteract: false
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/cosmic-actions.rsi
    layers:
    - state: entropic
  - type: InstantAction
    event: !type:EventCosmicImposition
  - type: CosmicActionImposition
  - type: CosmicCultAction
    vfx: EffectCosmicBigWindup
    sfx:
      path: "/Audio/Cosmic/Abilities/ability-imposition.ogg"
  - type: SpeakOnAction
    dialogueDataset: DatasetCosmicDialogueImposition

- type: entity
  parent: BaseAction
  id: ActionCosmicNova
  name: Astral Nova
  description: Hurl a large and disruptive blast of astral energy.
  components:
  - type: Action
    useDelay: 25
    raiseOnAction: true
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/cosmic-actions.rsi
    layers:
    - state: nova
  - type: TargetAction
    checkCanAccess: false
    repeat: false
    range: 0
  - type: WorldTargetAction
    event: !type:EventCosmicNova
  - type: CosmicActionNova
  - type: CosmicCultAction
    sfx:
      path: "/Audio/Cosmic/Abilities/ability-nova-cast.ogg"
  - type: SpeakOnAction
    dialogueDataset: DatasetCosmicDialogueNova

- type: entity
  parent: BaseAction
  id: ActionCosmicFragmentation
  name: Malign Fragmentation
  description: Transfer your malign empowerment into a digital system, such as an AI Upload Console or Cyborg, corrupting it in the process. Doing so will expend your empowerment.
  components:
  - type: LimitedCharges
    maxCharges: 1
  - type: Action
    raiseOnAction: true
    useDelay: 25
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/cosmic-actions.rsi
    layers:
    - state: corruption
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - BorgChassis
      - StationAiCore
    blacklist:
      components:
      - CosmicCultist
      - ActiveNPC
    event: !type:EventCosmicFragmentation
  - type: CosmicActionFragmentation
  - type: CosmicCultAction
  - type: SpeakOnAction
    dialogueDataset: DatasetCosmicDialogueFragmentation

- type: entity
  parent: BaseDoAfterAction
  id: ActionCosmicShift
  name: Astral Shift
  description: Slip out of phase with realspace in order to temporarily access the cosmic dark. You'll automatically return to where you left from after a period of time.
  components:
  - type: DoAfterArgs
    breakOnMove: True
  - type: Action
    raiseOnAction: true
    checkCanInteract: false
    itemIconStyle: BigAction
    useDelay: 55
  - type: Sprite
    sprite: Interface/Actions/cosmic-actions.rsi
    layers:
    - state: shift
  - type: InstantAction
    event: !type:EventCosmicShift
  - type: CosmicActionShift
  - type: CosmicCultAction

- type: entity
  parent: BaseMentalAction
  id: ActionCosmicReturn
  name: Return
  description: Leave the dark and return to the station early.
  components:
  - type: Action
    raiseOnAction: true
    checkCanInteract: false
    itemIconStyle: BigAction
    useDelay: 0
  - type: Sprite
    sprite: Interface/Actions/cosmic-actions.rsi
    layers:
    - state: return
  - type: InstantAction
    event: !type:EventCosmicReturn
  - type: CosmicActionReturn
  - type: CosmicCultAction

## COLOSSUS ACTIONS

- type: entity
  parent: BaseAction
  id: ActionCosmicColossusSunder
  name: Entropic Sunder
  description: Warp to the target surface and unleash a cascading detonation of malign energy.
  components:
  - type: Action
    raiseOnAction: true
    itemIconStyle: BigAction
    useDelay: 0
  - type: Sprite
    sprite: Interface/Actions/cosmic-actions.rsi
    layers:
    - state: sunder
  - type: TargetAction
    range: 7
  - type: WorldTargetAction
    event: !type:EventCosmicColossusSunder
  - type: CosmicActionSunder
  - type: CosmicCultAction
    vfx: EffectCosmicActionSunder

- type: entity
  parent: BaseAction
  id: ActionCosmicColossusHibernate
  name: Slumber Shell
  description: Slumber your body for a period of time to regenerate integrity. Must be done on stable ground.
  components:
#  - type: LimitedCharges
#    maxCharges: 2 # TODO: UNCOMMENT THIS BEFORE ANY THING GETS MERGED!
  - type: ConfirmableAction
    popup: cosmicability-hibernate-confirm
    confirmDelay: 0.1
    primeTime: 3
  - type: Action
    raiseOnAction: true
    useDelay: 5 # TODO: SHOULD BE 40.
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/cosmic-actions.rsi
    layers:
    - state: slumber
  - type: InstantAction
    event: !type:EventCosmicColossusHibernate
  - type: CosmicActionHibernate
  - type: CosmicCultAction

- type: entity
  parent: ActionCosmicIngress
  id: ActionCosmicColossusIngress
  name: Colossal Ingress
  description: Use a concentrated blast of power to force a secure doorway open.
  components:
  - type: Action
    raiseOnAction: true
    useDelay: 2
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/cosmic-actions.rsi
    layers:
    - state: ingress
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - Door
    event: !type:EventCosmicIngress
  - type: CosmicActionIngress
    alwaysOpen: true
  - type: CosmicCultAction
