# for ChangelingFleshClothingAbilityComponent
- type: alert
  id: ChangelingFleshClothing
  clickEvent: !type:ToggleFleshClothingEvent
  icons:
  - sprite: /Textures/Interface/Alerts/changeling.rsi
    state: flesh-clothing-off
  - sprite: /Textures/Interface/Alerts/changeling.rsi
    state: flesh-clothing-on
  name: changeling-flesh-clothing-alert-name
  description: changeling-flesh-clothing-alert-desc
  minSeverity: 0
  maxSeverity: 1

- type: alert
  id: ChemicalsChangeling
  category: Chemicals
  icons:
  - sprite: /Textures/Interface/Alerts/essence_counter.rsi
    state: essence0
  alertViewEntity: AlertChemicalsSpriteView
  name: alerts-changeling-chemicals-name
  description: alerts-changeling-chemicals-desc

- type: entity
  id: AlertChemicalsSpriteView
  categories: [ HideSpawnMenu ]
  components:
  - type: GenericCounterAlert
    centerGlyph: false
    hideLeadingZeroes: false
  - type: SatiationCounterAlert
    satiationType: Chemicals
  - type: Sprite
    sprite: /Textures/Interface/Alerts/chemicals_counter.rsi
    layers:
    - map: [ "enum.AlertVisualLayers.Base" ]
    - map: [ "1" ]
      offset: 0.25, 0
    - map: [ "10" ]
      offset: 0.125, 0
    - map: [ "100" ]
