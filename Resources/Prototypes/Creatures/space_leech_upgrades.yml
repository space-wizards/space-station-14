# magnitudes[rank] interpretation per upgrade (index 0 = base/unpurchased):
#   Predator  - damage multiplier
#   Quickness - speed multiplier
#   Shadow    - passiveVisibilityRate (more negative = faster fade)
#   Venom     - knockdown duration in seconds (rank 0 unused; sting is locked until rank 1)
#   Ravenous  - eat-time multiplier (lower = faster)
#   Pry       - pry time fraction (lower = faster)
#   Ironhide  - incoming damage coefficient (lower = less damage taken)

- type: spaceLeechUpgrade
  id: SpaceLeechUpgradePredator
  order: 0
  name: space-leech-upgrade-predator-name
  stat: space-leech-upgrade-predator-stat
  costs: [100, 185, 215]
  effects:
  - space-leech-upgrade-predator-effect-1
  - space-leech-upgrade-predator-effect-2
  - space-leech-upgrade-predator-effect-3
