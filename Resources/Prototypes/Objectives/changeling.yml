- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseChangelingObjective
  components:
  - type: Objective
    issuer: Changeling
    difficulty: 1
  - type: RoleRequirement
    roles:
    - ChangelingRole

- type: entity
  parent: [BaseChangelingObjective, BaseSurviveObjective]
  id: ChangelingSurviveObjective
  name: Survive.
  description: We must stay alive at all cost.
  components:
  - type: Objective
    difficulty: 0.5
    icon:
      sprite: Mobs/Species/Human/organs.rsi
      state: heart-on

- type: entity
  parent: BaseChangelingObjective
  id: ChangelingDevouredCountObjective
  components:
  - type: Objective
    difficulty: 1
    icon:
      sprite: Mobs/Aliens/flesh.rsi
      state: golem
  - type: NumberObjective
    min: 3
    max: 4
    title: objective-devour-unique-identity-name
    description: objective-devour-unique-identity-description
  - type: ChangelingUniqueIdentityCondition
    requireDevour: true

- type: entity
  parent: BaseChangelingObjective
  id: ChangelingExtractedCountObjective
  components:
  - type: Objective
    difficulty: 1
    icon:
      sprite: Mobs/Aliens/flesh.rsi
      state: golem
  - type: NumberObjective
    min: 8
    max: 10
    title: objective-gain-unique-identity-name
    description: objective-gain-unique-identity-description
  - type: ChangelingUniqueIdentityCondition

- type: entity
  parent: [BaseChangelingObjective, BaseLivingObjective]
  id: ChangelingEscapeIdentityObjective
  description: We must escape with the target person's identity and wear an ID card with their name on it.
  components:
  - type: Objective
    difficulty: 1.5
    icon:
      sprite: Objects/Fun/Plushies/human.rsi
      state: icon
  - type: TargetObjective
    title: objective-escape-identity-title
  - type: ChangelingEscapeIdentityCondition
  - type: PickRandomPerson
    conditions:
    - !type:NotAntagonistCondition # The only antagonists we want to roll for this objective are on-station. Everything else is basically impossible to devour.
      excluded: # Lings are excluded because once they transform their identity is essentially not possible to obtain anymore.
      - Traitor
      - TraitorSleeper
      - Thief
      - HeadRev
      - InitialInfected
    # Kill and Escape objectives should have different targets.
    - !type:ObjectiveTargetCondition
      inverted: true
      whitelist:
        components:
        - KillPersonCondition
        - ChangelingEscapeIdentityCondition

- type: entity
  parent: [BaseChangelingObjective, BaseLivingObjective]
  id: ChangelingEscapeDepartmentObjective
  description: We must escape with the identity & ID card of any member of this department.
  components:
  - type: Objective
    difficulty: 1
    icon:
      sprite: Objects/Fun/Plushies/atmosian.rsi
      state: icon
  - type: TargetObjective
    title: objective-escape-department-title
  - type: ChangelingEscapeDepartmentCondition
  - type: PickRandomPerson
    conditions:
    - !type:NotAntagonistCondition # Only allow on-station antags. This excludes changelings because them transforming makes mindroles inaccurate and makes this objective basically impossible.
      excluded:
      - Traitor
      - TraitorSleeper
      - Thief
      - HeadRev
      - InitialInfected
    - !type:RoleCondition
      whitelist:
        components:
        - JobRole # Our target has to be employed, obviously.
    - !type:DifferentDepartmentCondition # I love spawning as a scientist and having to escape as a scientist

- type: entity
  parent: [BaseChangelingObjective, BaseKillObjective]
  id: ChangelingKillRandomPersonObjective
  description: This person is our prey. We must ensure they stay dead on the station.
  components:
  - type: Objective
    difficulty: 2.0
    unique: false
  - type: TargetObjective
    title: objective-condition-kill-maroon-title
  - type: PickRandomPerson
    conditions:
    - !type:NotAntagonistCondition # Only roll on-station antags.
      excluded:
      - Traitor
      - TraitorSleeper
      - Thief
      - HeadRev
      - InitialInfected
    # Kill and Escape objectives should have different targets.
    - !type:ObjectiveTargetCondition
      inverted: true
      whitelist:
        components:
        - KillPersonCondition
        - ChangelingEscapeIdentityCondition
  - type: KillPersonCondition
    requireDead: true
    requireMaroon: true

- type: entity
  parent: BaseChangelingObjective
  id: ChangelingMostDevouredObjective
  name: Devour the most humanoids.
  description: We must devour the most unique humanoids out of all other changelings.
  components:
  - type: Objective
    difficulty: 1
    icon:
      sprite: Mobs/Aliens/flesh.rsi
      state: golem
  - type: ChangelingMostIdentitiesCondition
    requireDevour: true

- type: entity
  parent: BaseChangelingObjective
  id: ChangelingMostExtractedObjective
  name: Extract the most identities.
  description: We must extract the most unique DNA sequences out of all other changelings, via devouring or otherwise.
  components:
  - type: Objective
    difficulty: 1
    icon:
      sprite: Mobs/Aliens/flesh.rsi
      state: golem
  - type: ChangelingMostIdentitiesCondition
