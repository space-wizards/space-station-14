- type: entityTable
  id: FillLockerFireStandard
  table: !type:AllSelector
    children:
    - id: ClothingHeadHelmetFire
    - id: ClothingMaskGas
    - id: ClothingOuterSuitFire
    - id: CrowbarRed
    - !type:GroupSelector
      children:
      - id: FireExtinguisher
        weight: 98
      - id: SprayBottleWater #It's just budget cut after budget cut man
        weight: 2

- type: entity
  id: ClosetFireFilled
  parent: ClosetFire
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillLockerFireStandard
        - !type:GroupSelector # Chance to contain N2 instead of O2
          children:
          - !type:NestedSelector
            tableId: FillEmergencyO2
            weight: 4
          - !type:NestedSelector
            tableId: FillEmergencyN2

