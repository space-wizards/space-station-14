- type: entityTable
  id: FillEmergencyInflatables
  table: !type:AllSelector
    children:
    - id: InflatableWallStack5
    - id: InflatableDoorStack1

- type: entityTable
  id: FillEmergencyO2
  table: !type:AllSelector
    children:
    - !type:GroupSelector
      children:
      - id: EmergencyOxygenTankFilled
        weight: 4
      - id: OxygenTankFilled

- type: entityTable
  id: FillEmergencyN2
  table: !type:AllSelector
    children:
    - !type:GroupSelector
      children:
      - id: EmergencyNitrogenTankFilled
        weight: 4
      - id: NitrogenTankFilled

# Emergency lockers are intended to be somewhat random (for verisimilitude/suspense), so other than the bare essentials there should rarely be 100% guarenteed spawns
- type: entityTable
  id: FillLockerEmergencyStandard
  table: !type:AllSelector
    children:
    - id: BoxMRE
      prob: 0.1
    - id: ClothingMaskBreath
    - id: ClothingOuterSuitEmergency
    - id: MedkitOxygenFilled # technically doesn't fit N2 lockers, but we don't have an N2 version of this yet, and (aside from the emergency O2 tank) N2-breathing species can still use its contents
      prob: 0.2
    - id: ToolboxEmergencyFilled
      prob: 0.5
    - id: WeaponFlareGun
      prob: 0.1
    - !type:NestedSelector
      tableId: FillEmergencyInflatables

- type: entity
  id: ClosetEmergencyFilledRandom
  parent: ClosetEmergency
  suffix: Filled, Random
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillLockerEmergencyStandard
        - !type:NestedSelector
          tableId: FillEmergencyO2

