- type: entity
  id: LockerSyndicatePersonalFilled
  suffix: Nukie, Filled
  parent: LockerSyndicatePersonal
  description: It's a personal storage unit for operative gear.
  components:
  - type: AccessReader
    access: [["NuclearOperative"]]
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingBeltMilitaryWebbing
        - id: ClothingHandsGlovesCombat
        - id: JetpackBlackFilled
        - id: ClothingUniformJumpsuitOperative
        - id: ClothingUniformJumpskirtOperative
        - id: ClothingHeadsetAltSyndicate
        - id: ClothingEyesHudSyndicate

- type: entity
  id: LockerSyndicateWallFilled
  suffix: Nukie, Filled
  parent: LockerWallSyndicate
  description: It's a personal storage unit for operative gear.
  components:
  - type: AccessReader
    access: [["NuclearOperative"]]
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingBeltMilitaryWebbing
        - id: ClothingHandsGlovesCombat
        - id: JetpackBlackFilled
        - id: ClothingUniformJumpsuitOperative
        - id: ClothingUniformJumpskirtOperative
        - id: ClothingHeadsetAltSyndicate
        - id: ClothingEyesHudSyndicate

- type: entityTable
  id: SyndieMaintLoot
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      children:
      - id: ClothingUniformJumpsuitOperative
      - id: ClothingUniformJumpskirtOperative
    - id: ClothingBackpackDuffelSyndicate
    - id: CyberPen
    - id: CigPackSyndicate
    - id: ClothingBackpackDuffelSyndicatePyjamaBundle
    - id: ClothingBeltMilitaryWebbing
    - id: ClothingShoesBootsCombatFilled
    - id: ToolboxSyndicateFilled
    - id: BalloonSyn
    - id: WeaponSniperMosin
      weight: 2
    - id: ClothingHandsKnuckleDustersSyndicate

- type: entityTable
  id: MaintenanceLockerLoot
  table: !type:AllSelector
    children:
    - id: StrangePill
      prob: 0.20
    # Tools
    - !type:NestedSelector
      tableId: MaintToolsTable
      rolls: !type:RangeNumberSelector
        range: 1, 5
    # Fluff
    - !type:NestedSelector
      tableId: MaintFluffTable
      prob: 0.33
      rolls: !type:RangeNumberSelector
        range: 0, 2
    # Plushies
    - !type:NestedSelector
      tableId: AllPlushiesTable
      prob: 0.10
      rolls: !type:RangeNumberSelector
        range: 1, 2
    - !type:NestedSelector
      tableId: MaintenancePlushies
      prob: 0.02

    # Weapons
    - !type:NestedSelector
      tableId: MaintWeaponTable
      prob: 0.075
    # Syndie Loot
    - !type:NestedSelector
      tableId: SyndieMaintLoot
      prob: 0.05
    # Recursive
    - id: ClosetMaintenanceFilledRandom
      prob: 0.01

- type: entityTable
  id: MaintenancePlushies
  table: !type:GroupSelector
    children:
    - id: PlushieLizardJobBoxer
    - id: PlushieLizardJobClown
    - id: PlushieLizardJobLibrarian
    - id: PlushieLizardJobMime
    - id: PlushieLizardJobMusician
    - id: PlushieLizardJobPassenger
    - id: PlushieLizardJobReporter
    - id: PlushieLizardJobZookeeper

- type: entity
  id: ClosetMaintenanceFilledRandom
  suffix: Filled, Random
  parent: ClosetMaintenance
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: MaintenanceLockerLoot

- type: entity
  id: ClosetWallMaintenanceFilledRandom
  parent: ClosetWall
  suffix: Filled, Random
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: MaintenanceLockerLoot

