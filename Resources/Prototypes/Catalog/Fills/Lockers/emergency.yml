- type: entityTable
  id: FillEmergencyInflatables
  table: !type:AllSelector
    children:
    - id: InflatableWallStack5
    - id: InflatableDoorStack1

- type: entityTable
  id: FillEmergencyO2
  table: !type:AllSelector
    children:
    - !type:GroupSelector
      children:
      - id: EmergencyOxygenTankFilled
        weight: 4
      - id: OxygenTankFilled

- type: entityTable
  id: FillEmergencyN2
  table: !type:AllSelector
    children:
    - !type:GroupSelector
      children:
      - id: EmergencyNitrogenTankFilled
        weight: 4
      - id: NitrogenTankFilled

# Emergency lockers are intended to be somewhat random (for verisimilitude/suspense), so other than the bare essentials there should rarely be 100% guarenteed spawns
- type: entityTable
  id: FillLockerEmergencyStandard
  table: !type:AllSelector
    children:
    - id: BoxMRE
      prob: 0.1
    - id: ClothingMaskBreath
    - id: ClothingOuterSuitEmergency
    - id: MedkitOxygenFilled # technically doesn't fit N2 lockers, but we don't have an N2 version of this yet, and (aside from the emergency O2 tank) N2-breathing species can still use its contents
      prob: 0.2
    - id: ToolboxEmergencyFilled
      prob: 0.5
    - id: WeaponFlareGun
      prob: 0.1
    - !type:NestedSelector
      tableId: FillEmergencyInflatables

- type: entity
  parent: ClosetEmergency
  id: ClosetEmergencyFilledRandom
  suffix: Filled, Random
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillLockerEmergencyStandard
        - !type:NestedSelector
          tableId: FillEmergencyO2

- type: entity
  parent: ClosetWallEmergency
  id: ClosetWallEmergencyFilledRandom
  suffix: Filled, Random
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillLockerEmergencyStandard
        - !type:NestedSelector
          tableId: FillEmergencyO2

- type: entity
  parent: ClosetEmergencyN2
  id: ClosetEmergencyN2FilledRandom
  suffix: Filled, Random
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillLockerEmergencyStandard
        - !type:NestedSelector
          tableId: FillEmergencyN2

- type: entity
  parent: ClosetWallEmergencyN2
  id: ClosetWallEmergencyN2FilledRandom
  suffix: Filled, Random
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillLockerEmergencyStandard
        - !type:NestedSelector
          tableId: FillEmergencyN2

- type: entityTable
  id: FillLockerFireStandard
  table: !type:AllSelector
    children:
    - id: ClothingHeadHelmetFire
    - id: ClothingMaskGas
    - id: ClothingOuterSuitFire
    - id: CrowbarRed
    - !type:GroupSelector
      children:
      - id: FireExtinguisher
        weight: 98
      - id: SprayBottleWater #It's just budget cut after budget cut man
        weight: 2

- type: entity
  parent: ClosetFire
  id: ClosetFireFilled
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillLockerFireStandard
        - !type:GroupSelector # Chance to contain N2 instead of O2
          children:
          - !type:NestedSelector
            tableId: FillEmergencyO2
            weight: 4
          - !type:NestedSelector
            tableId: FillEmergencyN2

- type: entity
  parent: ClosetWallFire
  id: ClosetWallFireFilledRandom
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillLockerFireStandard
        - !type:GroupSelector # Chance to contain N2 instead of O2
          children:
          - !type:NestedSelector
            tableId: FillEmergencyO2
            weight: 4
          - !type:NestedSelector
            tableId: FillEmergencyN2
