# Player Core ancestries that are not already a stock species.
# Each one uses the humanoid doll. Pathfinder stats live on cfAncestry.

- type: species
  id: CF-Elf
  name: cf-ancestry-elf
  roundStart: true
  prototype: CFMobElf
  dollPrototype: CFAppearanceElf
  skinColoration: HumanToned
  minAge: 18
  youngAge: 100
  oldAge: 350
  maxAge: 600

- type: species
  id: CF-Gnome
  name: cf-ancestry-gnome
  roundStart: true
  prototype: CFMobGnome
  dollPrototype: CFAppearanceGnome
  skinColoration: HumanToned
  minAge: 18
  youngAge: 40
  oldAge: 200
  maxAge: 400

- type: species
  id: CF-Halfling
  name: cf-ancestry-halfling
