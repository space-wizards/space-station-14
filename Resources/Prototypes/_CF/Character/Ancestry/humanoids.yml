  youngAge: 20
  oldAge: 45
  maxAge: 70

- type: entity
  parent: AppearanceHuman
  id: CFAppearanceElf
  categories: [HideSpawnMenu]
  save: false
  components:
  - type: HumanoidProfile
    species: CF-Elf

- type: entity
  parent:
  - CFAppearanceElf
  - BaseSpeciesMobOrganic
  id: CFMobElf
  name: elf
  components:
  - type: HumanoidProfile
    species: CF-Elf
  - type: CF-Species
    species: CF-Elf
  - type: CFAtmosphereImmunity

