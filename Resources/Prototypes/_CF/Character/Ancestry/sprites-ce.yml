- type: entity
  parent: BaseSpeciesAppearance
  id: CFAppearanceInfernal
  categories: [HideSpawnMenu]
  save: false
  name: Infernal appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganCFInfernalTorso
      Head: OrganCFInfernalHead
      ArmLeft: OrganCFInfernalArmLeft
      ArmRight: OrganCFInfernalArmRight
      HandLeft: OrganCFInfernalHandLeft
      HandRight: OrganCFInfernalHandRight
      LegLeft: OrganCFInfernalLegLeft
      LegRight: OrganCFInfernalLegRight
      FootLeft: OrganCFInfernalFootLeft
      FootRight: OrganCFInfernalFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: CF-Human-Infernal

- type: entity
  parent:
  - CFAppearanceInfernal
  - BaseSpeciesMobOrganic
  id: CFMobInfernal
  name: Infernal
  components:
  - type: HumanoidProfile
    species: CF-Human-Infernal
  - type: CF-Species
    species: CF-Human-Infernal
  - type: CFAtmosphereImmunity

- type: entity
  id: OrganCFInfernalExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _CE/Mobs/Species/Infernal/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _CE/Mobs/Species/Infernal/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: CFCEInfernal

- type: entity
  parent: [OrganBaseTorsoSexed, OrganBaseTorso, OrganCFInfernalExternal]
  id: OrganCFInfernalTorso

- type: entity
  parent: [OrganBaseHeadSexed, OrganBaseHead, OrganCFInfernalExternal]
