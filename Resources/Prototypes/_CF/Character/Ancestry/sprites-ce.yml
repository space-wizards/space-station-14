# CarpFinder: Crystall Edge bodies. Art stays in Resources/Textures/_CE, with meta.json beside each RSI.
# Sprite species stay roundStart false so they are not their own ancestry.
# Infernal and Skeleton stay as textures only. They are not Pathfinder ancestries.

- type: species
  id: CF-Human-Edge
  name: cf-sprite-ce-human
  roundStart: false
  prototype: CFMobHumanEdge
  dollPrototype: CFAppearanceHumanEdge
