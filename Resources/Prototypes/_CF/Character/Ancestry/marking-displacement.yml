# CarpFinder: offsets human markings (hair, underwear, chest) onto imported bodies.
# Species-drawn ears, snouts, and tails set canBeDisplaced false, so these maps skip them.

- type: entity
  abstract: true
  id: CFMarkingDisplacementRodentia
  components:
  - type: VisualOrganMarkings
    markingsDisplacement:
      Head:
