# CarpFinder: imported bodies keep human hair, and add the ears and tail that body was drawn with.
# Human already limits hair and most other layers. Tail is raised above Human's zero.

- type: markingsGroup
  parent: Human
  id: CFRodentia
  limits:
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ RodentiaHeadTopEarMouse ]
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ RodentiaTailMouse ]
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false

