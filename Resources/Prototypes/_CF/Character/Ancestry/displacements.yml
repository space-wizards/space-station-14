# CarpFinder: stock Inventory displacement maps for imported bodies.
# Each clothing slot uses the state of that name in the species displacement.rsi.
# These bodies do not inherit AppearanceHuman, so without this a jacket is drawn on a human torso.

- type: entity
  abstract: true
  id: CFInventoryRodentia
  components:
  - type: Hands
    leftHandDisplacement:
      sizeMaps:
        32:
          sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
          state: inHand
    rightHandDisplacement:
      sizeMaps:
        32:
          sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
          state: inHand
  - type: Inventory
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: jumpsuit
      outerClothing:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: outerclothing
      gloves:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: hands
      head:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: head
      eyes:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: eyes
      ears:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: ears
      mask:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: mask
      neck:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: neck
      back:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: back
      belt:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: belt
      shoes:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: shoes
      suitstorage:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: suitStorage
      id:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: suitStorage

