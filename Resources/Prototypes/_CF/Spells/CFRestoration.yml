- type: entity
  parent: CFSpellTarget
  id: CFRestoration
  name: Restoration
  description: You ease the target's condition and restore 2d8 Hit Points.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 2
  - type: CFSpell
    spell: Restoration
    rank: 2
    delivery: Target
    rangeFeet: 5
    defense: None
    healDice: 2
    healDie: 8
    friendly: true
    includeSelf: true
  - type: EntityTargetAction
    canTargetSelf: true
