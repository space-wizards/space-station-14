# Homing spell bolts. Stock projectile damage is 0; the spell system applies the remaster effect on arrival.

- type: entity
  parent: BaseBullet
  id: CFSpellBolt
  categories: [ HideSpawnMenu ]
  name: spell bolt
  description: A bolt of magic that follows the creature it was aimed at.
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 0
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: spell
      shader: unshaded
  - type: TimedDespawn
    lifetime: 8

- type: entity
  parent: CFSpellBolt
  id: CFSpellBoltFire
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
