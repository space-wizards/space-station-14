# Pathfinder adventurer loadouts. The builder shop buys these; nothing is selected for free.

- type: loadout
  id: CFLoadoutLongsword
  inhand:
  - CFLongsword

- type: loadout
  id: CFLoadoutLongbow
  equipment:
    belt: CFQuiverFilled
  inhand:
  - CFLongbow

- type: loadout
  id: CFLoadoutLeatherArmor
  equipment:
    outerClothing: CFLeatherArmor

- type: loadout
  id: CFLoadoutHealingPotion
  inhand:
  - CFHealingPotionMinor

- type: loadoutGroup
  id: CFWeaponsMelee
  name: cf-loadout-group-weapons
  minLimit: 0
  maxLimit: 0
  defaultSelected: 0
  editorTab: Weapons
  loadouts:
  - CFLoadoutLongsword
  - CFLoadoutLongbow

- type: loadoutGroup
  id: CFDefenseArmor
  name: cf-loadout-group-defense-armor
  minLimit: 0
  maxLimit: 0
  defaultSelected: 0
  editorTab: Defense
  loadouts:
  - CFLoadoutLeatherArmor

- type: loadoutGroup
  id: CFGearBasics
  name: cf-loadout-group-gear-basics
  minLimit: 0
  maxLimit: 0
  defaultSelected: 0
  editorTab: Gear
  loadouts:
  - CFLoadoutHealingPotion

