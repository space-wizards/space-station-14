[game]
# CarpFinder: lobby on so you can build/select a character before joining
lobbyenabled = true
# Dev map for faster loading & convenience
map = "Dev"
# CarpFinder: Sandbox (not Secret) — solo Dev has no antag pool
defaultpreset = "Sandbox"
fallbackpreset = "Sandbox"
role_timers = false
admin_job_tracking = true
role_loadout_timers = false
# CarpFinder: default new characters prefer a CF adventurer job (must exist on Dev station jobs)
new_character_jobs = "CFAlpha"

[events]
enabled = false

[ghost]
role_time = 0.5
quick_lottery = true

[movement]
mob_pushing = true

[physics]
# Makes mapping annoying
grid_splitting = false

[procgen]
preload = false

[salvage]
expedition_cooldown = 30.0

[shuttle]
grid_fill = false
auto_call_time = 0
emergency = false
arrivals = false
preload_grids = false

[afk]
time = 0

[admin]
afk_time = 0
see_own_notes = true
new_player_threshold = 120

[ic]
# CarpFinder: must be false or spawn ignores your saved profile (RandomWithSpecies wipes CFBuild)
random_characters = false
random_species_weights = ""
ssd_sleep_time = 3600

[database]
# Change to postgres if needed
engine = "sqlite"
pg_host = "localhost"
pg_port = 5432
pg_database = "ss14"
pg_username = "postgres"
pg_password = "postgres"

[net]
max_rapid_connections = 413
max_ip_connections = 413
